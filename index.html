    <script>
        // --- DATA ---
        const WIKI_DATA = [
            { id: "eva_konzept", title: "Das EVA-Prinzip (Einstieg)", category: "eva_uebersicht", definition: "Das **EVA-Prinzip** ist das Fundament der IT: **E**ingabe, **V**erarbeitung, **A**usgabe.", content: "Jeder Computer der Welt, vom kleinen Smartphone bis zum riesigen Server, funktioniert im Kern exakt gleich. Man nennt das die Datenverarbeitungs-Kette:\n\n1. **Eingabe**: Ein Reiz von außen kommt herein. Das kann ein Klick auf die Maus sein, ein Wort auf der Tastatur oder ein Sprachbefehl. Ohne Eingabe wartet der Computer einfach.\n2. **Verarbeitung**: Der Computer nimmt diesen Reiz, übersetzt ihn in seine Sprache (Einsen und Nullen), rechnet damit und überlegt, was er tun soll.\n3. **Ausgabe**: Das Ergebnis wird so aufbereitet, dass wir Menschen es wieder verstehen können (z.B. als Bild auf dem Monitor oder als Ton aus dem Lautsprecher).\n\n**Vom EVA zum EVA-S**:\nDa wir heutzutage Ergebnisse nicht nur kurz sehen, sondern behalten wollen, wurde das Modell um das **S** für **Speicherung** erweitert. Das ist der Tresor. Erst die Speicherung sorgt dafür, dass Ihre Arbeit nach dem Ausschalten nicht im Nichts verschwindet.", businessValue: "Nutzen Sie das einfache EVA-Modell, um Kunden zu erklären, dass Hardware immer als geschlossene Kette funktioniert. Reißt ein Glied (z.B. ein schlechter Monitor bei der Ausgabe), leidet der ganze Workflow.", related: ["Zentraleinheit", "Software", "Speicherung"], tags: ["Grundlagen", "Einstieg"] },
            { id: "eingabe_konzept", title: "Eingabe (Das Tor zum System)", category: "eingabe", definition: "Die **Eingabe** ist die erste Phase des EVA-S Prinzips. Hier gelangen Befehle des Nutzers in das digitale System.", content: "In der **Eingabe-Phase** übersetzen wir menschliche Wünsche in eine Sprache, die der Computer versteht. Stellen Sie sich das wie den **Posteingang** in einem Büro vor: Wenn der Postbote keine Briefe oder E-Mails bringt, sitzt der Sachbearbeiter Däumchen drehend am Schreibtisch.\n\nEingabegeräte sind unsere 'Sinnesorgane' für den Computer:\n- Die **Tastatur** ist der Stift.\n- Die **Maus** ist der Zeigefinger.\n- Das **Mikrofon** ist das Ohr des Computers.\n- Eine **Kamera** (Webcam) ist sein Auge.\n\nDa wir als Menschen physisch mit diesen Geräten arbeiten, muss hier alles perfekt zu unserem Körper passen. Ein klemmender Stift nervt – eine schlechte Maus macht auf Dauer krank.", businessValue: "Eine hochwertige **Eingabe-Peripherie** (wie gute Mäuse und Tastaturen) steigert die Motivation der Mitarbeiter, da Frust durch hakelige Bedienung vermieden und die Gesundheit geschont wird.", related: ["Tastatur", "Maus", "Scanner"], tags: ["Input", "EVA-S"] },
            { id: "verarbeitung_konzept", title: "Verarbeitung (Das Herz der IT)", category: "verarbeitung", definition: "In der **Verarbeitung** werden die Rohdaten durch Rechenoperationen in nutzbare Informationen verwandelt.", content: "Das ist die Fabrik im Inneren des Gehäuses, in der die eigentliche Arbeit passiert. Bleiben wir beim Büro-Beispiel:\n\n- Der **Prozessor (CPU)** ist der kluge Sachbearbeiter. Er liest, rechnet und trifft Entscheidungen. Je klüger er ist, desto schneller geht es.\n- Der **Arbeitsspeicher (RAM)** ist die Tischplatte seines Schreibtisches. Je größer der Tisch, desto mehr Akten kann er gleichzeitig offen liegen haben, ohne ständig in den Schrank laufen zu müssen.\n- Das **Mainboard** ist das Bürogebäude mit seinen Fluren und Gängen, das dafür sorgt, dass Akten, Strom und Informationen sicher von A nach B kommen.\n\nAlle drei müssen perfekt zusammenspielen. Ein super Sachbearbeiter an einem winzigen Tisch wird trotzdem langsam sein.", businessValue: "Die Phase der **Verarbeitung** entscheidet über die Geschwindigkeit. Ein Kunde, der keine Wartezeiten ('Sanduhr') will, braucht hier perfekt abgestimmte Bauteile.", related: ["CPU", "RAM", "Mainboard", "Grafikkarte"], tags: ["Logik", "EVA-S"] },
            { id: "ausgabe_konzept", title: "Ausgabe (Das Sichtbare)", category: "ausgabe", definition: "Die **Ausgabe** ist die Präsentation der verarbeiteten Daten für Menschen.", content: "In der **Ausgabe-Phase** verlässt das digitale Ergebnis den Computer und wird in die reale Welt zurückübersetzt. \n\nNachdem der 'Sachbearbeiter' (CPU) das fertige Dokument berechnet hat, muss er es uns zeigen. Das macht er:\n- **Visuell** über den Monitor (wir sehen das Bild).\n- **Physisch** über den Drucker (wir haben Papier in der Hand).\n- **Akustisch** über Lautsprecher oder Kopfhörer (wir hören den Gesprächspartner).\n\nEin oft unterschätzter Punkt: Die Ausgabe ist der einzige Teil, den der Endanwender wirklich wahrnimmt. Ein PC kann im Inneren noch so schnell rechnen – wenn der Monitor unscharf ist, fühlt sich das ganze System alt und schlecht an.", businessValue: "Die **Ausgabe** ist das, was der Kunde am Ende 'sieht'. Eine brillante Darstellung auf einem 4K-Monitor erhöht die wahrgenommene Wertigkeit der gesamten IT-Ausstattung massiv.", related: ["Monitor", "Drucker", "Lautsprecher"], tags: ["Output", "EVA-S"] },
            { id: "speicherung_konzept", title: "Speicherung (Das Gedächtnis)", category: "speicherung", definition: "Die **Speicherung** sichert Daten dauerhaft, damit sie auch nach dem Ausschalten verfügbar bleiben.", content: "Ohne die **Speicherung** wäre der Computer extrem vergesslich – wie eine alte Schreibmaschine, bei der man das Papier nach jedem Tastendruck wegwirft. \n\nDas **S** im EVA-S Prinzip ist das Langzeit-Archiv:\n- Wenn wir den Computer ausschalten, wird der Schreibtisch (RAM) komplett leergefegt.\n- Alles, was überleben soll, muss in die Regale geräumt werden.\n- Diese Regale sind moderne **SSDs** (pfeilschnell) oder klassische **Festplatten** (viel Platz, aber langsamer).\n- Wer auf Nummer sicher gehen will, lagert Kopien der wichtigen Akten direkt in einem externen Lager – der **Cloud**.\n\nSpeicherplatz ist heute extrem günstig, aber die Geschwindigkeit und Ausfallsicherheit dieses Archivs sind erfolgskritisch.", businessValue: "Datensicherheit ist das Top-Thema für jedes Unternehmen. Ein Kunde investiert in **Speicherung**, um sein wertvollstes Gut – seine Geschäftsdaten – niemals zu verlieren.", related: ["SSD", "HDD", "Cloud-Speicher"], tags: ["Archiv", "EVA-S"] },
            { id: "doku_uebersicht", title: "Projekt-Doku: Übersicht", category: "sprint_berichte", definition: "Zentrale Übersicht über das IT-Wiki-Projekt und dessen Entwicklungsziele.", content: "<h3 class=\"text-xl font-bold text-slate-800 dark:text-slate-100 mb-4\">Scrum Ablauf</h3>\n<img src=\"Scrum_Ablauf.png\" alt=\"Scrum Ablauf Diagramm\" class=\"w-full max-w-4xl rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 mb-10\" onerror=\"this.onerror=null; this.src='https://placehold.co/800x400/eef2ff/4f46e5?text=Scrum+Ablauf'\">\n\nDieses IT-Wiki wurde als interaktives Nachschlagewerk für unser Vertriebsteam entwickelt.\n\n**Kernziele des Projekts:**\n- Schneller Zugriff auf fundiertes Hardware-Wissen während Kundengesprächen.\n- Bereitstellung einheitlicher, nutzenorientierter Verkaufsargumente (Pitches).\n- Strukturierte Erklärung durch das EVA-S Prinzip.\n\nIn diesem Dokumentationsbereich finden Sie alle Protokolle zu den Entwicklungs-Sprints und Retrospektiven, um den Fortschritt nachvollziehen zu können.\n\n<h3 class=\"text-xl font-bold text-slate-800 dark:text-slate-100 mb-4 mt-10\">Rollenverteilung</h3><div class=\"overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800\"><table class=\"w-full text-left border-collapse text-sm\"><thead class=\"bg-slate-800 dark:bg-slate-900 text-white\"><tr><th class=\"p-4 font-black\">ROLLE</th><th class=\"p-4 font-black\">NAME</th><th class=\"p-4 font-black\">AUFGABEN</th></tr></thead><tbody class=\"text-slate-700 dark:text-slate-300\"><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">PRODUCT OWNER</td><td class=\"p-4\">Malin</td><td class=\"p-4\">Anforderungen sammeln, Prioritäten festlegen</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">SCRUM MASTER</td><td class=\"p-4\">Nico</td><td class=\"p-4\">Achtet auf SCRUM-Ablauf, moderiert Dailys</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">ENTWICKLUNGSTEAM</td><td class=\"p-4\">Erza, Nico, Malin, Kasija</td><td class=\"p-4\">Inhalte erarbeiten (Hardware, EVA usw.)</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">DOKUMENTATION</td><td class=\"p-4\">Erza, Malin</td><td class=\"p-4\">Pflegt die Wissensdatenbank, Pflegt das Word Dokument</td></tr><tr><td class=\"p-4 font-bold\">QUALITÄTSSICHERUNG</td><td class=\"p-4\">Erza, Kasija</td><td class=\"p-4\">Prüft Verständlichkeit & Vollständigkeit</td></tr></tbody></table></div>\n\n<h3 class=\"text-xl font-bold text-slate-800 dark:text-slate-100 mb-4 mt-10\">Risikoanalyse</h3><div class=\"overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800\"><table class=\"w-full text-left border-collapse text-sm\"><thead class=\"bg-slate-800 dark:bg-slate-900 text-white\"><tr><th class=\"p-4 font-black\">Risiko</th><th class=\"p-4 font-black\">Beschreibung</th><th class=\"p-4 font-black\">Mögliche Auswirkungen</th><th class=\"p-4 font-black\">Gegenmaßnahmen</th></tr></thead><tbody class=\"text-slate-700 dark:text-slate-300\"><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Unklare Aufgabenverteilung</td><td class=\"p-4\">Aufgaben und Verantwortlichkeiten sind nicht eindeutig festgelegt</td><td class=\"p-4\">Doppelarbeit, vergessene Aufgaben, Verzögerungen im Projekt</td><td class=\"p-4\">Klare Zuordnung von Features und Tasks, Pflege des Kanban-Boards, regelmäßige Weeklys</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Zeitmangel durch zu große Aufgaben</td><td class=\"p-4\">Tasks sind zu umfangreich oder schlecht eingeplant</td><td class=\"p-4\">Sprintziele werden nicht erreicht, Zeitdruck vor der Abgabe</td><td class=\"p-4\">Tasks klein und konkret formulieren, Aufgaben im Weekly nachschärfen</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Fachlich falsche oder ungenaue Inhalte</td><td class=\"p-4\">Fehlendes technisches Wissen führt zu falschen Erklärungen</td><td class=\"p-4\">Wissensdatenbank ist unzuverlässig, falsche Kundenberatung</td><td class=\"p-4\">Gegenseitige Kontrolle im Team, Nutzung von Unterrichtsunterlagen, Rückfragen an Lehrkraft</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Inhalte zu technisch für den Vertrieb</td><td class=\"p-4\">Zu viele Fachbegriffe oder komplizierte Erklärungen</td><td class=\"p-4\">Zielgruppe versteht Inhalte nicht, geringe Nutzung der Datenbank</td><td class=\"p-4\">Einfache Sprache verwenden, Praxisbeispiele einbauen, Inhalte gegenlesen lassen</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Uneinheitliche Struktur und Sprache</td><td class=\"p-4\">Unterschiedliche Schreibstile und Aufbauten</td><td class=\"p-4\">Unübersichtlicher Gesamteindruck, schlechte Lesbarkeit</td><td class=\"p-4\">Einheitliche Struktur festlegen (EVA-Prinzip), Abschluss-Review durchführen</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Mangelnde Teamkommunikation</td><td class=\"p-4\">Fehlende oder unregelmäßige Abstimmungen</td><td class=\"p-4\">Missverständnisse, unklarer Projektstand</td><td class=\"p-4\">Regelmäßige Weeklys, offene Kommunikation, transparenter Fortschritt im Kanban-Board</td></tr><tr class=\"border-b border-slate-100 dark:border-slate-700\"><td class=\"p-4 font-bold\">Technische Probleme mit Tools</td><td class=\"p-4\">Probleme mit Word, Conceptboard oder Dateizugriff</td><td class=\"p-4\">Zeitverlust, möglicher Datenverlust</td><td class=\"p-4\">Regelmäßiges Speichern, gemeinsame Ablage, klare Dateinamen</td></tr><tr><td class=\"p-4 font-bold\">Pflichtbegriffe nicht vollständig abgedeckt</td><td class=\"p-4\">Begriffe aus dem Dokument „Wichtige Begriffe“ fehlen</td><td class=\"p-4\">Anforderungen nicht erfüllt, Punktabzug</td><td class=\"p-4\">Checkliste verwenden, Vollständigkeit vor Abgabe prüfen</td></tr></tbody></table></div>", businessValue: "Eine transparente Dokumentation sichert das Projektwissen und beschleunigt das Onboarding neuer Vertriebsmitarbeiter.", related: ["sprint1", "sprint2", "retro"], tags: ["Projekt", "Übersicht"] },
            { id: "sprint1", title: "Dokumentation: Sprint 1", category: "sprint_berichte", definition: "Zeitraum: Projektbeginn bis 30.04.2026. Fokus: Grundstruktur und Kernkonzepte.", content: "Im ersten Sprint haben wir die Basis für die Wissensdatenbank geschaffen.\n\n**Erreichte Meilensteine:**\n- Festlegung des **EVA-S Prinzips** als Navigationsstruktur.\n- Erstellung des **Glossars** mit allen geforderten Fachbegriffen.\n- Entwicklung der **Büro-Analogie** zur Erklärung komplexer Hardware-Vorgänge.\n- Implementierung der **Suchfunktion** und des interaktiven Designs.\n\n**Sprint-Retrospektive**\n\n**Was lief gut?**\n- Die Zusammenarbeit im Team hat sehr gut funktioniert. Aufgaben wurden zuverlässig bearbeitet und im Team abgestimmt.\n- Das Kanban-Board hat dabei geholfen, den Überblick über den aktuellen Stand der Aufgaben zu behalten.\n- Auch die Umsetzung als Website ist gut gelungen und die Inhalte konnten verständlich dargestellt werden.\n\n**Was lief nicht optimal?**\n- Im Projektverlauf hat sich die ursprüngliche Planung leicht verändert, da sich die Umsetzungsform angepasst hat.\n- Dadurch mussten einige Aufgaben neu priorisiert und teilweise überarbeitet werden.\n\n**Was können wir verbessern?**\n- Die Aufgaben können noch etwas klarer priorisiert werden, um schneller zu erkennen, was aktuell am wichtigsten ist.\n- Außerdem könnten Änderungen im Projekt noch früher abgestimmt werden, um den Arbeitsfluss weiter zu verbessern.\n\n**Konkrete Maßnahmen für den nächsten Sprint**\n- Aufgaben im Kanban-Board klar priorisieren\n- Änderungen frühzeitig im Team abstimmen\n- Regelmäßige kurze Abstimmungen beibehalten", businessValue: "Sprint 1 stellt sicher, dass das Team eine gemeinsame Sprache spricht und das Grundgerüst steht.", related: ["EVA-Prinzip", "Sprint 2"], tags: ["SCRUM", "Sprint 1"] },
            { id: "sprint2", title: "Dokumentation: Sprint 2", category: "sprint_berichte", definition: "Zeitraum: 01.05.2026 bis 21.05.2026. Fokus: Detailtiefe und Finalisierung.", content: "Der zweite Sprint dient der inhaltlichen Vertiefung und dem Feinschliff.\n\n**Geplante Aufgaben:**\n- Detaillierte Beschreibung von **Spezial-Hardware** (z.B. Plotter, Workstations).\n- Ausarbeitung technischer **Schnittstellen** (HDMI 2.1 vs DisplayPort 1.4).\n- Abschlusspräsentation und Projektabgabe am **21.05.2026**.", businessValue: "Ziel ist ein marktreifes Produkt, das sofort für neue Vertriebler als Nachschlagewerk genutzt werden kann.", related: ["Sprint 1", "Retrospektive"], tags: ["SCRUM", "Sprint 2"] },
            { id: "ram", title: "Arbeitsspeicher (RAM)", image: "RAM.png", category: "verarbeitung", definition: "Flüchtiger Kurzzeitspeicher für laufende Prozesse.", content: "Der Arbeitsspeicher (RAM, Random Access Memory) ist wie die **Tischplatte Ihres Schreibtisches**.\n\nJe größer die Tischplatte ist, desto mehr Akten (Programme, Browser-Tabs, Excel-Tabellen) können Sie gleichzeitig offen liegen haben, ohne den Überblick zu verlieren oder Platznot zu bekommen. Wenn der RAM voll ist, muss der PC anfangen, Dinge vorübergehend zurück in den Schrank (die SSD/Festplatte) zu räumen. Dieser Vorgang kostet enorm viel Zeit – der Computer fängt an zu 'hängen' und der Mauszeiger wird zur Eieruhr.\n\nWichtig zu wissen: Der RAM ist ein *flüchtiger* Speicher. Sobald der Strom weggenommen wird (PC fährt herunter), ist die Tischplatte komplett leer. Deshalb müssen wir Dokumente immer erst 'Speichern', bevor wir Feierabend machen.", businessValue: "Genug RAM ist die günstigste Lebensversicherung gegen frustrierte Mitarbeiter. Wer viel Multitasking betreibt (Teams, Outlook, Chrome und CRM gleichzeitig offen), sollte niemals beim Arbeitsspeicher sparen – 16 GB sind heute das Minimum für Büro-PCs.", related: ["CPU", "SSD"], tags: ["Hardware", "Speed"] },
            { id: "cpu", title: "Prozessor (CPU)", image: "CPU.png", category: "verarbeitung", definition: "Die Zentraleinheit und das logische 'Gehirn' des Computers.", content: "Die CPU (Central Processing Unit) ist der **fleißige Sachbearbeiter** im Inneren des Rechners. Er nimmt Aufgaben entgegen, rechnet, vergleicht und gibt Befehle an alle anderen Bauteile weiter.\n\nDie Leistung eines Prozessors wird durch zwei Hauptdinge bestimmt:\n1. **Die Taktrate (Gigahertz / GHz)**: Das ist die Arbeitsgeschwindigkeit des Sachbearbeiters. Je mehr GHz, desto schneller kann er Stempel auf Papiere drücken.\n2. **Die Kerne (Cores)**: Moderne Prozessoren haben nicht nur einen, sondern 4, 8, 16 oder mehr Kerne. Das ist so, als würden Sie nicht nur einen, sondern gleich ein ganzes Team von Sachbearbeitern an den Schreibtisch setzen, die gleichzeitig an unterschiedlichen Aufgaben arbeiten können.\n\nWenn ein PC alt wird, fühlt sich das so an, als käme der Sachbearbeiter mit dem Stapel an neuen Akten einfach nicht mehr hinterher.", businessValue: "Ein schneller Prozessor spart jeden Tag Arbeitszeit. Argumentieren Sie mit Langlebigkeit: Eine starke CPU sorgt dafür, dass der Rechner auch in 4 Jahren noch mit kommenden, anspruchsvolleren Software-Updates flüssig zurechtkommt.", related: ["Zentraleinheit", "Mainboard", "RAM"], tags: ["Hardware", "Gehirn"] },
            { id: "ssd", title: "Solid State Drive (SSD)", category: "speicherung", definition: "Elektronisches Langzeit-Speichermedium völlig ohne bewegliche Teile.", content: "Die SSD (Solid State Drive) hat die IT-Welt revolutioniert. Sie ist das **moderne, digitale Aktenarchiv**.\n\nFrüher hatten wir magnetische Festplatten (HDDs), die wie alte Plattenspieler funktioniert haben: Eine Scheibe drehte sich, und ein mechanischer Arm musste die Daten suchen. Eine SSD funktioniert stattdessen wie ein riesiger USB-Stick. Daten werden rein elektronisch in winzigen Speicherzellen abgelegt.\n\nDas hat drei massive Vorteile:\n1. **Geschwindigkeit**: Daten sind praktisch in Millisekunden verfügbar. Ein PC mit SSD startet in wenigen Sekunden statt Minuten.\n2. **Robustheit**: Da sich im Inneren nichts bewegt, überlebt ein Laptop mit SSD auch mal einen Stoß oder leichten Sturz.\n3. **Lautlosigkeit**: SSDs machen keine surrenden oder klickenden Geräusche.", businessValue: "Der Austausch einer alten HDD gegen eine moderne SSD ist das spürbarste Upgrade, das man machen kann. Kein Kunde sollte heute noch Laptops oder Office-PCs ohne SSD kaufen – der Geschwindigkeitsgewinn ist gigantisch.", related: ["HDD", "Speicherung"], tags: ["Speed", "Hardware"] },
            { id: "monitor", title: "Monitor", category: "ausgabe", definition: "Das wichtigste visuelle Ausgabegerät für den Nutzer.", content: "Der Monitor ist das **digitale Fenster zur Arbeitswelt**. Egal wie teuer der PC unter dem Schreibtisch war, die ganze Arbeit wird über dieses Panel abgewickelt.\n\nWas macht einen guten Monitor aus?\n- **Die Größe (Zoll)**: Standard sind heute 24 oder 27 Zoll. Mehr Fläche bedeutet, dass man zwei Programme (z.B. Mail und Word) direkt nebeneinander legen kann, ohne ständig Fenster wechseln zu müssen.\n- **Die Schärfe (Auflösung)**: Ein Full-HD-Monitor hat ca. 2 Millionen Bildpunkte, ein 4K-Monitor über 8 Millionen. Je mehr Punkte, desto schärfer die Schrift und desto weniger ermüden die Augen beim Lesen.\n- **Ergonomie**: Ein guter Monitor lässt sich in der Höhe verstellen, um Nackenschmerzen vorzubeugen.", businessValue: "Monitore werden extrem unterschätzt. Der Verkauf eines zweiten Bildschirms (Dual-Monitor-Setup) steigert die Produktivität eines Mitarbeiters laut Studien um bis zu 30%. Das ist ein ROI (Return on Investment) von wenigen Wochen!", related: ["Auflösung", "Grafikkarte"], tags: ["Hardware", "Anzeige"] },
            { id: "workstation", title: "Workstation", category: "bauformen", definition: "Ein massiv leistungsgesteigerter PC für hochspezialisierte Profi-Anwendungen.", content: "Eine Workstation ist kein normaler Bürorechner, sondern der **Schwerlast-Kran der IT-Welt**.\n\nWährend normale Desktop-PCs für E-Mails, Tabellen und leichtes Multitasking gebaut sind, ist eine Workstation für extreme Aufgaben konzipiert:\n- Hollywood-reife Videobearbeitung (Rendern)\n- Komplexe 3D-CAD-Zeichnungen von Architekten\n- Wissenschaftliche und medizinische Berechnungen (z.B. Wettermodelle oder KI)\n\nDafür sind diese Maschinen oft mit speziellen, extrem ausfallsicheren Bauteilen (wie ECC-Speicher, der Fehler selbst korrigiert, und speziellen Quadro-Grafikkarten) ausgestattet. Sie sind darauf ausgelegt, wochenlang unter 100% Volllast zu laufen, ohne abzustürzen.", businessValue: "Workstations sind teuer, aber Ausfallzeiten sind für Profis noch teurer. Wenn ein Architekt wegen eines stotternden PCs Däumchen dreht, kostet das die Firma tausende Euro. Workstations verkaufen sich über Zuverlässigkeit und extreme Leistung.", related: ["Desktop-PC", "Grafikkarte"], tags: ["Leistung", "Profi"] },
            { id: "cloud", title: "Cloud-Speicher", category: "speicherung", definition: "Speicherplatz auf entfernten Groß-Servern, zugänglich über das Internet.", content: "Cloud-Speicher (wie Microsoft OneDrive, Google Drive oder Dropbox) bedeutet ganz einfach: Sie **mieten ein sicheres Schließfach in einem gigantischen Rechenzentrum**, anstatt einen Tresor in Ihr eigenes Büro zu stellen.\n\nIhre Dateien liegen nicht mehr nur auf der lokalen Festplatte (SSD) Ihres Computers, sondern werden verschlüsselt ins Internet hochgeladen. \n\nDas bietet geniale Vorteile:\n- **Mobilität**: Sie können ein Word-Dokument am PC im Büro anfangen, im Zug auf dem Tablet weiterlesen und abends auf dem Smartphone bearbeiten.\n- **Zusammenarbeit**: Mehrere Kollegen können zeitgleich im selben Dokument schreiben.\n- **Sicherheit**: Wenn Ihr Laptop abbrennt oder gestohlen wird, sind die Daten in der Cloud noch immer zu 100% da. Ein neues Gerät reicht, und Sie machen nahtlos weiter.", businessValue: "Cloud ist maximale Flexibilität. Gerade für den Vertrieb oder für Unternehmen mit viel Home-Office ist lokaler Speicher oft ein Flaschenhals. Cloud-Lösungen sind nicht nur Speicher, sondern ein Booster für effizientes Arbeiten.", related: ["SSD", "Speicherung"], tags: ["Internet", "Modern"] },
            { id: "energieeffizienz", title: "Energieeffizienz", category: "grundlagen", definition: "Das Verhältnis von erbrachter Rechenleistung zum benötigten Stromverbrauch.", content: "In der IT bedeutet Energieeffizienz: Wie viel nützliche Arbeit kann der Rechner erledigen, bevor er eine Kilowattstunde Strom aus der Steckdose gezogen hat? Man kann es mit dem **Spritverbrauch eines Autos** vergleichen.\n\nEin extrem starker Prozessor nützt wenig, wenn er dabei so viel Strom zieht und so heiß wird, dass die Lüfter wie ein Staubsauger klingen.\n- Gute Netzteile haben **80 PLUS-Zertifikate** (Bronze, Silber, Gold). Das bedeutet, sie wandeln den Strom aus der Wand fast verlustfrei für den PC um.\n- Moderne Chipsätze (z.B. von Apple oder sparsamen Intel/AMD Modellen) rechnen heute dreimal so schnell wie noch vor 5 Jahren, brauchen dafür aber nur halb so viel Strom.", businessValue: "Energieeffizienz ist bares Geld. Raten Sie Geschäftskunden, nicht nur auf den Anschaffungspreis zu schauen, sondern auf die TCO (Total Cost of Ownership). Bei 100 Bürorechnern, die 8 Stunden am Tag laufen, spart energieeffiziente Hardware zehntausende Euro an Stromkosten.", related: ["CPU", "Desktop-PC"], tags: ["Kosten", "Umwelt", "Beratung"] },
            { id: "externer_speicher", title: "Externer Speicher (z. B. USB-Stick, externe Festplatte)", image: "USB.png", category: "speicherung", definition: "Mobile Speichermedien, die meist über USB an das System angeschlossen werden.", content: "Externe Speicher sind Ihr **digitaler Aktenkoffer für unterwegs**. Anders als interne Platten, sind diese nicht im Gehäuse verbaut, sondern lassen sich einfach anstöpseln und wieder abziehen.\n\nEs gibt drei Haupt-Arten:\n1. **USB-Sticks**: Winzig, leicht und perfekt, um mal schnell eine PowerPoint-Präsentation mit in den Konferenzraum zu nehmen.\n2. **Externe HDDs (mechanisch)**: Groß und sehr günstig. Super als „Datengrab“ für tausende von Fotos oder Archive, die man selten braucht.\n3. **Externe SSDs**: Kompakter als HDDs, extrem robust und rasend schnell. Wenn man unterwegs große Videodateien schneiden muss, sind externe SSDs die beste Wahl, da sie Stürze vom Tisch überleben.", businessValue: "Der Kunde muss sensibilisiert werden: Jeder PC kann kaputtgehen oder von Viren befallen werden. Ein externer Speicher, der in der Schublade liegt, ist das einfachste und günstigste Offline-Backup gegen Datenverlust am Einzelplatz.", related: ["SSD", "Cloud-Speicher", "Speicherung"], tags: ["Backup", "Mobil", "Hardware"] },
            { id: "hardware", title: "Hardware", category: "grundlagen", definition: "Die physischen, greifbaren Komponenten eines IT-Systems.", content: "Hardware ist **alles, was Sie anfassen, werfen oder fallen lassen können**. \n\nEs ist der grobe, materielle Körper der Maschine. Zum Körper gehören das Gehäuse, die Platinen, die Kabel, der Monitor, die Tastatur und die winzigen Mikrochips im Inneren. Ohne Software (dem Verstand) ist Hardware allerdings komplett dumm – sie ist einfach nur ein teurer Haufen Metall, Plastik und Silizium, der darauf wartet, Befehle zu bekommen.", businessValue: "Der Verkauf von Premium-Hardware sorgt nicht nur für längere Abschreibungszyklen beim Kunden, sondern auch für weniger Support-Aufwand (weniger Tickets wegen kaputter Teile).", related: ["Software", "Peripherie"], tags: ["Grundbegriff"] },
            { id: "software", title: "Software", category: "grundlagen", definition: "Sammelbegriff für Programme und Betriebssysteme.", content: "Software ist das genaue Gegenteil von Hardware: Sie ist **der Verstand, der Geist und das Wissen des Computers**. Software kann man nicht anfassen, sie existiert nur als Code aus Einsen und Nullen.\n\nEs gibt verschiedene Ebenen:\n- Das **Betriebssystem** (z.B. Windows) ist das Unterbewusstsein. Es regelt, wie das Herz (die CPU) schlägt.\n- Die **Anwendungsprogramme** (z.B. Word, Excel, das CRM-System) sind die konkreten Aufgaben, die wir erledigen wollen.\n\nHardware und Software müssen perfekt aufeinander abgestimmt sein. Die beste Hardware bringt nichts, wenn die Software veraltet oder fehlerhaft programmiert ist.", businessValue: "Verkaufen Sie immer Lösungen, nicht nur Boxen. Erst die richtige Software-Lizenz (z.B. Microsoft 365) in Kombination mit der passenden Hardware macht den Arbeitsplatz des Kunden produktiv.", related: ["Hardware", "Kompatibilität"], tags: ["Programme", "Immateriell"] },
            { id: "peripherie_konzept", title: "Peripherie", category: "eingabe", definition: "Zusatzgeräte, die von außen an den Computer angeschlossen werden.", content: "Das Wort 'Peripherie' kommt aus dem Griechischen und bedeutet so viel wie 'Umfeld' oder 'Randgebiet'. In der IT sind Peripheriegeräte alle Bauteile, die **nicht zwingend zum Überleben des Computers gehören, aber ihn erst für uns Menschen nutzbar machen**.\n\nWenn der PC der Torso ist, sind Peripheriegeräte unsere Werkzeuge, Arme und Beine.\nDazu gehören:\n- Alles zur Eingabe (Tastatur, Maus, Grafiktablett, Scanner)\n- Alles zur Ausgabe (Monitor, Drucker, Lautsprecher, Beamer)\n- Externe Zubehörteile wie Webcams oder externe Festplatten.", businessValue: "Ein nackter PC ist billig. Die Marge für uns (und der Mehrwert für den Kunden) liegt oft in einer exzellent ausgewählten, ergonomischen Peripherie, die den Arbeitsplatz erst komplett macht.", related: ["Hardware", "Eingabe", "Ausgabe"], tags: ["Zubehör"] },
            { id: "zentraleinheit", title: "Zentraleinheit", category: "grundlagen", definition: "Der Kern des Computers, bestehend aus Gehäuse und allen internen lebenswichtigen Bauteilen.", content: "Die Zentraleinheit ist quasi **der Rumpf des Computers**. Wenn Sie einen klassischen Desktop-PC ansehen, dann ist der große 'Kasten', der oft unterm Tisch steht, die Zentraleinheit.\n\nIn diesem Kasten befinden sich alle lebenswichtigen Organe, die für die Informationsverarbeitung (Verarbeitung & Speicherung aus dem EVA-S Modell) zuständig sind:\n- Das Mainboard (das Skelett)\n- Der Prozessor (das Gehirn)\n- Der Arbeitsspeicher (der Kurzzeitspeicher)\n- Die SSD/HDD (das Langzeitgedächtnis)\n- Das Netzteil (die Stromversorgung)\n\nTastatur und Monitor gehören **nicht** zur Zentraleinheit, sie sind Peripherie.", businessValue: "Die Zentraleinheit ist die langlebigste Investition des Kunden. Ein gut geplantes System kann später durch einfachen RAM- oder Festplatten-Tausch noch Jahre weiter betrieben werden.", related: ["CPU", "Mainboard", "Hardware"], tags: ["Systemkern"] },
            { id: "tastatur", title: "Tastatur", category: "eingabe", definition: "Das primäre Eingabegerät für Text, Zahlen und komplexe Systembefehle.", content: "Die Tastatur (Keyboard) ist die **direkteste Schnittstelle zwischen menschlichen Gedanken und dem PC**. Für die meisten Büroarbeiter ist sie das Werkzeug, das sie am Tag am häufigsten anfassen.\n\nEs gibt deutliche Unterschiede in der Bauart:\n- **Membrantastaturen (Folientastaturen)**: Meist günstig, flach und leise. Sie fühlen sich oft etwas 'schwammig' an.\n- **Mechanische Tastaturen**: Unter jeder Taste sitzt ein echter, physischer Schalter. Sie sind lauter, geben den Fingern aber ein geniales Feedback. Wer viel tippt, schwört oft auf mechanische Tasten.\n- **Ergonomische Tastaturen**: Sind oft in der Mitte geteilt und gewellt, um die Hände in einer natürlichen, geraden Haltung zu halten und Sehnenscheidenentzündungen vorzubeugen.", businessValue: "Für Vielschreiber (Sekretariat, Buchhaltung, Entwickler) ist eine exzellente Tastatur kein Luxus, sondern Arbeitsschutz. Eine billige Tastatur kostet den Kunden auf Dauer durch Tippfehler und Schmerzen mehr als eine gute.", related: ["Maus", "Eingabe"], tags: ["Hardware", "Input"] },
            { id: "maus", title: "Maus", category: "eingabe", definition: "Ein Eingabegerät zur präzisen Steuerung des Cursors auf grafischen Oberflächen.", content: "Die Computer-Maus ist unser **virtueller Zeigefinger auf dem Bildschirm**. Sie übersetzt unsere Handbewegungen auf dem Schreibtisch direkt in Bewegungen des Cursors (Pfeil).\n\nModerne Mäuse nutzen optische Sensoren oder Laser, um den Untergrund zu scannen und die Bewegung zu berechnen. \n- **Kabellos vs. Kabel**: Kabellose Mäuse sorgen für einen aufgeräumten Schreibtisch, brauchen aber ab und zu Batterien oder müssen geladen werden.\n- **Vertikalmäuse**: Ein großer Trend in der Ergonomie! Man greift sie nicht flach von oben, sondern seitlich wie bei einem Handschlag. Das entlastet die Handgelenke und verhindert den berüchtigten 'Mausarm' (RSI-Syndrom).", businessValue: "Ergonomische Vertikal- oder Trackball-Mäuse sind ein hervorragender Upselling-Artikel, der zeigt, dass Sie sich um die Gesundheit der Mitarbeiter des Kunden kümmern.", related: ["Tastatur", "Eingabe"], tags: ["Peripherie", "Ergonomie"] },
            { id: "scanner", title: "Scanner", category: "eingabe", definition: "Ein Gerät, das physische Dokumente in digitale Bild- oder Textdateien umwandelt.", content: "Ein Scanner ist wie eine **digitale Kopiermaschine, die Papier in Einsen und Nullen verwandelt**.\n\nWenn ein Kunde noch viele Papierrechnungen, Verträge oder Skizzen bekommt, benötigt er einen Scanner. Das Dokument wird beleuchtet und zeilenweise abgetastet.\n- **Flachbettscanner**: Gut für Bücher oder empfindliche Dokumente. Das Blatt wird aufgelegt.\n- **Dokumentenscanner (ADF)**: Ein automatischer Papiereinzug. Zieht einen Stapel von 50 Blättern rasend schnell nacheinander durch. Ideal für die Buchhaltung.\n- **OCR-Software**: Das ist der Zaubertrick moderner Scanner. OCR (Optical Character Recognition) erkennt die Buchstaben im gescannten Bild und macht daraus ein durchsuchbares Word- oder PDF-Dokument.", businessValue: "Der Scanner ist das Gateway zum 'papierlosen Büro'. Verkaufen Sie Dokumentenscanner mit OCR-Software als Lösung, um Aktenschränke aufzulösen und Suchzeiten im Büro dramatisch zu reduzieren.", related: ["Drucker", "Eingabe"], tags: ["Digitalisierung", "Peripherie"] },
            { id: "mainboard", title: "Mainboard", image: "Mainboard.png", category: "verarbeitung", definition: "Die große Hauptplatine, die das Fundament und Nervensystem des Computers bildet.", content: "Das Mainboard (auch Motherboard oder Hauptplatine) ist das **Straßennetzwerk und die Infrastruktur der gesamten IT-Stadt**.\n\nEs ist eine große, flache Platte voller winziger Leitungen (Datenbahnen). Alles, absolut alles im PC muss an das Mainboard angeschlossen werden:\n- Der Prozessor (CPU) hat hier seinen zentralen Sitzplatz (Sockel).\n- Die Arbeitsspeicher-Riegel (RAM) werden in spezielle Schlitze gesteckt.\n- Die Grafikkarte und Festplatten hängen dran.\n- Alle USB-Anschlüsse hinten am PC sind direkt mit dem Mainboard verlötet.\n\nDas Mainboard bestimmt, wie viel aufgerüstet werden kann: Hat es nur zwei Slots für RAM, kann man später nicht vier Riegel einbauen.", businessValue: "Oft wird das Mainboard beim Kauf ignoriert, weil es nicht 'schneller' macht. Ein hochwertiges Mainboard sorgt aber für Systemstabilität, saubere Stromverteilung und garantiert, dass der Kunde in 3 Jahren überhaupt noch Bauteile aufrüsten kann.", related: ["CPU", "RAM", "Formfaktor"], tags: ["Hardware", "Zentrum"] },
            { id: "grafik", title: "Grafikkarte", category: "verarbeitung", definition: "Der Spezial-Chip zur massiven Berechnung und Ausgabe von visuellen Signalen.", content: "Die Grafikkarte (GPU – Graphics Processing Unit) ist die **künstlerische Abteilung des Computers**.\n\nWenn Sie nur Word und Excel nutzen, reicht meist ein winziger Grafik-Chip, der direkt im Hauptprozessor (CPU) eingebaut ist. Aber sobald aufwendige visuelle Arbeit ansteht, brauchen Sie eine *dedizierte* (eigenständige) Grafikkarte.\nDiese Karten haben oft eigene, riesige Lüfter und eigenen High-Speed-Arbeitsspeicher (VRAM).\n\nWarum? Weil das Berechnen von 3D-Modellen, hochauflösendem Videoschnitt oder KI-Bildern extrem komplexe Mathematik erfordert. Die CPU (der normale Sachbearbeiter) wäre damit überfordert. Die GPU kann hingegen hunderte Mathe-Aufgaben für die Bildberechnung exakt gleichzeitig lösen.", businessValue: "Für kreative Abteilungen (Marketing, Video) oder Konstrukteure (CAD, Architektur) ist die Grafikkarte das absolut wichtigste Bauteil im PC. Hier zu sparen bedeutet ruckelnde Bilder und genervte Profis.", related: ["Monitor", "CPU"], tags: ["Hardware", "Grafik"] },
            { id: "drucker", title: "Drucker", category: "ausgabe", definition: "Ein Ausgabegerät, das digitale Dokumente, Bilder oder Pläne auf Papier bringt.", content: "Der Drucker übernimmt die finale Ausgabe in die physische Welt. In unserem Büro ist er die **Druckerei, die Akten für den Versand vorbereitet**.\n\nJe nach Einsatzzweck gibt es verschiedene Technologien:\n- **Laserdrucker**: Perfekt für Text und Masse. Sie brennen Tonerpulver aufs Papier.\n- **Tintenstrahldrucker**: Perfekt für Fotos und Farben. Sie sprühen mikroskopische Tropfen auf das Blatt.\n- **Multifunktionsgeräte**: Vereinen Drucken, Scannen und oft auch Faxen in einem Gehäuse.\n\nWichtig in der Beratung ist auch die Netzwerkanbindung. Moderne Bürodrucker stehen auf dem Flur und sind per LAN oder WLAN ans Netzwerk angeschlossen, sodass das ganze Team sicher drucken kann (oft erst mit PIN-Eingabe direkt am Drucker).", businessValue: "Nicht der Anschaffungspreis des Druckers entscheidet, sondern die 'Folgekosten' (Toner, Papier, Wartung). Verkaufen Sie am besten direkt Service-Verträge (Managed Print Services), bei denen der Drucker automatisch neuen Toner bestellt, bevor er leer ist.", related: ["Laserdrucker", "Tintenstrahldrucker", "Plotter"], tags: ["Peripherie", "Output"] },
            { id: "lautsprecher", title: "Lautsprecher", category: "ausgabe", definition: "Die Geräte zur Ausgabe von digitalen Audio-Signalen als hörbare Schallwellen.", content: "Lautsprecher wandeln den elektrischen Strom und die digitalen Signale des PCs wieder in **Luftschwingungen** um, die unser Ohr hören kann.\n\nFrüher reichte es, wenn ein Büro-PC ab und zu einen 'Ping'-Fehlerton abspielte. Heute, im Zeitalter von unzähligen Videokonferenzen, Zoom-Meetings, Webinaren und Schulungsvideos, ist gutes Audio geschäftskritisch.\n- **Kleine PC-Boxen**: Reichen für einfache Signale.\n- **Headsets**: Das Mittel der Wahl im Großraumbüro, da es ein Mikrofon (Eingabe) mit Lautsprechern (Ausgabe) direkt am Ohr kombiniert und Hintergrundgeräusche herausfiltert.", businessValue: "Guter Sound wird oft vergessen. Statten Sie Konferenzräume unbedingt mit professionellen Konferenz-Lautsprechern aus, damit externe Gesprächspartner klar verstanden werden. Schlechter Ton macht Meetings unglaublich anstrengend.", related: ["Audio-Anschlüsse", "Ausgabe"], tags: ["Hardware", "Sound"] },
            { id: "hdd", title: "Festplatte (HDD)", category: "speicherung", definition: "Ein klassisches, mechanisches Speichermedium mit rotierenden Magnetscheiben.", content: "Die Festplatte (Hard Disk Drive) ist der **alte, zuverlässige, aber langsame Aktenkeller**.\n\nIm Inneren einer HDD drehen sich echte Scheiben (Platter) wie bei einem Plattenspieler. Ein feiner, mechanischer Lesekopf rast über diese Scheiben und schreibt die Daten magnetisch auf.\n- **Nachteil**: Weil sich physisch Teile bewegen müssen, ist der Start von Programmen und das Finden von Dateien relativ langsam. Zudem gehen sie bei Erschütterungen (wenn man z.B. gegen den PC stößt) schnell kaputt (Head-Crash).\n- **Vorteil**: Sie können gigantische Mengen an Daten (viele Terabyte) extrem günstig speichern.", businessValue: "Setzen Sie HDDs heute niemals als Hauptlaufwerk für das Windows-Betriebssystem ein. Verkaufen Sie HDDs nur noch als billiges 'Datengrab' in Servern (NAS), wo riesige Archive, Backups oder Überwachungsvideos landen.", related: ["SSD", "Speicherung"], tags: ["Hardware", "Storage"] },
            { id: "desktop", title: "Desktop-PC", category: "bauformen", definition: "Ein stationärer Computer, der für den dauerhaften Einsatz am festen Schreibtisch gebaut ist.", content: "Der Desktop-PC (oft als 'Tower' oder Kasten auf dem Boden bekannt) ist der **klassische Lastwagen der IT**.\n\nWeil er nicht in eine kleine, flache Tasche passen muss und immer an der Steckdose hängt, hat er riesige Vorteile:\n- Im großen Gehäuse staut sich weniger Hitze. Die Lüfter können groß und leise sein.\n- Man kann beliebig Bauteile ein- und ausbauen (z.B. neue Grafikkarten oder mehr Festplatten ergänzen).\n- Man bekommt deutlich mehr Rechenleistung für das gleiche Geld im Vergleich zu einem kompakten Laptop.\n\nEr besteht nur aus der Zentraleinheit. Monitor, Tastatur und Maus müssen extra gekauft und angeschlossen werden.", businessValue: "Für Empfangstresen, klassische Sachbearbeiter-Plätze oder Steuerberater, die niemals unterwegs arbeiten, ist der Desktop-PC die robusteste, langlebigste und wirtschaftlichste Lösung.", related: ["Workstation", "Mini-PC", "Laptop"], tags: ["System", "Büro"] },
            { id: "laptop", title: "Laptop / Notebook", category: "bauformen", definition: "Ein tragbarer All-in-One-Computer, der völlig autark und mobil funktioniert.", content: "Der Laptop ist das **digitale Taschenmesser** der Geschäftswelt.\n\nHier sind alle Elemente des EVA-Prinzips kompakt auf engstem Raum verschmolzen:\n- Zentraleinheit (Mainboard, CPU, Speicher) sitzen unter der Tastatur.\n- Eingabe (Tastatur und Touchpad/Maus) sind fest eingebaut.\n- Ausgabe (Monitor und kleine Lautsprecher) sind im Deckel.\n- Und er hat einen eigenen Stromtank (Akku), um im Zug oder Café ohne Steckdose zu überleben.\n\nDie große Herausforderung bei Laptops: Da alles so eng verbaut ist, entsteht viel Hitze. Laptops werden bei schwerer Arbeit wärmer und lauter als große Desktop-PCs, und sie lassen sich kaum aufrüsten.", businessValue: "Laptops sind das Herzstück des 'Modern Workplace'. Verkaufen Sie Laptops an alle Mitarbeiter, die flexibel im Büro, im Home-Office oder beim Kundenbesuch arbeiten müssen.", related: ["Desktop-PC", "Mini-PC"], tags: ["Mobil", "System"] },
            { id: "minipc", title: "Mini-PC", category: "bauformen", definition: "Ein vollwertiger, stationärer Desktop-Rechner, der auf ein winziges Format geschrumpft wurde.", content: "Der Mini-PC ist **der elegante Kompromiss auf dem Schreibtisch**.\n\nStellen Sie sich einen normalen Desktop-Kasten vor, aus dem man alle Luftblasen und ungenutzten Erweiterungsplätze herausgesaugt hat. Übrig bleibt ein winziger Kasten, oft nur so groß wie ein dickes Buch oder eine Brotdose.\n- **Vorteil**: Er nimmt extrem wenig Platz weg. Durch spezielle VESA-Halterungen kann man ihn oft unsichtbar direkt an die Rückseite des Monitors schrauben. Der Schreibtisch sieht völlig aufgeräumt aus.\n- **Nachteil**: Ähnlich wie beim Laptop kann man später kaum neue Komponenten einbauen, und für extrem leistungshungrige Aufgaben (3D-Grafik) reicht der Platz zur Kühlung oft nicht aus.", businessValue: "Mini-PCs (wie der Intel NUC oder Apple Mac mini) sind perfekt für moderne, design-orientierte Büros. Sie bieten genug Leistung für Office und Browser, verbrauchen extrem wenig Strom und lassen Arbeitsplätze super professionell und aufgeräumt wirken.", related: ["Desktop-PC", "Laptop"], tags: ["System", "Platzsparend"] },
            { id: "netzteil", title: "Netzteil", category: "verarbeitung", definition: "Das Bauteil, das den Wechselstrom aus der Steckdose in passenden Gleichstrom für den PC wandelt.", content: "Das Netzteil ist **das schlagende Herz des Computers, das den Strom pumpt**.\n\nDie Steckdose in der Wand liefert starken 230-Volt-Wechselstrom. Würden wir den direkt ins Mainboard leiten, würde der PC sofort in Flammen aufgehen. Das Netzteil transformiert diese Kraft in kleine, sanfte und extrem exakte Spannungen (z.B. 3,3V, 5V und 12V), die der Prozessor und die Festplatten gefahrlos nutzen können.\n\nEin billiges Netzteil ist gefährlich: Wenn es die Spannungen nicht sauber hält, stürzt der PC ab oder Hardware geht schleichend kaputt.", businessValue: "Erklären Sie dem Kunden, warum ein Marken-Netzteil mit '80 PLUS Gold' Zertifikat wichtig ist: Es ist nicht nur sicherer, sondern wandelt den Strom so verlustfrei um, dass weniger Energie als nutzlose Hitze verpufft. Das senkt die Stromrechnung.", related: ["Hardware", "Mainboard"], tags: ["Hardware", "Energie"] },
            { id: "formfaktor", title: "Formfaktor (z. B. ATX)", category: "bauformen", definition: "Ein genormter Standard für die physische Größe und das Layout von PC-Bauteilen.", content: "Der Formfaktor ist wie **die Kleidergröße in der IT**.\n\nDamit ein Mainboard von Hersteller A auch sicher in das Gehäuse von Hersteller B passt und die Schraubenlöcher exakt übereinanderliegen, gibt es globale Spielregeln – die Formfaktoren.\nDer bekannteste Standard heißt **ATX** (Advanced Technology eXtended).\n- Ein normales ATX-Mainboard braucht einen großen Tower.\n- Ein Micro-ATX-Mainboard ist etwas kürzer und passt in mittlere Gehäuse.\n- Mini-ITX ist sehr klein und perfekt für kompakte Wohnzimmer-PCs.", businessValue: "Bei der Beratung zu Eigenbauten oder Servern müssen Sie auf Formfaktoren achten. Wenn Sie dem Kunden eine riesige Grafikkarte zu einem kompakten Micro-ATX-Gehäuse verkaufen, werden die Teile physisch nicht zusammenpassen.", related: ["Mainboard", "Desktop-PC"], tags: ["Standard", "Technik"] },
            { id: "usb", title: "USB (USB-A, USB-C)", image: "USB.png", category: "peripherie", definition: "Die wichtigste Universal-Schnittstelle zur Verbindung von Computern mit Peripheriegeräten.", content: "USB steht für 'Universal Serial Bus' und ist **die Autobahn, die fast jedes externe Gerät nutzt**.\n\nFrüher brauchte man für Tastaturen, Drucker und Kameras völlig unterschiedliche Stecker. USB hat das vereinheitlicht. Man steckt es ein und es funktioniert (Plug and Play).\n\nHöchste Zeit, den Stecker-Wirrwarr zu klären:\n- **USB-A**: Der alte, große, rechteckige Stecker, den man immer dreimal drehen muss, bis er endlich passt.\n- **USB-C**: Der neue, abgerundete Retter. Er ist beidseitig einsteckbar. Das Magische an USB-C: Er kann unfassbare Mengen an Daten (Videos), Töne und sogar gleichzeitig Strom (um einen Laptop zu laden) durch ein einziges Kabel schießen.", businessValue: "Fokussieren Sie sich im Verkauf auf USB-C und Thunderbolt-Technologie. Ein moderner Arbeitsplatz benötigt dank USB-C nur noch ein einziges Kabel auf dem Schreibtisch, das den Laptop lädt, mit dem Netzwerk verbindet und den Monitor ansteuert.", related: ["Laptop"], tags: ["Anschluss", "Standard"] },
            { id: "hdmi", title: "HDMI", image: "HDMI.png", category: "peripherie", definition: "Der weltweite Standard-Anschluss zur digitalen Übertragung von Bild und Ton.", content: "HDMI (High-Definition Multimedia Interface) ist **das Kabel, das fast jeden Monitor und Fernseher der Welt füttert**.\n\nDer riesige Vorteil von HDMI gegenüber alten blauen oder weißen Kabeln (VGA/DVI) ist, dass es rein digital arbeitet und in einem einzigen Kabel nicht nur gestochen scharfes Video, sondern zeitgleich auch den Ton (Audio) an den Fernseher oder die Monitor-Lautsprecher überträgt.\n\nEs ist der absolute Massenstandard: Sie finden ihn an jedem Laptop, jeder Spielkonsole und jedem Beamer.", businessValue: "Achten Sie darauf, dass Konferenzräume immer mit HDMI-Kabeln ausgestattet sind. Es ist der 'kleinste gemeinsame Nenner', mit dem jeder externe Gast sofort seinen Laptop an den Präsentations-Bildschirm anschließen kann.", related: ["DisplayPort", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "displayport", title: "DisplayPort", category: "peripherie", definition: "Ein digitaler Anschlussstandard, der primär für High-End-Monitore und PC-Gaming entwickelt wurde.", content: "DisplayPort sieht auf den ersten Blick aus wie ein HDMI-Stecker, der an einer Seite etwas schief abgeschnitten wurde. \n\nWährend HDMI eher aus der TV- und Wohnzimmerwelt kommt, ist DisplayPort der **Vollblut-Profi für den Computerschreibtisch**.\nEr ist technisch oft eine Nasenlänge voraus, wenn es darum geht, gigantische Datenmengen an Monitore zu schicken. Wenn ein Kunde an einer Workstation zwei oder drei 4K-Monitore gleichzeitig betreiben möchte oder extreme Bildwiederholraten (144 Hertz) für flüssigste Darstellung braucht, ist DisplayPort die bessere Wahl.", businessValue: "Wenn Sie hochauflösende Multi-Monitor-Setups für Programmierer oder Grafiker verkaufen, achten Sie darauf, dass Laptops, Dockingstationen und Bildschirme über DisplayPort-Anschlüsse verfügen. HDMI stößt hier manchmal an seine Grenzen.", related: ["HDMI", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "lan", title: "LAN (Ethernet)", category: "peripherie", definition: "Das klassische Netzwerkkabel zur physischen und stabilen Verbindung ins Firmennetz und Internet.", content: "LAN (Local Area Network) ist das Gegenteil von WLAN. Es ist die **kabelgebundene Standleitung in die digitale Welt**.\n\nDiese Kabel haben meist einen transparenten Klick-Stecker (RJ45). Auch im Zeitalter des Internets der Dinge gilt in der IT die eiserne Regel: *'Wer Funk kennt, nimmt Kabel.'*\nEin WLAN kann durch Wände, Störsignale oder zu viele Handys im Raum langsam werden. Ein LAN-Kabel hingegen bietet eine exklusive, extrem schnelle, störungsfreie und abhörsichere Datenautobahn direkt zum Router oder Server.", businessValue: "Kabel ist King. Verkaufen Sie für jeden festen Schreibtischplatz im Büro eine kabelgebundene LAN-Anbindung (oft über eine USB-C Dockingstation). Es verhindert ruckelnde Video-Calls und spart der IT-Abteilung hunderte Support-Tickets wegen schlechtem WLAN.", related: ["USB"], tags: ["Netzwerk", "Speed"] },
            { id: "audio", title: "Audio-Anschlüsse", image: "Audio.png", category: "peripherie", definition: "Spezielle Schnittstellen zur Übertragung von Mikrofon- und Kopfhörersignalen.", content: "Audio-Anschlüsse sind unsere **Mund-und-Ohr-Schnittstellen für den Computer**.\n\nFrüher fand man an jedem PC hinten drei farbige Löcher: Grün (Lautsprecher/Kopfhörer), Rosa (Mikrofon) und Blau. Das waren analoge Klinkenanschlüsse (3,5 mm), die elektrische Schallwellen direkt an den Kopfhörer schickten.\n\nHeute im modernen Büro werden diese runden Stecker immer seltener. Fast alle hochwertigen Headsets für den Vertrieb und Video-Calls werden mittlerweile über den **USB-Anschluss** verbunden. Das hat den Vorteil, dass das Headset seinen eigenen kleinen, hochwertigen Sound-Chip mitbringt und Rauschen verhindert wird.", businessValue: "Kunden ärgern sich oft über schlechte Tonqualität im Home-Office. Raten Sie von billigen Klinken-Kopfhörern ab und positionieren Sie professionelle USB- oder Bluetooth-Headsets (z.B. Jabra, Plantronics) für glasklare, störungsfreie Gespräche.", related: ["Lautsprecher", "USB"], tags: ["Anschluss", "Kommunikation"] },
            { id: "aufloesung", title: "Auflösung", category: "ausgabe", definition: "Die Anzahl der winzigen Bildpunkte (Pixel), aus denen sich das Bild auf einem Monitor zusammensetzt.", content: "Die Auflösung beschreibt das **Mosaik des Bildschirms**. Ein digitales Bild ist nicht gemalt, sondern besteht aus einem Raster von winzig kleinen leuchtenden Punkten.\n\n- **Full HD (1080p)**: Das Bild besteht aus 1920 Punkten in der Breite und 1080 in der Höhe. Das ist der absolute Büro-Standard.\n- **4K / UHD**: Hier sind es 3840 mal 2160 Punkte. Das sind viermal so viele Punkte wie bei Full HD!\n\nJe höher die Auflösung, desto feiner, glatter und schärfer wirkt das Bild. Es gibt keinen 'Treppeneffekt' an den Rändern von Buchstaben mehr.", businessValue: "Eine hohe Auflösung ist der einfachste Weg zu mehr Produktivität. Bei einer 4K-Auflösung können Excel-Tabellen winzig klein, aber trotzdem noch gestochen scharf und gut lesbar dargestellt werden. Man hat faktisch 'mehr Platz' auf dem Schreibtisch.", related: ["Monitor", "Grafikkarte"], tags: ["Display", "Qualität"] },
            { id: "bildgroesse", title: "Bildschirmgröße", category: "ausgabe", definition: "Die physische Abmessung eines Monitors, traditionell quer über die Diagonale in Zoll gemessen.", content: "Die Bildschirmgröße ist schlicht **die physische Fläche der Glasscheibe**.\n\nSie wird vom linken unteren zum rechten oberen Rand gemessen und in Zoll (1 Zoll = 2,54 cm) angegeben.\n- **13 bis 15 Zoll**: Typisch für mobile Laptops.\n- **24 Zoll**: Der klassische Büro-Monitor-Standard der letzten 10 Jahre.\n- **27 bis 34 Zoll**: Der moderne Standard für Multitasking. Oft auch im Ultra-Wide (sehr breiten) Format, sodass man zwei bis drei Programme ganz entspannt nebeneinander öffnen kann.", businessValue: "Bildschirmgröße ist Status und Komfort. Ein großer 27-Zoll oder 34-Zoll-Monitor ist ein massiver Motivationsbooster für Mitarbeiter. Es spart das endlose Klicken und Suchen nach versteckten Programmfenstern.", related: ["Monitor", "Auflösung"], tags: ["Hardware", "Ergonomie"] },
            { id: "bildrate", title: "Bildwiederholrate", category: "ausgabe", definition: "Gibt an, wie oft pro Sekunde der Monitor das gezeigte Bild aktualisiert (gemessen in Hertz / Hz).", content: "Die Bildwiederholrate (Hertz) entscheidet darüber, ob sich **Bewegungen auf dem Schirm wie ein Daumenkino oder wie flüssiges Wasser anfühlen**.\n\n- **60 Hz**: Der Standard seit Jahrzehnten. Der Monitor malt 60 neue Bilder pro Sekunde. Für reines Tippen in Word reicht das völlig.\n- **120 Hz oder 144 Hz**: Ursprünglich für Gamer erfunden, kommt dieser flüssige Standard jetzt auch in Büros an. Der Mauszeiger gleitet butterweich über den Schirm und das Scrollen durch lange Webseiten schliert nicht mehr.", businessValue: "Auch wenn der Kunde kein Gamer ist: Eine höhere Bildwiederholrate (z.B. 120 Hz) empfindet das menschliche Auge (und das Gehirn) unbewusst als deutlich 'ruhiger' und weniger anstrengend. Es beugt Kopfschmerzen bei 8 Stunden Bildschirmarbeit vor.", related: ["Monitor", "Grafikkarte"], tags: ["Hardware", "Komfort"] },
            { id: "laserdrucker", title: "Laserdrucker", category: "ausgabe", definition: "Ein Drucker, der Text und Bilder mithilfe von Laserstrahlen und feinem Pulver auf das Papier brennt.", content: "Der Laserdrucker ist das **zuverlässige Arbeitstier für Text-Dokumente**.\n\nEr nutzt keine flüssige Tinte, sondern Toner. Das ist ein extrem feines, schwarzes oder farbiges Pulver. Im Inneren 'zeichnet' ein Laserstrahl das Bild auf eine Rolle. Diese Rolle zieht das Pulver magnetisch an und drückt es auf das Papier. Danach läuft das Blatt durch heiße Walzen, die das Pulver für immer in das Papier einschmelzen.\n\nDeshalb kommen Blätter aus einem Laserdrucker oft spürbar warm heraus! \n- **Vorteil**: Extrem schnell, der Druck verschmiert nicht, wenn er nass wird, und das Pulver kann nicht 'eintrocknen', selbst wenn man wochenlang nicht druckt.", businessValue: "Laserdrucker sind in der Anschaffung etwas teurer, aber im Büro-Alltag (wo 95% Text und Rechnungen gedruckt werden) unschlagbar im Seitenpreis. Wenn ein Kunde Volumen druckt, ist Laser die einzige logische Wahl.", related: ["Drucker", "Tintenstrahldrucker"], tags: ["Hardware", "Office"] },
            { id: "tintenstrahl", title: "Tintenstrahldrucker", category: "ausgabe", definition: "Ein Drucker, der flüssige Farbtinte in mikroskopisch kleinen Tropfen auf das Papier sprüht.", content: "Der Tintenstrahldrucker (Inkjet) ist der **Künstler unter den Druckern**.\n\nEin feiner Druckkopf fährt über das Papier hin und her und spritzt dabei unfassbar kleine, flüssige Tintentropfen millimetergenau auf das Blatt.\n- **Vorteil**: Tintenstrahldrucker können Farben viel fließender ineinander mischen. Wenn Sie ein glänzendes Urlaubsfoto oder eine bunte Marketing-Broschüre auf Spezialpapier drucken wollen, sieht das mit Tinte fantastisch aus.\n- **Nachteil**: Wenn man sie sehr lange nicht nutzt, kann die flüssige Tinte im Druckkopf eintrocknen und verstopfen. Zudem ist der Druck nicht ganz wasserfest.", businessValue: "Perfekt für kleine Teams, Marketingabteilungen oder das Home-Office, die nicht den ganzen Tag Briefe drucken, aber ab und zu hochqualitative Grafiken oder Fotos für Kundenpräsentationen auf Papier brauchen.", related: ["Drucker", "Laserdrucker"], tags: ["Hardware", "Foto"] },
            { id: "plotter", title: "Plotter", category: "ausgabe", definition: "Ein hochspezialisierter Großformatdrucker für Pläne, Banner und technische Konstruktionszeichnungen.", content: "Der Plotter ist der **Riese in der Druckerfamilie**.\n\nWährend normale Bürodrucker bei einem Blatt A4- oder A3-Papier aufhören, fängt der Plotter hier erst an. Er wird oft mit riesigen Papierrollen (Breiten von A1 bis A0) gefüttert.\nUrsprünglich fuhren echte Stifte wie Geisterhand über das Papier, um zu zeichnen (daher der Name Plotter). Heute arbeiten die meisten Geräte wie riesige Tintenstrahldrucker.\nSie können hauchfeine, metergroße Linien zeichnen.", businessValue: "Plotter verkaufen Sie nicht an normale Büros, sondern an spezialisierte Branchen: Architekturbüros, Bauingenieure, Werbeagenturen und Druckereien. Der Fokus liegt hier nicht auf Geschwindigkeit, sondern auf extremer Detail-Präzision auf gigantischer Fläche.", related: ["Drucker", "Ausgabe"], tags: ["Spezial", "Hardware"] },
            { id: "ergonomie", title: "Ergonomie", category: "grundlagen", definition: "Die Wissenschaft, Arbeitsgeräte optimal an den menschlichen Körper und seine Gesundheit anzupassen.", content: "Ergonomie bedeutet, dass sich **die IT der Gesundheit des Menschen anpasst – und nicht umgekehrt**.\n\nWenn ein Mensch 8 Stunden täglich völlig starr auf einen Bildschirm starrt und kleine Klicks ausführt, rebelliert unser von der Natur auf Bewegung ausgelegter Körper schnell mit Nackenverspannungen, Rückenschmerzen und Augenbrennen.\n\nErgonomische IT bedeutet:\n- Der Monitor lässt sich hoch und runter fahren (Oberkante auf Augenhöhe).\n- Die Tastatur hat eine Handballenauflage, damit die Handgelenke nicht abknicken.\n- Die Maus stützt die Hand in einer natürlichen Position.\n- Ein höhenverstellbarer Schreibtisch (Steh-Sitz-Tisch) gehört in vielen Büros mittlerweile zum Standard.", businessValue: "Ergonomie ist kein Eso-Thema, sondern harte Mathematik. Wenn Sie einem Entscheider vorrechnen, dass ihn ein einziger Krankheitstag wegen Rückenproblemen mehr kostet als ein teurer, höhenverstellbarer Premium-Monitor, haben Sie das Argument gewonnen.", related: ["Maus", "Monitor"], tags: ["Gesundheit", "Beratung"] },
            { id: "kompatibilitaet", title: "Kompatibilität", category: "grundlagen", definition: "Das technische Vermögen, dass unterschiedliche Hardware- und Software-Teile reibungslos zusammenarbeiten.", content: "Kompatibilität ist die Frage: **Sprechen Bauteil A und Programm B dieselbe Sprache und passen sie zusammen?**\n\nIT ist ein Puzzle aus hunderten Teilen. Leider passt nicht jedes Teil in jedes andere.\n- Wenn Sie einen Windows-Laptop kaufen, ist ein Mac-Programm damit nicht *kompatibel*.\n- Wenn Sie ein winziges Mini-PC Gehäuse kaufen, ist eine riesige Grafikkarte physisch nicht *kompatibel*.\n- Wenn Sie ein uraltes Kassen-Programm haben, ist es vielleicht nicht mit Windows 11 *kompatibel*.\n\nAls Vertriebler ist es Ihre wichtigste Aufgabe, nicht blind Komponenten zu verkaufen, sondern vorher die Kompatibilität des Gesamtsystems zu prüfen.", businessValue: "Kunden hassen böse Überraschungen bei der Einrichtung. Ihre Dienstleistung und Beratung besteht genau darin, dem Kunden die Sorge der Kompatibilität komplett abzunehmen. Wir garantieren geprüfte, funktionierende Gesamt-Systeme.", related: ["Formfaktor", "Software"], tags: ["Beratung"] },
            { 
                id: "server", 
                title: "Server", 
                category: "bauformen", 
                definition: "Ein mächtiger, zentraler Computer, der Daten und Dienste für andere Teilnehmer im Netzwerk zur Verfügung stellt.", 
                content: "Stellen Sie sich einen Server wie den **Oberkellner in einem großen Restaurant** vor. Alle anderen normalen Büro-PCs (die 'Clients') sind die Gäste. Sie rufen ständig den Kellner und wollen etwas: 'Gib mir die Excel-Datei!', 'Drucke dieses Bild!', 'Speichere dieses Backup!'\n\nDer Server arbeitet nicht für eine einzelne Person, die davor sitzt. Er steht meist laut schnaufend und ohne eigenen Bildschirm versteckt in einem klimatisierten Technikraum.\nDamit der Kellner nicht bei Stress umkippt, wird ein Server mit massiven Sicherheits-Hardware-Teilen gebaut, die normale PCs nicht haben:\n- Zwei Netzteile (falls eines durchbrennt, übernimmt das andere sofort).\n- Spezial-Festplatten, die für den Dauerbetrieb 24 Stunden, 7 Tage die Woche gebaut sind.", 
                businessValue: "Firmen, die mit extrem geheimen Kundendaten arbeiten (Kanzleien, Ärzte, Notare), wollen oft keine Daten in der fremden Cloud speichern. Der Verkauf eines eigenen 'In-House' Servers bedeutet für diese Kunden absolute Datensouveränität und Kontrolle.", 
                related: ["Cloud-Speicher", "Netzteil", "Desktop-PC"], 
                tags: ["Infrastruktur", "Profi", "System"] 
            },
            { 
                id: "nas", 
                title: "NAS (Network Attached Storage)", 
                category: "speicherung", 
                definition: "Ein intelligenter, zentraler Datenspeicher, der direkt ans Firmennetzwerk angeschlossen wird.", 
                content: "Ein NAS ist wie ein **kleiner, schlauer Datei-Schrank für das gesamte Büro**.\n\nEs ist im Grunde eine Mini-Cloud, die nicht im fernen Internet steht, sondern im eigenen Büro direkt neben dem Router. Mehrere Mitarbeiter können gleichzeitig auf die freigegebenen Ordner im NAS zugreifen. So muss man keine USB-Sticks mehr hin und her reichen.\n\nDas Wichtigste beim NAS: Es besteht meist nicht aus einer, sondern aus zwei oder mehr Festplatten. Diese speichern alle Daten automatisch doppelt (Spiegelung / RAID). Wenn eine Festplatte knallt und kaputt geht, sind die Daten auf der zweiten immer noch sicher da. Man tauscht die kaputte Platte aus, und das NAS repariert sich selbst.", 
                businessValue: "Das NAS ist das perfekte Einstiegs-Produkt für Handwerker oder Agenturen (3-10 Mitarbeiter). Es löst das Chaos wilder Ordner auf lokalen Laptops und bietet enorme Ausfallsicherheit für Teildokumente, ohne die Kosten eines riesigen Microsoft-Servers.", 
                related: ["Festplatte (HDD)", "Externer Speicher", "Cloud-Speicher"], 
                tags: ["Backup", "Netzwerk", "Teamwork"] 
            },
            { 
                id: "usv", 
                title: "USV (Unterbrechungsfreie Stromversorgung)", 
                category: "peripherie", 
                definition: "Ein externes Gerät mit eingebauten Akkus, das Computer bei einem Stromausfall notversorgt.", 
                content: "Eine USV ist der **Sicherheitsgurt und Airbag für Server**.\n\nStellen Sie sich vor, in der Straße fällt für 10 Sekunden der Strom aus. Wenn ein Firmenserver in diesem Moment hart abstürzt, gehen nicht nur nicht-gespeicherte Dokumente verloren, sondern die gesamten Festplatten können schwere Datenbank-Fehler erleiden.\n\nDie USV sitzt wie ein dicker Akku-Kasten zwischen der Steckdose und dem Server. Bei einem Stromausfall übernimmt der Akku sofort (in Millisekunden). Das hält nicht stundenlang, aber es gibt dem Server genug Zeit (oft 15-30 Minuten), um die Arbeit zu speichern und das System völlig sicher und geregelt herunterzufahren. Zudem glättet sie gefährliche Spannungsspitzen ('Blitze') aus dem Netz.", 
                businessValue: "Verkaufen Sie niemals – wirklich niemals – einen Server oder ein teures NAS-System an einen Kunden, ohne eine USV dazu anzubieten. Sie ist eine kleine Einmal-Versicherung gegen den absolut vernichtenden Super-Gau eines Datenverlustes bei Stromausfall.", 
                related: ["Netzteil", "Server"], 
                tags: ["Sicherheit", "Zubehör"] 
            },
            { 
                id: "dockingstation", 
                title: "Dockingstation", 
                category: "peripherie", 
                definition: "Ein Verteiler-Kasten auf dem Schreibtisch, der Laptops über ein einziges Kabel mit allem Zubehör verbindet.", 
                content: "Die Dockingstation ist der **Schlüssel zum bequemen modernen Arbeitsplatz (Desk-Sharing)**.\n\nFrüher musste man jeden Morgen im Büro fünf Kabel an den Laptop fummeln: Stromkabel, Monitorkabel, USB-Maus, USB-Tastatur, Netzwerkkabel.\n\nMit einer USB-C Dockingstation sind all diese externen Geräte fest an den Kasten auf dem Schreibtisch angeschlossen. Kommt der Mitarbeiter morgens an, stöpselt er nur noch ein einziges, kleines USB-C Kabel in seinen Laptop. Sofort erwachen die zwei großen Monitore, die Maus funktioniert, das Internet ist per LAN rasend schnell und der Laptop wird gleichzeitig über dieses eine Kabel aufgeladen.", 
                businessValue: "Verkaufen Sie Firmen-Laptops standardmäßig mit einer passenden USB-C Dockingstation. Es spart den Mitarbeitern jeden Tag Zeit und Frust, reduziert Kabelchaos (Clean Desk) und erhöht durch den Anschluss an echtes LAN-Kabel die Ausfallsicherheit.", 
                related: ["Laptop / Notebook", "USB (USB-A, USB-C)", "Monitor"], 
                tags: ["Zubehör", "Produktivität", "Mobil"] 
            },
            { 
                id: "firewall", 
                title: "Firewall", 
                category: "grundlagen", 
                definition: "Ein Schutzsystem (Hardware oder Software), das den Netzwerkverkehr analysiert und blockiert.", 
                content: "Eine Firewall ist der knallharte **Türsteher an der Grenze zum unsicheren Internet**.\n\nEs gibt Millionen von Hackern und automatisierten Viren im Netz, die permanent versuchen, in Firmennetzwerke einzudringen. Die Firewall (als Hardware-Box oft direkt hinter dem Internet-Modem verbaut) kontrolliert jedes einzelne Datenpaket, das rein oder raus will.\n\nKennt sie den Absender? Passt der Code zu den Sicherheitsregeln der Firma? Wenn nicht, schlägt der Türsteher die Tür zu. Profi-Firewalls können sogar bösartige Software erkennen, bevor sie überhaupt den PC eines Mitarbeiters erreicht.", 
                businessValue: "Sicherheit darf kein Nachgedanke sein. Ein erfolgreicher Cyber-Angriff (Ransomware), der die Rechnungen des Kunden verschlüsselt, kann den Ruin der Firma bedeuten. Eine Hardware-Firewall ist eine Investition, die den Kunden nachts ruhig schlafen lässt.", 
                related: ["Software", "Server"], 
                tags: ["Sicherheit", "Netzwerk", "Beratung"] 
            },
            { 
                id: "betriebssystem", 
                title: "Betriebssystem (OS)", 
                category: "grundlagen", 
                definition: "Die Basis-Software, ohne die kein Computer starten und laufen kann (z.B. Windows oder macOS).", 
                content: "Das Betriebssystem (Operating System, OS) ist der **Chef-Manager und Übersetzer im Computer**.\n\nHardware (Platinen und Chips) versteht nur primitive elektrische Impulse. Ihre Anwendungen (Word, der Browser) wollen aber schöne Fenster und Klicks machen. Das Betriebssystem sitzt genau dazwischen. Es teilt den Programmen den Arbeitsspeicher zu, sagt der Festplatte, wo Daten liegen sollen, und kümmert sich um die Sicherheit.\n\nOhne Betriebssystem würden Sie beim Anschalten des PCs nur einen schwarzen Schirm mit etwas blinkendem Text sehen. Die bekanntesten sind Windows (Microsoft), macOS (Apple) und Linux.", 
                businessValue: "Das Betriebssystem bestimmt die Software-Landschaft der Firma. Wenn ein Kunde spezielle Handwerker-Software nutzt, läuft diese oft nur auf Windows. Ein Ende des Lebenszyklus (z.B. wenn Microsoft Windows 10 den Support entzieht) ist immer ein hervorragender Trigger, um neue, kompatible Hardware zu verkaufen.", 
                related: ["Software", "Kompatibilität"], 
                tags: ["Basis", "Software"] 
            },
            { 
                id: "wlan", 
                title: "WLAN (Wi-Fi)", 
                category: "peripherie", 
                definition: "Ein drahtloses, lokales Funknetzwerk für den mobilen Internet- und Netzwerkzugriff.", 
                content: "WLAN (Wireless Local Area Network) spannt ein **unsichtbares Daten-Spinnennetz durch die Luft**.\n\nStatt an LAN-Kabeln zu hängen, kommunizieren Smartphones, Laptops und Tablets über hochfrequente Funkwellen mit den sogenannten Access Points (Zugangspunkten) an der Decke. \n\nWLAN ist wahnsinnig praktisch, hat in Büros aber Hürden: Wände aus Stahlbeton, Mikrowellen oder ein Stau von 50 Handys in einem Meetingraum können das Netz in die Knie zwingen. Deshalb brauchen Firmen keine billigen Heim-Router, sondern professionell geplante, intelligente WLAN-Netze, die die Funklast clever verteilen (z.B. WiFi 6 oder WiFi 7).", 
                businessValue: "Mitarbeiter erwarten heute nahtloses WLAN, in dem sie vom Schreibtisch in den Meetingraum laufen können, ohne aus dem Teams-Call zu fliegen. Bieten Sie neben den Notebooks direkt die Planung und Installation eines sauberen, professionellen Business-WLANs an.", 
                related: ["LAN (Ethernet)", "Laptop / Notebook"], 
                tags: ["Netzwerk", "Mobil"] 
            },
            { 
                id: "webcam", 
                title: "Webcam", 
                category: "eingabe", 
                definition: "Eine kleine digitale Kamera für Live-Video-Übertragungen in Meetings und Videokonferenzen.", 
                content: "Die Webcam ist das **digitale Auge für das Home-Office**.\n\nZwar haben heute fast alle Laptops eine Kamera oben im Deckel integriert, aber diese sind oft extrem billig, klein und lichtschwach. Wenn der Mitarbeiter vor einem Fenster sitzt, ist sein Gesicht im Meeting oft komplett schwarz.\n\nExterne Webcams (per USB auf den Monitor geklippt) haben deutlich größere Linsen. Sie lassen mehr Licht hinein, haben einen schnellen Autofokus und können oft sogar im Raum umhergehen und Personen intelligent im Bildausschnitt verfolgen (Auto-Framing).", 
                businessValue: "Der professionelle Erstkontakt zu neuen Kunden findet heute fast immer per Teams oder Zoom statt. Eine körnige Kamera und blecherner Ton wirken unbewusst unprofessionell. Der Verkauf einer Full-HD Webcam ist ein extrem günstiges Ticket zu einem deutlich besseren Firmen-Image für den Kunden.", 
                related: ["Audio-Anschlüsse", "Laptop / Notebook"], 
                tags: ["Kommunikation", "Peripherie"] 
            }
        ];

                    }
                });

                const delays = [1000, 2000, 4000];
