            { id: "tastatur", title: "Tastatur", category: "eingabe", definition: "Hauptgerät zur Eingabe von Texten und Befehlen.", content: "Bestandteil der Standard-Eingabe. Gibt es in verschiedenen Layouts (z.B. QWERTZ).", businessValue: "Gute Druckpunkte und leise Tasten erhöhen den Schreibkomfort in Großraumbüros.", related: ["maus", "eingabe_konzept"], tags: ["Hardware", "Input"] },
            { id: "tintenstrahl", title: "Tintenstrahldrucker", category: "ausgabe", definition: "Drucker, der flüssige Tinte auf das Papier sprüht.", content: "Ideal für Farbdrucke und Fotos. Günstiger in der Anschaffung als Laserdrucker.", businessValue: "Perfekt für Marketingabteilungen oder Kunden, die gelegentlich hochwertige Fotos drucken müssen.", related: ["drucker", "laserdrucker"], tags: ["Hardware", "Foto"] },
            { id: "usb", title: "USB (USB-A, USB-C)", category: "peripherie", definition: "Universeller Anschluss für fast alle Geräte.", content: "USB-A ist der alte Standard, USB-C der neue, verdrehsichere Alleskönner.", businessValue: "USB-C kann gleichzeitig laden, Daten übertragen und Monitore ansteuern – weniger Kabelsalat.", related: ["laptop"], tags: ["Anschluss", "Standard"] },
            { id: "workstation", title: "Workstation", category: "bauformen", definition: "Hochleistungs-PC für spezialisierte Profi-Anwendungen.", content: "Besonders robust, mit extrem viel RAM und Profi-Grafikkarten ausgestattet.", businessValue: "Für Kunden mit extremen Anforderungen (3D-Design, Videoproduktion, KI-Berechnungen).", related: ["desktop", "grafik"], tags: ["Leistung", "Profi"] },
            { id: "zentraleinheit", title: "Zentraleinheit", category: "konzept", definition: "Der Kern des Computersystems.", content: "Besteht im Wesentlichen aus Gehäuse, Netzteil, Mainboard und CPU.", businessValue: "Das stabile Herz der IT-Infrastruktur beim Kunden.", related: ["cpu", "mainboard", "hardware"], tags: ["Systemkern"] }
        ];

        // Hauptmenü
        const mainCategories = [
            { id: 'dashboard', name: 'Wiki-Zentrale', icon: 'home' },
            { id: 'glossar', name: 'A-Z Glossar', icon: 'list' },
            { 
                id: 'evas', 
                name: 'EVA-S Prinzip', 
                icon: 'layers', 
                hasSubmenu: true,
                children: [
                    { id: 'konzept', name: 'Konzept & Übersicht', icon: 'info' },
                    { id: 'eingabe', name: 'Eingabe', icon: 'mouse-pointer-2' },
                    { id: 'verarbeitung', name: 'Verarbeitung', icon: 'cpu' },
                    { id: 'ausgabe', name: 'Ausgabe', icon: 'monitor' },
                    { id: 'speicherung', name: 'Speicherung', icon: 'hard-drive' }
                ]
            },
            { id: 'peripherie', name: 'Anschlüsse & Extras', icon: 'usb' },
            { id: 'bauformen', name: 'Computer-Bauformen', icon: 'layout' }
        ];

        // Dokumentations-Menü (Footer)
        const docCategory = { 
            id: 'dokumentation', 
            name: 'Projekt-Doku', 
            icon: 'folder-kanban', 
            hasSubmenu: true,
            children: [
                { id: 'sprint1', name: 'Sprint 1 Report', icon: 'check-circle' },
                { id: 'sprint2', name: 'Sprint 2 Planung', icon: 'clock' },
                { id: 'retro', name: 'Retrospektive', icon: 'refresh-ccw' }
            ]
        };

        // --- STATE ---
        let currentTab = 'dashboard';
        let searchTerm = '';
        let selectedArticleId = null;
        let openSubmenus = {
            'evas': true,
            'dokumentation': false
        }; 

        // --- DOM ELEMENTS ---
        const navContainer = document.getElementById('sidebar-nav');
        const footerNavContainer = document.getElementById('sidebar-footer-nav');
        const viewContainer = document.getElementById('view-container');
        const searchInput = document.getElementById('search-input');

        // --- LOGIC ---
        function init() {
            renderSidebar();
            renderView();
            
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                selectedArticleId = null;
                renderView();
            });
        }

        function toggleSubmenu(e, id) {
            e.stopPropagation();
            openSubmenus[id] = !openSubmenus[id];
            renderSidebar();
        }

        function renderSidebar() {
            // Hauptnavi rendern
            navContainer.innerHTML = mainCategories.map(cat => renderNavItem(cat)).join('');
            
            // Footer-Navi (Doku) rendern
            footerNavContainer.innerHTML = renderNavItem(docCategory);
            
            lucide.createIcons();
        }

        function renderNavItem(cat) {
            if (cat.hasSubmenu) {
                const isOpen = openSubmenus[cat.id];
                return `
                    <div class="space-y-1">
                        <button 
                            onclick="toggleSubmenu(event, '${cat.id}')"
                            class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200"
                        >
                            <div class="flex items-center gap-3">
                                <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                                <span class="text-sm font-semibold">${cat.name}</span>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}"></i>
                        </button>
                        <div class="overflow-hidden submenu-transition ${isOpen ? 'max-h-[500px] opacity-100 mb-2' : 'max-h-0 opacity-0'}">
                            ${cat.children.map(child => `
                                <button 
                                    onclick="switchTab('${child.id}')"
                                    class="w-full flex items-center gap-3 pl-12 pr-4 py-2.5 rounded-xl transition-all duration-200 ${currentTab === child.id && !searchTerm ? 'text-indigo-700 bg-indigo-50 font-bold' : 'text-slate-400 hover:text-slate-900 hover:bg-slate-50'}"
                                >
                                    <i data-lucide="${child.icon}" class="w-4 h-4"></i>
                                    <span class="text-sm">${child.name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            return `
                <button 
                    onclick="switchTab('${cat.id}')"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${currentTab === cat.id && !searchTerm ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}"
                >
                    <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                    <span class="text-sm font-semibold">${cat.name}</span>
                </button>
            `;
        }

        function switchTab(id) {
            const conceptMap = {
                'konzept': 'eva_konzept',
                'eingabe': 'eingabe_konzept',
                'verarbeitung': 'verarbeitung_konzept',
                'ausgabe': 'ausgabe_konzept',
                'speicherung': 'speicherung_konzept',
                'sprint1': 'sprint1',
                'sprint2': 'sprint2',
                'retro': 'retro'
            };
            
            if (conceptMap[id]) {
                openArticle(conceptMap[id]);
                currentTab = id; 
            } else {
                currentTab = id;
                searchTerm = '';
                selectedArticleId = null;
                searchInput.value = '';
            }
            renderSidebar();
            renderView();
        }

        function openArticle(id) {
            selectedArticleId = id;
            searchTerm = '';
            renderView();
            document.getElementById('content-area').scrollTo(0, 0);
        }

        function renderView() {
            if (selectedArticleId) {
                renderArticleView();
            } else if (searchTerm) {
                renderSearchView();
            } else if (currentTab === 'dashboard') {
                renderDashboard();
            } else if (currentTab === 'glossar') {
                renderGlossary();
            } else {
                renderCategoryView();
            }
            lucide.createIcons();
        }

        function renderDashboard() {
            viewContainer.innerHTML = `
                <div class="space-y-10 animate-in fade-in duration-500">
                    <section>
                        <h2 class="text-3xl font-bold text-slate-900 mb-2 underline decoration-indigo-200 underline-offset-8 font-black tracking-tight">Vertriebs-Wiki Hardware</h2>
                        <p class="text-slate-500 text-lg">Wissen kompakt aufbereitet für den Verkaufsalltag. Verstehen Sie die Technik – begeistern Sie den Kunden.</p>
                    </section>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div onclick="switchTab('konzept')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="layers" class="text-indigo-600 mb-4 w-10 h-10"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">Das EVA-S Prinzip</h3>
                            <p class="text-slate-500 text-sm leading-relaxed italic">Beginnen Sie mit dem Grundgerüst jeder IT-Beratung (Basis: EVA).</p>
                        </div>
                        <div onclick="switchTab('glossar')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="list" class="text-indigo-600 mb-4 w-10 h-10"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">A-Z Index</h3>
                            <p class="text-slate-500 text-sm leading-relaxed italic">Finden Sie jeden Hardware-Begriff in Sekunden.</p>
                        </div>
                    </div>

                    <div class="bg-slate-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-2xl">
                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-4 text-indigo-300 font-bold uppercase tracking-widest text-xs">
                                <i data-lucide="info" class="w-4 h-4"></i>
                                <span>Verkaufs-Tipp</span>
                            </div>
                            <p class="text-xl font-medium leading-relaxed">
                                "Sagen Sie dem Kunden nicht: 'Das Mainboard hat den Formfaktor ATX'. Sagen Sie: 'Dieses Mainboard ist der perfekte Grundstein für zukünftige Upgrades'."
                            </p>
                        </div>
                        <i data-lucide="zap" class="absolute -bottom-10 -right-10 text-white/5 w-64 h-64"></i>
                    </div>
                </div>
            `;
        }

        function renderGlossary() {
            const sorted = [...wikiData].sort((a, b) => a.title.localeCompare(b.title));
            const groups = {};
            sorted.forEach(item => {
                const firstLetter = item.title[0].toUpperCase();
                if (!groups[firstLetter]) groups[firstLetter] = [];
                groups[firstLetter].push(item);
            });

            viewContainer.innerHTML = `
                <div class="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                    <h2 class="text-3xl font-bold font-black">A-Z Glossar</h2>
                    ${Object.keys(groups).sort().map(letter => `
                        <section>
                            <h3 class="text-lg font-black text-indigo-600 mb-4 border-b border-indigo-100 pb-2">${letter}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${groups[letter].map(art => `
                                    <div onclick="openArticle('${art.id}')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-indigo-400 hover:shadow-md cursor-pointer flex items-center justify-between group transition-all">
                                        <span class="font-bold text-slate-800">${art.title}</span>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `).join('')}
                </div>
            `;
        }

        function renderCategoryView() {
            const filtered = wikiData.filter(a => a.category === currentTab);
            let displayTitle = currentTab;
            
            [...mainCategories, docCategory].forEach(c => {
                if (c.id === currentTab) displayTitle = c.name;
                if (c.children) {
                    const child = c.children.find(child => child.id === currentTab);
                    if (child) displayTitle = child.name;
                }
            });

            viewContainer.innerHTML = `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="flex items-center gap-4 mb-8">
                        <h2 class="text-3xl font-bold font-black">${displayTitle}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${filtered.map(art => `
                            <div onclick="openArticle('${art.id}')" class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm hover:shadow-xl hover:border-indigo-200 cursor-pointer transition-all flex flex-col">
                                <h3 class="font-bold text-xl mb-3 text-slate-800">${art.title}</h3>
                                <p class="text-slate-500 text-sm line-clamp-2 mb-4 italic leading-relaxed">${art.definition}</p>
                                <div class="mt-auto flex flex-wrap gap-2 pt-4 border-t border-slate-50">
                                    ${art.tags.map(t => `<span class="text-[9px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg uppercase font-black tracking-widest">${t}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSearchView() {
            const filtered = wikiData.filter(a => 
                a.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                a.definition.toLowerCase().includes(searchTerm.toLowerCase())
            );
            viewContainer.innerHTML = `
                <div class="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                    <h2 class="text-2xl font-bold font-black">Suche: "${searchTerm}"</h2>
                    <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                        ${filtered.length > 0 ? `
                            <div class="divide-y divide-slate-100">
                                ${filtered.map(art => `
                                    <div onclick="openArticle('${art.id}')" class="p-6 hover:bg-slate-50 cursor-pointer flex items-center justify-between group transition-colors">
                                        <div class="max-w-2xl">
                                            <span class="font-bold text-lg text-slate-800 block mb-1 group-hover:text-indigo-600 transition-colors">${art.title}</span>
                                            <p class="text-sm text-slate-500 line-clamp-1">${art.definition}</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-6 h-6 transition-transform group-hover:translate-x-1"></i>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<div class="p-20 text-center text-slate-400">Nichts gefunden.</div>'}
                    </div>
                </div>
            `;
        }

        function renderArticleView() {
            const article = wikiData.find(a => a.id === selectedArticleId);
            if (!article) return;

            viewContainer.innerHTML = `
                <article class="bg-white border border-slate-200 rounded-[2.5rem] p-8 md:p-14 shadow-2xl animate-in zoom-in-95 duration-300">
                    <button onclick="selectedArticleId=null; renderView();" class="mb-12 text-indigo-600 text-sm font-black flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> ZURÜCK
                    </button>
                    
                    <header class="mb-12">
                        <h1 class="text-5xl font-black text-slate-900 mb-6 tracking-tight">${article.title}</h1>
                        <p class="text-2xl text-slate-400 font-medium leading-relaxed italic border-l-8 border-indigo-500 pl-8">
                            ${article.definition.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}
                        </p>
                    </header>

                    <div class="article-content text-slate-700 leading-relaxed text-lg mb-12 space-y-6">
                        <div class="bg-slate-50 rounded-3xl p-8 border border-slate-100">
                             <h4 class="text-sm font-black mb-4 text-slate-400 uppercase tracking-widest">Inhalt</h4>
                             <p class="text-xl whitespace-pre-line leading-relaxed">${article.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                        <div class="bg-indigo-900 p-8 rounded-3xl text-white shadow-xl shadow-indigo-100">
                            <h4 class="text-indigo-300 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="shield-check" class="w-4 h-4"></i> SCRUM / VERTRIEBS-ASPEKT
                            </h4>
                            <p class="text-lg leading-relaxed font-medium">${article.businessValue.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>
                        </div>
                        <div class="bg-white p-8 rounded-3xl border-2 border-slate-100">
                            <h4 class="text-slate-400 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="arrow-right-left" class="w-4 h-4"></i> Siehe auch
                            </h4>
                            <div class="flex flex-wrap gap-2">
                                ${article.related.map(rel => {
                                    const target = wikiData.find(a => a.title.toLowerCase().includes(rel.toLowerCase()));
                                    return `<button onclick="${target ? `openArticle('${target.id}')` : ''}" class="text-xs bg-slate-100 border border-slate-200 text-slate-600 px-4 py-2 rounded-full hover:border-indigo-400 hover:text-indigo-600 transition-all font-bold">${rel}</button>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-8 border-t border-slate-100">
                        ${article.tags.map(t => `<span class="text-[10px] bg-slate-900 text-white px-4 py-1.5 rounded-full font-black uppercase tracking-widest shadow-md shadow-slate-200">${t}</span>`).join('')}
                    </div>
                </article>
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
