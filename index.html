<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>all around IT Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-in { animation: slideInUp 0.4s forwards; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 flex font-sans h-screen w-full overflow-hidden relative transition-colors duration-300">

    <button id="mobile-toggle" onclick="app.toggleSidebar();" class="fixed bottom-6 left-6 z-50 p-4 bg-indigo-600 text-white rounded-full shadow-lg md:hidden hidden">
        <i data-lucide="menu" class="w-6 h-6"></i>
    </button>

    <div id="sidebar-overlay" onclick="app.closeSidebar();" class="fixed inset-0 bg-slate-900/50 z-30 hidden md:hidden transition-opacity opacity-0"></div>

    <aside id="sidebar" class="h-screen fixed inset-y-0 left-0 z-40 w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 flex flex-col flex-shrink-0">
        <div class="p-6 pb-4 shrink-0 border-b border-slate-100 dark:border-slate-700">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                   <div class="w-12 h-12 flex-shrink-0 bg-indigo-100 rounded-full flex items-center justify-center">
                      <i data-lucide="cpu" class="text-indigo-600 w-6 h-6"></i>
                   </div>
                   <div>
                      <h1 class="font-bold text-lg leading-tight dark:text-white">all around <span class="text-indigo-600 dark:text-indigo-400 block italic">IT Wiki</span></h1>
                      <p class="text-[10px] text-slate-400 dark:text-slate-500 uppercase tracking-widest font-bold">Sales Edition</p>
                   </div>
                </div>
                <button onclick="app.closeSidebar();" class="md:hidden text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 p-2 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto px-6 py-6 custom-scrollbar flex flex-col gap-2" id="sidebar-nav-container">
            <!-- Rendered by JS -->
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header id="main-header" class="h-20 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-4 md:px-8 shadow-sm z-10 shrink-0 transition-colors duration-300">
            <div class="w-full flex items-center justify-between gap-2 md:gap-4">
                <div class="relative flex-1 max-w-2xl">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-[18px] h-[18px]"></i>
                    <input type="text" id="search-input" placeholder="Hardware-Begriff suchen..." oninput="app.handleSearch(this.value);" class="w-full pl-12 pr-4 py-3 bg-slate-100 dark:bg-slate-900/50 border-none rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all outline-none">
                </div>
                <div class="flex items-center gap-2 shrink-0 ml-auto">
                    <button onclick="app.handleNavigate('favoriten');" title="Meine Favoriten" class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-900/50 text-slate-500 hover:text-amber-500 hover:bg-slate-200 transition-colors flex items-center justify-center">
                        <i data-lucide="star" class="w-5 h-5"></i>
                    </button>
                    <button onclick="app.startLearningMode();" title="Selbststudium" class="flex items-center gap-2 px-4 py-3 rounded-2xl bg-indigo-50 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 transition-colors font-bold text-sm">
                        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                        <span class="hidden md:inline">Selbststudium</span>
                    </button>
                    <button onclick="app.toggleDarkMode();" class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-900/50 text-slate-500 hover:text-indigo-600 hover:bg-slate-200 transition-colors flex items-center justify-center">
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </header>

        <section id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar scroll-smooth">
            <div id="view-container" class="max-w-4xl mx-auto pb-20">
                <!-- Rendered by JS -->
            </div>
        </section>
    </main>

    <script>
        // --- DATA ---
        const WIKI_DATA = [
            { id: "eva_konzept", title: "Das EVA-Prinzip (Einstieg)", category: "eva_uebersicht", definition: "Das **EVA-Prinzip** ist das Fundament der IT: **E**ingabe, **V**erarbeitung, **A**usgabe.", content: "Jeder Computer der Welt funktioniert im Kern gleich. 1. Eingabe, 2. Verarbeitung, 3. Ausgabe. Vom EVA zum EVA-S: S für Speicherung.", businessValue: "Nutzen Sie das einfache EVA-Modell, um Kunden zu erklären, dass Hardware immer als geschlossene Kette funktioniert.", related: ["Zentraleinheit", "Software", "Speicherung"], tags: ["Grundlagen", "Einstieg"] },
            { id: "eingabe_konzept", title: "Eingabe (Das Tor zum System)", category: "eingabe", definition: "Die **Eingabe** ist die erste Phase des EVA-S Prinzips.", content: "Eingabegeräte sind unsere 'Sinnesorgane' für den Computer: Tastatur, Maus, Mikrofon.", businessValue: "Eine hochwertige Eingabe-Peripherie steigert die Motivation der Mitarbeiter und schont die Gesundheit.", related: ["Tastatur", "Maus", "Scanner"], tags: ["Input", "EVA-S"] },
            { id: "verarbeitung_konzept", title: "Verarbeitung (Das Herz der IT)", category: "verarbeitung", definition: "In der **Verarbeitung** werden die Rohdaten durch Rechenoperationen in nutzbare Informationen verwandelt.", content: "Der Prozessor (CPU) ist der kluge Sachbearbeiter. Der Arbeitsspeicher (RAM) ist die Tischplatte seines Schreibtisches.", businessValue: "Die Phase der Verarbeitung entscheidet über die Geschwindigkeit. Niemand will Wartezeiten.", related: ["CPU", "RAM"], tags: ["Logik", "EVA-S"] },
            { id: "ausgabe_konzept", title: "Ausgabe (Das Sichtbare)", category: "ausgabe", definition: "Die **Ausgabe** ist die Präsentation der verarbeiteten Daten für Menschen.", content: "Visuell über den Monitor, physisch über den Drucker, akustisch über Lautsprecher.", businessValue: "Eine brillante Darstellung erhöht die wahrgenommene Wertigkeit der IT massiv.", related: ["Monitor", "Drucker"], tags: ["Output", "EVA-S"] },
            { id: "speicherung_konzept", title: "Speicherung (Das Gedächtnis)", category: "speicherung", definition: "Die **Speicherung** sichert Daten dauerhaft.", content: "Ohne Speicherung wäre der Computer vergesslich. Das S steht für das Langzeit-Archiv (SSD/Cloud).", businessValue: "Datensicherheit ist das Top-Thema für jedes Unternehmen.", related: ["SSD", "HDD"], tags: ["Archiv", "EVA-S"] },
            { id: "desktop", title: "Desktop-PC", category: "bauformen", definition: "Ein stationärer Computer für den Einsatz am Schreibtisch.", content: "Der klassische Lastwagen der IT. Groß, viel Platz für Kühlung, aufrüstbar.", businessValue: "Die robusteste, langlebigste Lösung für stationäre Plätze.", related: ["Laptop"], tags: ["System", "Büro"] },
            { id: "cloud", title: "Cloud-Speicher", category: "speicherung", definition: "Speicherplatz auf entfernten Servern.", content: "Dateien liegen verschlüsselt im Internet. Bietet Mobilität und Ausfallsicherheit.", businessValue: "Maximal flexibel für Home-Office und Vertrieb.", related: ["SSD"], tags: ["Internet", "Modern"] }
        ];

        const LEARNING_PATH = [
            { level: 1, articleId: 'eva_konzept', title: 'Start: Das EVA-Prinzip', question: 'Wofür steht das "S" in der erweiterten Form "EVA-S"?', options: ['Sicherheit', 'Speicherung', 'System'], answer: 1 },
            { level: 2, articleId: 'eingabe_konzept', title: 'Die Eingabe', question: 'Warum ist die Qualität der Eingabegeräte so wichtig?', options: ['Weil sie am meisten Strom verbrauchen', 'Zur Vermeidung von Frust und aus ergonomischen Gründen', 'Weil sie die Grafikkarte entlasten'], answer: 1 },
            { level: 3, articleId: 'verarbeitung_konzept', title: 'Die Verarbeitung', question: 'Welches Bauteil haben wir in der Büro-Analogie als "Sachbearbeiter" bezeichnet?', options: ['Festplatte', 'Arbeitsspeicher (RAM)', 'Prozessor (CPU)'], answer: 2 },
            { level: 4, articleId: 'ausgabe_konzept', title: 'Die Ausgabe', question: 'Was ist der direkte ROI (Return on Investment) eines zweiten Monitors laut Studien?', options: ['Bis zu 30% mehr Produktivität', 'Stromersparnis von 20%', 'Geringere CPU-Auslastung'], answer: 0 },
            { level: 5, articleId: 'speicherung_konzept', title: 'Das Gedächtnis', question: 'Was ist der Hauptvorteil einer modernen SSD gegenüber einer alten Festplatte (HDD)?', options: ['Sie ist günstiger in der Anschaffung', 'Sie hat keine beweglichen Teile und ist extrem schnell', 'Sie druckt Dokumente schneller aus'], answer: 1 }
        ];

        const NAVIGATION = [
            { id: 'dashboard', name: 'Startseite', icon: 'home' },
            { id: 'eva_konzept', name: 'EVA-Prinzip', icon: 'layers' }
        ];

        // --- APP STATE & LOGIC ---
        const app = {
            state: {
                currentTab: 'dashboard',
                selectedArticleId: null,
                searchTerm: '',
                isSidebarOpen: window.innerWidth >= 768,
                favorites: JSON.parse(localStorage.getItem('itWikiFavorites')) || [],
                isDarkMode: localStorage.getItem('itWikiDarkMode') === 'true',
                learning: {
                    active: false,
                    maxUnlockedLevel: parseInt(localStorage.getItem('itWikiMaxLevel')) || 1,
                    quizAnsweredIdx: null,
                    quizCorrect: null,
                    showQuiz: false
                }
            },

            init() {
                if (this.state.isDarkMode) document.documentElement.classList.add('dark');
                this.renderSidebar();
                this.renderContent();
                this.updateSidebarMobileVisibility();
            },

            toggleDarkMode() {
                this.state.isDarkMode = !this.state.isDarkMode;
                localStorage.setItem('itWikiDarkMode', this.state.isDarkMode);
                document.documentElement.classList.toggle('dark', this.state.isDarkMode);
            },

            toggleFavorite(id) {
                const idx = this.state.favorites.indexOf(id);
                if (idx > -1) this.state.favorites.splice(idx, 1);
                else this.state.favorites.push(id);
                localStorage.setItem('itWikiFavorites', JSON.stringify(this.state.favorites));
                this.renderContent(); 
            },

            handleNavigate(tabId, articleId = null) {
                this.state.currentTab = tabId;
                this.state.selectedArticleId = articleId;
                this.state.searchTerm = '';
                this.state.learning.quizAnsweredIdx = null;
                this.state.learning.quizCorrect = null;
                this.state.learning.showQuiz = false;
                if (window.innerWidth < 768) this.closeSidebar();
                this.renderSidebar();
                this.renderContent();
            },

            handleSearch(term) {
                if(this.state.learning.active) return;
                this.state.searchTerm = term.toLowerCase();
                this.renderContent();
            },

            toggleSidebar() {
                this.state.isSidebarOpen = !this.state.isSidebarOpen;
                this.updateSidebarMobileVisibility();
            },

            closeSidebar() {
                this.state.isSidebarOpen = false;
                this.updateSidebarMobileVisibility();
            },

            updateSidebarMobileVisibility() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                if (this.state.isSidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden', 'opacity-0');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            },

            // --- LEARNING MODE LÖSUNG ---
            startLearningMode() {
                this.state.learning.active = true;
                const maxLvl = LEARNING_PATH.find(l => l.level === this.state.learning.maxUnlockedLevel);
                if (maxLvl) this.handleNavigate(null, maxLvl.articleId);
            },

            stopLearningMode() {
                this.state.learning.active = false;
                this.handleNavigate('dashboard');
            },

            startQuiz() {
                this.state.learning.showQuiz = true;
                this.renderContent();
            },

            answerMiniQuiz(level, selectedIdx) {
                if (this.state.learning.quizAnsweredIdx !== null) return; 
                
                const step = LEARNING_PATH.find(l => l.level === level);
                const isCorrect = selectedIdx === step.answer;
                
                this.state.learning.quizAnsweredIdx = selectedIdx;
                this.state.learning.quizCorrect = isCorrect;

                if (isCorrect && level === this.state.learning.maxUnlockedLevel) {
                    this.state.learning.maxUnlockedLevel++;
                    localStorage.setItem('itWikiMaxLevel', this.state.learning.maxUnlockedLevel);
                }
                this.renderContent();
            },

            nextLevel() {
                const nextStep = LEARNING_PATH.find(l => l.level === this.state.learning.maxUnlockedLevel);
                if (nextStep) {
                    this.handleNavigate(null, nextStep.articleId);
                } else {
                    alert("Du hast alle Lern-Level abgeschlossen! Großartig!");
                    this.stopLearningMode();
                }
            },

            // --- RENDER FUNKTIONEN ---
            renderSidebar() {
                const container = document.getElementById('sidebar-nav-container');
                let html = '';

                if (this.state.learning.active) {
                    html += `<div class="mb-4"><button onclick="app.stopLearningMode()" class="text-sm text-red-500 hover:text-red-700 flex items-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i> Lernmodus beenden</button></div>`;
                    html += `<h3 class="text-xs font-bold text-slate-400 uppercase mb-4">Lernpfad</h3>`;
                    
                    LEARNING_PATH.forEach(step => {
                        const isUnlocked = step.level <= this.state.learning.maxUnlockedLevel;
                        const isCurrent = this.state.selectedArticleId === step.articleId;
                        const icon = isUnlocked ? 'unlock' : 'lock';
                        const color = isCurrent ? 'bg-indigo-50 text-indigo-600' : (isUnlocked ? 'text-slate-700 dark:text-slate-300 hover:bg-slate-100' : 'text-slate-400 opacity-50 cursor-not-allowed');
                        
                        html += `
                            <div onclick="${isUnlocked ? `app.handleNavigate(null, '${step.articleId}')` : ''}" 
                                 class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-colors ${color}">
                                <i data-lucide="${icon}" class="w-4 h-4"></i>
                                <span class="text-sm font-medium">Level ${step.level}: ${step.title}</span>
                            </div>
                        `;
                    });
                } else {
                    NAVIGATION.forEach(nav => {
                        const active = this.state.currentTab === nav.id ? 'bg-indigo-50 text-indigo-600' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800';
                        html += `
                            <button onclick="app.handleNavigate('${nav.id}')" class="w-full flex items-center gap-3 p-3 rounded-xl ${active} transition-colors">
                                <i data-lucide="${nav.icon}" class="w-5 h-5"></i>
                                <span class="font-medium">${nav.name}</span>
                            </button>
                        `;
                    });
                    
                    html += `<hr class="my-4 border-slate-200 dark:border-slate-700">`;
                    html += `<h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Alle Artikel</h3>`;
                    
                    WIKI_DATA.forEach(article => {
                        const active = this.state.selectedArticleId === article.id ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 dark:text-slate-400 hover:text-indigo-600';
                        html += `
                            <button onclick="app.handleNavigate('article', '${article.id}')" class="w-full text-left p-2 rounded-lg text-sm ${active} transition-colors">
                                ${article.title}
                            </button>
                        `;
                    });
                }

                container.innerHTML = html;
                lucide.createIcons();
            },

            renderContent() {
                const container = document.getElementById('view-container');
                let html = '';

                // Suchergebnisse anzeigen
                if (this.state.searchTerm !== '') {
                    const results = WIKI_DATA.filter(a => 
                        a.title.toLowerCase().includes(this.state.searchTerm) || 
                        a.content.toLowerCase().includes(this.state.searchTerm)
                    );
                    html = `<h2 class="text-2xl font-bold mb-6 animate-fade-in">Suchergebnisse für "${this.state.searchTerm}"</h2><div class="grid gap-4">`;
                    results.forEach(res => {
                        html += `
                            <div onclick="app.handleNavigate('article', '${res.id}')" class="p-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-indigo-500 transition-colors animate-slide-in">
                                <h3 class="font-bold text-lg text-indigo-600 dark:text-indigo-400 mb-2">${res.title}</h3>
                                <p class="text-sm text-slate-600 dark:text-slate-300 line-clamp-2">${res.definition}</p>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    if(results.length === 0) html += `<p class="text-slate-500">Keine Ergebnisse gefunden.</p>`;
                } 
                // Artikel Detailansicht
                else if (this.state.selectedArticleId) {
                    const article = WIKI_DATA.find(a => a.id === this.state.selectedArticleId);
                    const isFav = this.state.favorites.includes(article.id);
                    
                    html = `
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-sm border border-slate-200 dark:border-slate-700 animate-slide-in">
                            <div class="flex justify-between items-start mb-6">
                                <h2 class="text-3xl font-black text-slate-900 dark:text-white">${article.title}</h2>
                                <button onclick="app.toggleFavorite('${article.id}')" class="p-2 rounded-full ${isFav ? 'text-amber-500 bg-amber-50' : 'text-slate-400 hover:bg-slate-100'} transition-colors">
                                    <i data-lucide="star" class="w-6 h-6 ${isFav ? 'fill-current' : ''}"></i>
                                </button>
                            </div>
                            <div class="p-4 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-900 dark:text-indigo-100 rounded-xl mb-6 font-medium">
                                ${article.definition.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}
                            </div>
                            <div class="prose dark:prose-invert max-w-none text-slate-700 dark:text-slate-300 leading-relaxed mb-8">
                                ${article.content.replace(/\n/g, '<br/>')}
                            </div>
                            <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
                                <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3"><i data-lucide="briefcase" class="inline w-4 h-4 mr-2"></i>Sales Argument</h4>
                                <p class="italic text-slate-600 dark:text-slate-400 border-l-4 border-green-500 pl-4">${article.businessValue}</p>
                            </div>
                        </div>
                    `;

                    // Wenn Lernmodus aktiv, Quiz unten anhängen
                    if (this.state.learning.active) {
                        const stepData = LEARNING_PATH.find(l => l.articleId === article.id);
                        if (stepData) {
                            if (!this.state.learning.showQuiz) {
                                html += `
                                    <div class="mt-8 text-center animate-fade-in">
                                        <button onclick="app.startQuiz()" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg transition-transform transform hover:scale-105">
                                            Artikel verstanden? Teste dein Wissen!
                                        </button>
                                    </div>
                                `;
                            } else {
                                html += `
                                    <div class="mt-8 bg-slate-900 text-white rounded-3xl p-8 shadow-xl animate-slide-in border border-slate-700">
                                        <h3 class="text-xl font-bold mb-6 text-indigo-400">Quiz: ${stepData.title}</h3>
                                        <p class="text-lg mb-6">${stepData.question}</p>
                                        <div class="grid gap-3">
                                `;
                                stepData.options.forEach((opt, idx) => {
                                    let btnClass = "bg-slate-800 hover:bg-slate-700 border-slate-600";
                                    if (this.state.learning.quizAnsweredIdx !== null) {
                                        if (idx === stepData.answer) btnClass = "bg-green-600 border-green-500";
                                        else if (idx === this.state.learning.quizAnsweredIdx) btnClass = "bg-red-600 border-red-500";
                                    }
                                    html += `
                                        <button onclick="app.answerMiniQuiz(${stepData.level}, ${idx})" class="w-full text-left p-4 rounded-xl border ${btnClass} transition-colors font-medium">
                                            ${opt}
                                        </button>
                                    `;
                                });
                                html += `</div>`;

                                if (this.state.learning.quizAnsweredIdx !== null) {
                                    if (this.state.learning.quizCorrect) {
                                        html += `
                                            <div class="mt-6 p-4 bg-green-500/20 text-green-400 rounded-xl border border-green-500/30 flex items-center gap-3 animate-fade-in">
                                                <i data-lucide="check-circle" class="w-6 h-6 flex-shrink-0"></i>
                                                <div class="flex-1 font-bold">Richtig! Perfekt gemacht.</div>
                                                <button onclick="app.nextLevel()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Weiter</button>
                                            </div>
                                        `;
                                    } else {
                                        html += `
                                            <div class="mt-6 p-4 bg-red-500/20 text-red-400 rounded-xl border border-red-500/30 flex items-center gap-3 animate-fade-in">
                                                <i data-lucide="x-circle" class="w-6 h-6 flex-shrink-0"></i>
                                                <div class="flex-1 font-bold">Leider falsch. Lies den Artikel nochmal!</div>
                                                <button onclick="app.handleNavigate(null, '${article.id}')" class="px-6 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-600">Nochmal probieren</button>
                                            </div>
                                        `;
                                    }
                                }
                                html += `</div>`;
                            }
                        }
                    }
                } 
                // Dashboard Startseite
                else {
                    html = `
                        <div class="text-center py-10 animate-fade-in">
                            <h1 class="text-4xl font-black mb-4 dark:text-white">Willkommen im <span class="text-indigo-600">IT Wiki</span></h1>
                            <p class="text-slate-500 max-w-lg mx-auto">Dein zentraler Knotenpunkt für Hardware-Wissen im Vertrieb. Wähle ein Thema aus der Leiste oder suche nach einem Begriff.</p>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 mt-8">
