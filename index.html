<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Vertriebs-Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .article-content p { margin-bottom: 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-200">
                        <i data-lucide="book-open"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl leading-tight">IT-Wiki</h1>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Vertriebs-Edition</p>
                    </div>
                </div>
                
                <nav class="space-y-1" id="sidebar-nav">
                    <!-- Nav items generated by JS -->
                </nav>
            </div>

            <div class="mt-auto p-6 border-t border-slate-100">
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-600 border border-slate-300">MA</div>
                    <div class="text-[11px]">
                        <p class="font-bold text-slate-700">Sprint 1 | V3.0</p>
                        <p class="text-slate-400">Inhaltlich Vollständig</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Header -->
            <header class="h-20 bg-white border-b border-slate-200 flex items-center px-8 shadow-sm z-10">
                <div class="relative w-full max-w-2xl">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="Alle 39 Glossar-Begriffe durchsuchen..." 
                        class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none"
                    >
                </div>
            </header>

            <!-- Content Area -->
            <section id="content-area" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div class="max-w-4xl mx-auto" id="view-container">
                    <!-- Views rendered here -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- DATA ---
        const wikiData = [
            { id: "ram", title: "Arbeitsspeicher (RAM)", category: "verarbeitung", definition: "Flüchtiger Kurzzeitspeicher für laufende Prozesse.", content: "Der RAM ist der 'Schreibtisch' des Computers. Alles, womit der PC gerade arbeitet, liegt hier bereit. Wird der Strom abgeschaltet, ist der Schreibtisch leer.", businessValue: "Viel RAM verhindert, dass der Rechner bei vielen offenen Programmen (Multitasking) ins Stocken gerät.", related: ["CPU", "SSD", "Verarbeitung"], tags: ["Hardware", "Speed"] },
            { id: "audio", title: "Audio-Anschlüsse", category: "peripherie", definition: "Schnittstellen zur Übertragung von Tonsignalen.", content: "Klassische Klinkenanschlüsse (3,5mm) oder USB für Headsets, Mikrofone und Lautsprecher.", businessValue: "Essenziell für professionelle Videokonferenzen und Support-Mitarbeiter im Home-Office.", related: ["Lautsprecher", "USB"], tags: ["Anschluss", "Kommunikation"] },
            { id: "aufloesung", title: "Auflösung", category: "ausgabe", definition: "Anzahl der Bildpunkte (Pixel) auf einem Monitor.", content: "Gibt an, wie scharf ein Bild ist. Gängige Standards sind Full-HD (1080p) oder 4K (UHD).", businessValue: "Höhere Auflösung bedeutet mehr Details und weniger Ermüdung der Augen bei Textarbeit.", related: ["Monitor", "Grafikkarte"], tags: ["Display", "Qualität"] },
            { id: "bildgroesse", title: "Bildschirmgröße", category: "ausgabe", definition: "Die Diagonale eines Monitors, meist in Zoll angegeben.", content: "Typische Büro-Größen sind 24 bis 27 Zoll. Größere Bildschirme erlauben das Nebeneinanderstellen von Fenstern.", businessValue: "Direkter Produktivitäts-Booster: Mehr Platz auf dem Schirm spart Zeit beim Fensterwechsel.", related: ["Monitor", "Auflösung"], tags: ["Hardware", "Ergonomie"] },
            { id: "bildrate", title: "Bildwiederholrate", category: "ausgabe", definition: "Anzahl der Bilder, die ein Monitor pro Sekunde anzeigt (Hz).", content: "60 Hz ist Standard. Höhere Raten (120/144 Hz) machen Bewegungen flüssiger.", businessValue: "Sorgt für ein 'ruhigeres' Bild und schont die Augen bei langer Bildschirmarbeit.", related: ["Monitor", "Grafikkarte"], tags: ["Hardware", "Komfort"] },
            { id: "cloud", title: "Cloud-Speicher", category: "speicherung", definition: "Speicherplatz auf entfernten Servern über das Internet.", content: "Dienste wie OneDrive oder Google Drive erlauben den Zugriff auf Daten von jedem Gerät weltweit.", businessValue: "Maximale Mobilität für den Vertrieb: Präsentationen sind auf Tablet, Handy und PC immer aktuell verfügbar.", related: ["Speicherung", "SSD"], tags: ["Internet", "Modern"] },
            { id: "desktop", title: "Desktop-PC", category: "bauformen", definition: "Stationärer Computer für den Einsatz am festen Arbeitsplatz.", content: "Besteht meist aus einem Gehäuse (Tower) und wird mit externer Peripherie betrieben.", businessValue: "Bietet das beste Preis-Leistungs-Verhältnis und ist einfach aufzurüsten oder zu reparieren.", related: ["Workstation", "Mini-PC", "Laptop"], tags: ["System", "Büro"] },
            { id: "displayport", title: "DisplayPort", category: "peripherie", definition: "Ein digitaler Anschlussstandard für Video und Audio.", content: "Ähnlich wie HDMI, aber im Profi-Bereich verbreiteter für den Anschluss hochauflösender Monitore.", businessValue: "Unterstützt sehr hohe Auflösungen und Bildraten – ideal für moderne Workstations.", related: ["HDMI", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "drucker", title: "Drucker", category: "ausgabe", definition: "Gerät zur Ausgabe von digitalen Daten auf Papier.", content: "Oberbegriff für Geräte, die Dokumente physisch greifbar machen.", businessValue: "Unverzichtbar für Verträge, Rechnungen und physische Marketingunterlagen beim Kunden.", related: ["Laserdrucker", "Tintenstrahl", "Plotter"], tags: ["Peripherie", "Output"] },
            { id: "eingabe", title: "Eingabe (Input)", category: "grundlagen", definition: "Der erste Schritt im EVA-Prinzip: Datenaufnahme.", content: "Überführung von Informationen vom Menschen in die Maschine.", businessValue: "Die Qualität der Eingabegeräte bestimmt, wie fehlerfrei und schnell Daten erfasst werden können.", related: ["Maus", "Tastatur", "Scanner", "EVA"], tags: ["Grundkonzept", "Prozess"] },
            { id: "hdd", title: "Festplatte (HDD)", category: "speicherung", definition: "Mechanischer Massenspeicher mit rotierenden Magnetscheiben.", content: "Günstiger Speicherplatz für große Datenmengen, aber deutlich langsamer als eine SSD.", businessValue: "Gute Wahl als günstiges Datengrab für Archive, die nicht täglich schnell abgerufen werden müssen.", related: ["SSD", "Speicherung"], tags: ["Hardware", "Storage"] },
            { id: "formfaktor", title: "Formfaktor", category: "bauformen", definition: "Standardisierte Größenangabe für Hardware-Bauteile.", content: "Gibt an, ob ein Mainboard in ein Gehäuse passt (z.B. ATX, Micro-ATX).", businessValue: "Entscheidend für die Kompatibilität beim Zusammenbau oder Aufrüsten von Kundensystemen.", related: ["Mainboard", "Desktop-PC"], tags: ["Standard", "Technik"] },
            { id: "grafik", title: "Grafikkarte", category: "verarbeitung", definition: "Komponente zur Berechnung der Bildausgabe.", content: "Kann ein eigener Chip (dediziert) oder im Prozessor integriert sein.", businessValue: "Wichtig für Grafik-Design, CAD oder Videobearbeitung. Ein Muss für kreative Kunden.", related: ["Monitor", "CPU"], tags: ["Hardware", "Grafik"] },
            { id: "hardware", title: "Hardware", category: "grundlagen", definition: "Die physischen, greifbaren Komponenten eines IT-Systems.", content: "Alles vom Gehäuse über das Mainboard bis zur Maus gehört zur Hardware.", businessValue: "Das materielle Investment des Kunden. Langlebige Hardware spart langfristig Wartungskosten.", related: ["Software", "Peripherie"], tags: ["Grundbegriff"] },
            { id: "hdmi", title: "HDMI", category: "peripherie", definition: "Universeller Anschluss für Bild und Ton.", content: "Standard an fast allen Monitoren, Fernsehern und Beamern.", businessValue: "Ermöglicht einfaches Plug-and-Play bei Präsentationen in Besprechungsräumen.", related: ["DisplayPort", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "kompatibilitaet", title: "Kompatibilität", category: "grundlagen", definition: "Das reibungslose Zusammenspiel verschiedener IT-Komponenten.", content: "Beschreibt, ob Hardware A mit Software B oder Hardware C zusammenarbeitet.", businessValue: "Fehlende Kompatibilität führt zu Ausfällen. Wir garantieren geprüfte Systeme.", related: ["Formfaktor", "Software"], tags: ["Beratung"] },
            { id: "lan", title: "LAN (Ethernet)", category: "peripherie", definition: "Kabelgebundene Netzwerkverbindung.", content: "Wird über ein RJ45-Kabel hergestellt. Stabiler und schneller als WLAN.", businessValue: "Empfehlenswert für stationäre Büro-Arbeitsplätze, um Verbindungsabbrüche in Meetings zu vermeiden.", related: ["Netzwerk", "Schnittstellen"], tags: ["Netzwerk", "Speed"] },
            { id: "laptop", title: "Laptop / Notebook", category: "bauformen", definition: "Tragbarer Computer mit integriertem Akku und Monitor.", content: "Kombiniert alle EVA-Komponenten in einem mobilen Gehäuse.", businessValue: "Ermöglicht flexibles Arbeiten im Home-Office, im Zug oder direkt beim Kunden vor Ort.", related: ["Desktop-PC", "Mini-PC"], tags: ["Mobil", "System"] },
            { id: "laserdrucker", title: "Laserdrucker", category: "ausgabe", definition: "Drucker, der mit Tonerpulver und Laserstrahlen arbeitet.", content: "Sehr schnell, wischfest und günstig im Seitpreis bei hohem Textaufkommen.", businessValue: "Die beste Wahl für klassische Büros mit viel Korrespondenz und Rechnungsdruck.", related: ["Drucker", "Tintenstrahl"], tags: ["Hardware", "Office"] },
            { id: "lautsprecher", title: "Lautsprecher", category: "ausgabe", definition: "Gerät zur akustischen Wiedergabe von Signalen.", content: "Wandelt elektrische Signale in hörbaren Schall um.", businessValue: "Wichtig für Webinare, Schulungsvideos oder akustische Systembenachrichtigungen.", related: ["Audio", "Ausgabe"], tags: ["Hardware", "Sound"] },
            { id: "mainboard", title: "Mainboard", category: "verarbeitung", definition: "Die Hauptplatine, die alle Bauteile verbindet.", content: "Das 'Skelett' des PCs. Hier werden CPU, RAM und Anschlüsse zusammengeführt.", businessValue: "Ein hochwertiges Mainboard sorgt für Systemstabilität und bietet Platz für zukünftige Upgrades.", related: ["CPU", "RAM", "Formfaktor"], tags: ["Hardware", "Zentrum"] },
            { id: "maus", title: "Maus", category: "eingabe", definition: "Eingabegerät zur Steuerung des Cursors auf dem Bildschirm.", content: "Erlaubt die Interaktion mit grafischen Benutzeroberflächen durch Klicken und Ziehen.", businessValue: "Ergonomische Mäuse beugen Gelenkschmerzen (Mausarm) vor – ein wichtiges Gesundheitsargument.", related: ["Tastatur", "Eingabe"], tags: ["Peripherie", "Ergonomie"] },
            { id: "minipc", title: "Mini-PC", category: "bauformen", definition: "Extrem kompakter Computer für Büroanwendungen.", content: "Oft kaum größer als ein Buch. Kann oft direkt hinter dem Monitor montiert werden.", businessValue: "Spart Platz auf dem Schreibtisch und verbraucht deutlich weniger Energie als große Tower-PCs.", related: ["Desktop-PC", "Laptop"], tags: ["System", "Platzsparend"] },
            { id: "monitor", title: "Monitor", category: "ausgabe", definition: "Das wichtigste visuelle Ausgabegerät.", content: "Zeigt die Benutzeroberfläche und Daten an. Das 'Fenster' zur digitalen Welt.", businessValue: "Ein zweiter Monitor kann die Arbeitseffizienz um bis zu 30% steigern.", related: ["Auflösung", "Bildgroesse", "Grafik"], tags: ["Hardware", "Anzeige"] },
            { id: "netzteil", title: "Netzteil", category: "verarbeitung", definition: "Bauteil zur Stromversorgung aller PC-Komponenten.", content: "Wandelt den Strom aus der Steckdose in die benötigten Spannungen für den PC um.", businessValue: "Ein effizientes Netzteil (80 Plus Zertifikat) senkt die monatlichen Stromkosten des Unternehmens.", related: ["Hardware", "Mainboard"], tags: ["Hardware", "Energie"] },
            { id: "peripherie", title: "Peripherie", category: "grundlagen", definition: "Zusatzgeräte, die an den Computer angeschlossen werden.", content: "Dazu zählen Maus, Tastatur, Drucker, Scanner und externe Festplatten.", businessValue: "Durch die richtige Peripherie wird ein einfacher PC erst zur individuellen Arbeitsstation für den Kunden.", related: ["Hardware", "Eingabe", "Ausgabe"], tags: ["Zubehör"] },
            { id: "plotter", title: "Plotter", category: "ausgabe", definition: "Großformatdrucker für technische Zeichnungen.", content: "Kann Papierrollen in Übergrößen (A1, A0) bedrucken. Wird oft mit Stiften oder Tintendüsen betrieben.", businessValue: "Unerlässlich für Architekten, Ingenieurbüros und Werbeagenturen.", related: ["Drucker", "Ausgabe"], tags: ["Spezial", "Hardware"] },
            { id: "cpu", title: "Prozessor (CPU)", category: "verarbeitung", definition: "Die Zentraleinheit und das 'Gehirn' des Computers.", content: "Der 'Sachbearbeiter', der alle Befehle ausführt. Mehr Kerne erlauben die parallele Bearbeitung von Aufgaben.", businessValue: "Das Herzstück für die Arbeitsgeschwindigkeit. Ein schneller Prozessor spart dem Kunden wertvolle Zeit.", related: ["Zentraleinheit", "Mainboard", "RAM"], tags: ["Hardware", "Gehirn"] },
            { id: "scanner", title: "Scanner", category: "eingabe", definition: "Gerät zur Digitalisierung von physischen Dokumenten.", content: "Wandelt Papier in digitale Dateien (PDF/Bild) um.", businessValue: "Basis für das 'papierlose Büro' und die schnelle Archivierung von Kundenakten.", related: ["Drucker", "Eingabe"], tags: ["Digitalisierung", "Peripherie"] },
            { id: "software", title: "Software", category: "grundlagen", definition: "Sammelbegriff für Programme und Betriebssysteme.", content: "Das 'Wissen' des Computers. Ohne Software weiß die Hardware nicht, was sie tun soll.", businessValue: "Die richtige Software (z.B. CRM oder Office) entscheidet über den Erfolg der Geschäftsprozesse.", related: ["Hardware", "Kompatibilitaet"], tags: ["Programme", "Immateriell"] },
            { id: "ssd", title: "Solid State Drive (SSD)", category: "speicherung", definition: "Elektronisches Speichermedium ohne bewegliche Teile.", content: "Das 'Turbo-Archiv'. Extrem schnelle Lese- und Schreibzugriffe.", businessValue: "Verkürzt das Hochfahren des PCs von Minuten auf Sekunden. Ein absolutes Muss für jeden Kunden.", related: ["HDD", "Speicherung", "RAM"], tags: ["Speed", "Hardware"] },
            { id: "speicherung", title: "Speicherung", category: "grundlagen", definition: "Die vierte Phase des EVA-S Prinzips: Dauerhaftes Sichern.", content: "Sorgt dafür, dass Daten auch nach dem Ausschalten erhalten bleiben.", businessValue: "Ein sicheres Speicherkonzept (lokal + Cloud) schützt den Kunden vor fatalem Datenverlust.", related: ["SSD", "HDD", "Cloud", "EVA"], tags: ["Archiv", "Sicherheit"] },
            { id: "tastatur", title: "Tastatur", category: "eingabe", definition: "Hauptgerät zur Eingabe von Texten und Befehlen.", content: "Bestandteil der Standard-Eingabe. Gibt es in verschiedenen Layouts (z.B. QWERTZ).", businessValue: "Gute Druckpunkte und leise Tasten erhöhen den Schreibkomfort in Großraumbüros.", related: ["Maus", "Eingabe"], tags: ["Hardware", "Input"] },
            { id: "tintenstrahl", title: "Tintenstrahldrucker", category: "ausgabe", definition: "Drucker, der flüssige Tinte auf das Papier sprüht.", content: "Ideal für Farbdrucke und Fotos. Günstiger in der Anschaffung als Laserdrucker.", businessValue: "Perfekt für Marketingabteilungen oder Kunden, die gelegentlich hochwertige Fotos drucken müssen.", related: ["Drucker", "Laserdrucker"], tags: ["Hardware", "Foto"] },
            { id: "usb", title: "USB (USB-A, USB-C)", category: "peripherie", definition: "Universeller Anschluss für fast alle Geräte.", content: "USB-A ist der alte Standard, USB-C der neue, verdrehsichere Alleskönner.", businessValue: "USB-C kann gleichzeitig laden, Daten übertragen und Monitore ansteuern – weniger Kabelsalat.", related: ["Schnittstellen", "Laptop"], tags: ["Anschluss", "Standard"] },
            { id: "verarbeitung", title: "Verarbeitung", category: "grundlagen", definition: "Die zweite Phase des EVA-Prinzip: Datenumwandlung.", content: "Hier wird aus einem Tastendruck ein Buchstabe oder aus Zahlen eine Grafik.", businessValue: "In dieser Phase entsteht der Mehrwert der IT: Daten werden zu nutzbaren Informationen.", related: ["CPU", "RAM", "Mainboard", "EVA"], tags: ["Prozess", "Logik"] },
            { id: "workstation", title: "Workstation", category: "bauformen", definition: "Hochleistungs-PC für spezialisierte Profi-Anwendungen.", content: "Besonders robust, mit extrem viel RAM und Profi-Grafikkarten ausgestattet.", businessValue: "Für Kunden mit extremen Anforderungen (3D-Design, Videoproduktion, KI-Berechnungen).", related: ["Desktop-PC", "Grafik"], tags: ["Leistung", "Profi"] },
            { id: "zentraleinheit", title: "Zentraleinheit", category: "grundlagen", definition: "Der Kern des Computersystems.", content: "Besteht im Wesentlichen aus Gehäuse, Netzteil, Mainboard und CPU.", businessValue: "Das stabile Herz der IT-Infrastruktur beim Kunden.", related: ["CPU", "Mainboard", "Hardware"], tags: ["Systemkern"] },
            { id: "ausgabe", title: "Ausgabe (Output)", category: "grundlagen", definition: "Die dritte Phase des EVA-Prinzips: Präsentation.", content: "Sichtbar- oder Hörbarmachen der verarbeiteten Daten für den Menschen.", businessValue: "Die Schnittstelle zum Anwender. Nur eine gute Ausgabe macht die IT-Arbeit erlebbar.", related: ["Monitor", "Drucker", "EVA"], tags: ["Ergebnis", "Display"] }
        ];

        const categories = [
            { id: 'dashboard', name: 'Wiki-Zentrale', icon: 'home' },
            { id: 'glossar', name: 'A-Z Glossar', icon: 'list' },
            { id: 'grundlagen', name: 'EVA-S & Grundlagen', icon: 'layers' },
            { id: 'verarbeitung', name: 'Verarbeitung (Kern)', icon: 'cpu' },
            { id: 'ausgabe', name: 'Ausgabe-Geräte', icon: 'monitor' },
            { id: 'speicherung', name: 'Speicherung', icon: 'hard-drive' },
            { id: 'peripherie', name: 'Anschlüsse & Extras', icon: 'usb' },
            { id: 'bauformen', name: 'Computer-Bauformen', icon: 'layout' }
        ];

        // --- STATE ---
        let currentTab = 'dashboard';
        let searchTerm = '';
        let selectedArticleId = null;

        // --- DOM ELEMENTS ---
        const navContainer = document.getElementById('sidebar-nav');
        const viewContainer = document.getElementById('view-container');
        const searchInput = document.getElementById('search-input');

        // --- LOGIC ---
        function init() {
            renderSidebar();
            renderView();
            
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                selectedArticleId = null;
                renderView();
            });
        }

        function renderSidebar() {
            navContainer.innerHTML = categories.map(cat => `
                <button 
                    onclick="switchTab('${cat.id}')"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${currentTab === cat.id && !searchTerm ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}"
                >
                    <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                    <span class="text-sm">${cat.name}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(id) {
            currentTab = id;
            searchTerm = '';
            selectedArticleId = null;
            searchInput.value = '';
            renderSidebar();
            renderView();
        }

        function openArticle(id) {
            selectedArticleId = id;
            searchTerm = '';
            renderView();
            document.getElementById('content-area').scrollTo(0, 0);
        }

        function renderView() {
            if (selectedArticleId) {
                renderArticleView();
            } else if (searchTerm) {
                renderSearchView();
            } else if (currentTab === 'dashboard') {
                renderDashboard();
            } else if (currentTab === 'glossar') {
                renderGlossary();
            } else {
                renderCategoryView();
            }
            lucide.createIcons();
        }

        function renderDashboard() {
            viewContainer.innerHTML = `
                <div class="space-y-10 animate-in fade-in duration-500">
                    <section>
                        <h2 class="text-3xl font-bold text-slate-900 mb-2 underline decoration-indigo-200 underline-offset-8">Vertriebs-Wiki Hardware</h2>
                        <p class="text-slate-500 text-lg">Wissen kompakt aufbereitet für den Verkaufsalltag. Verstehen Sie die Technik – begeistern Sie den Kunden.</p>
                    </section>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div onclick="switchTab('grundlagen')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="layers" class="text-indigo-600 mb-4 w-10 h-10"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">Das EVA-S Prinzip</h3>
                            <p class="text-slate-500 text-sm leading-relaxed italic">"Eingabe -> Verarbeitung -> Ausgabe -> Speicherung" – Die Landkarte der IT-Beratung.</p>
                        </div>
                        <div onclick="switchTab('verarbeitung')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="cpu" class="text-indigo-600 mb-4 w-10 h-10"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">Leistung verstehen</h3>
                            <p class="text-slate-500 text-sm leading-relaxed italic">Erfahren Sie, wie CPU und RAM als Team arbeiten (Büro-Analogie).</p>
                        </div>
                    </div>

                    <div class="bg-slate-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-2xl">
                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-4 text-indigo-300 font-bold uppercase tracking-widest text-xs">
                                <i data-lucide="info" class="w-4 h-4"></i>
                                <span>Verkaufs-Tipp des Tages</span>
                            </div>
                            <p class="text-xl font-medium leading-relaxed">
                                "Sagen Sie dem Kunden nicht: 'Das Mainboard hat den Formfaktor ATX'. Sagen Sie: 'Dieses Mainboard ist der perfekte Grundstein, falls Sie Ihren PC in zwei Jahren noch einmal aufrüsten möchten'."
                            </p>
                        </div>
                        <i data-lucide="zap" class="absolute -bottom-10 -right-10 text-white/5 w-64 h-64"></i>
                    </div>
                </div>
            `;
        }

        function renderGlossary() {
            const sorted = [...wikiData].sort((a, b) => a.title.localeCompare(b.title));
            const groups = {};
            sorted.forEach(item => {
                const firstLetter = item.title[0].toUpperCase();
                if (!groups[firstLetter]) groups[firstLetter] = [];
                groups[firstLetter].push(item);
            });

            viewContainer.innerHTML = `
                <div class="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                    <h2 class="text-3xl font-bold">A-Z Glossar</h2>
                    ${Object.keys(groups).sort().map(letter => `
                        <section>
                            <h3 class="text-lg font-black text-indigo-600 mb-4 border-b border-indigo-100 pb-2">${letter}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${groups[letter].map(art => `
                                    <div onclick="openArticle('${art.id}')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-indigo-400 hover:shadow-md cursor-pointer flex items-center justify-between group transition-all">
                                        <span class="font-bold text-slate-800">${art.title}</span>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `).join('')}
                </div>
            `;
        }

        function renderCategoryView() {
            const filtered = wikiData.filter(a => a.category === currentTab);
            const cat = categories.find(c => c.id === currentTab);
            viewContainer.innerHTML = `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="flex items-center gap-4 mb-8">
                        <div class="bg-indigo-100 p-3 rounded-2xl text-indigo-600">
                            <i data-lucide="${cat.icon}" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-3xl font-bold">${cat.name}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${filtered.map(art => `
                            <div onclick="openArticle('${art.id}')" class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm hover:shadow-xl hover:border-indigo-200 cursor-pointer transition-all flex flex-col">
                                <h3 class="font-bold text-xl mb-3 text-slate-800">${art.title}</h3>
                                <p class="text-slate-500 text-sm line-clamp-2 mb-4 italic leading-relaxed">${art.definition}</p>
                                <div class="mt-auto flex flex-wrap gap-2 pt-4 border-t border-slate-50">
                                    ${art.tags.map(t => `<span class="text-[9px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg uppercase font-black tracking-widest">${t}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSearchView() {
            const filtered = wikiData.filter(a => 
                a.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                a.definition.toLowerCase().includes(searchTerm.toLowerCase()) ||
                a.content.toLowerCase().includes(searchTerm.toLowerCase())
            );
            viewContainer.innerHTML = `
                <div class="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                    <h2 class="text-2xl font-bold">Suchergebnisse für "${searchTerm}"</h2>
                    <p class="text-sm text-slate-400">${filtered.length} Begriffe gefunden</p>
                    <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                        ${filtered.length > 0 ? `
                            <div class="divide-y divide-slate-100">
                                ${filtered.map(art => `
                                    <div onclick="openArticle('${art.id}')" class="p-6 hover:bg-slate-50 cursor-pointer flex items-center justify-between group transition-colors">
                                        <div class="max-w-2xl">
                                            <span class="font-bold text-lg text-slate-800 block mb-1 group-hover:text-indigo-600 transition-colors">${art.title}</span>
                                            <p class="text-sm text-slate-500 line-clamp-1">${art.definition}</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-6 h-6 transition-transform group-hover:translate-x-1"></i>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<div class="p-20 text-center text-slate-400">Keine Einträge für diese Suche gefunden.</div>'}
                    </div>
                </div>
            `;
        }

        function renderArticleView() {
            const article = wikiData.find(a => a.id === selectedArticleId);
            if (!article) return;

            viewContainer.innerHTML = `
                <article class="bg-white border border-slate-200 rounded-[2.5rem] p-8 md:p-14 shadow-2xl animate-in zoom-in-95 duration-300">
                    <button onclick="selectedArticleId=null; renderView();" class="mb-12 text-indigo-600 text-sm font-black flex items-center gap-2 hover:translate-x-[-4px] transition-transform">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> ZURÜCK ZUR AUSWAHL
                    </button>
                    
                    <header class="mb-12">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="bg-indigo-600 text-white text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-widest">
                                ${categories.find(c => c.id === article.category)?.name}
                            </span>
                        </div>
                        <h1 class="text-5xl font-black text-slate-900 mb-6 tracking-tight">${article.title}</h1>
                        <p class="text-2xl text-slate-400 font-medium leading-relaxed italic border-l-8 border-indigo-500 pl-8">
                            ${article.definition}
                        </p>
                    </header>

                    <div class="article-content text-slate-700 leading-relaxed text-lg mb-12 space-y-6">
                        <div class="bg-slate-50 rounded-3xl p-8 border border-slate-100">
                             <h4 class="text-sm font-black mb-4 text-slate-400 uppercase tracking-widest">Einfache Erklärung</h4>
                             <p class="text-xl">${article.content}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                        <div class="bg-indigo-900 p-8 rounded-3xl text-white shadow-xl shadow-indigo-100">
                            <h4 class="text-indigo-300 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="shield-check" class="w-4 h-4"></i> Das Vertriebs-Argument
                            </h4>
                            <p class="text-lg leading-relaxed font-medium">${article.businessValue}</p>
                        </div>
                        <div class="bg-white p-8 rounded-3xl border-2 border-slate-100">
                            <h4 class="text-slate-400 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="arrow-right-left" class="w-4 h-4"></i> Verwandte Themen
                            </h4>
                            <div class="flex flex-wrap gap-2">
                                ${article.related.map(rel => {
                                    const target = wikiData.find(a => a.title.toLowerCase().includes(rel.toLowerCase()));
                                    return `<button onclick="${target ? `openArticle('${target.id}')` : ''}" class="text-xs bg-slate-100 border border-slate-200 text-slate-600 px-4 py-2 rounded-full hover:border-indigo-400 hover:text-indigo-600 transition-all font-bold">${rel}</button>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-8 border-t border-slate-100">
                        ${article.tags.map(t => `<span class="text-[10px] bg-slate-900 text-white px-4 py-1.5 rounded-full font-black uppercase tracking-widest shadow-md shadow-slate-200">${t}</span>`).join('')}
                    </div>
                </article>
            `;
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
