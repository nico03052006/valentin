    <script>
        // --- DATA ---
        const WIKI_DATA = [
            { id: "eva_konzept", title: "Das EVA-Prinzip (Einstieg)", category: "eva_uebersicht", definition: "Das **EVA-Prinzip** ist das Fundament der IT: **E**ingabe, **V**erarbeitung, **A**usgabe.", content: "Bevor wir über moderne Speicherlösungen sprechen, müssen wir verstehen, wie ein Computer grundsätzlich arbeitet. Das klassische **EVA-Modell** erklärt den logischen Fluss von Daten:\n\n1. **Eingabe**: Ein Mensch gibt Daten ein (z. B. durch einen Tastendruck).\n2. **Verarbeitung**: Der Computer rechnet und wandelt den Tastendruck in einen Befehl um.\n3. **Ausgabe**: Das System zeigt dem Menschen das Ergebnis (z. B. den Buchstaben auf dem Schirm).\n\n**Vom EVA zum EVA-S**:\nIn der heutigen Arbeitswelt reicht das nicht mehr aus. Wir wollen Daten nicht nur kurz sehen, sondern behalten. Deshalb wurde das Modell um das **S** für **Speicherung** erweitert. \n\nStellen Sie sich vor, Sie schreiben ein Angebot: Ohne **Speicherung** wäre Ihre Arbeit nach dem Ausschalten des PCs weg. Erst durch die **SSD** oder die **Cloud** wird der Kreislauf für den Vertrieb profitabel.", businessValue: "Nutzen Sie das einfache EVA-Modell, um Kunden zu erklären, dass Hardware immer als geschlossene Kette funktioniert. Reißt ein Glied (z.B. schlechte Ausgabe), leidet der ganze Workflow.", related: ["Zentraleinheit", "Software", "Speicherung"], tags: ["Grundlagen", "Einstieg"] },
            { id: "eingabe_konzept", title: "Eingabe (Das Tor zum System)", category: "eingabe", definition: "Die **Eingabe** ist die erste Phase des EVA-S Prinzips. Hier gelangen Befehle des Nutzers in das digitale System.", content: "In der **Eingabe-Phase** übersetzen wir menschliche Wünsche in eine Sprache, die der Computer versteht. Denken Sie an den **Posteingang** in einem Büro: Ohne Briefe oder E-Mails hat der Sachbearbeiter keine Aufgabe.\n\nWichtige Punkte für die Beratung:\n- **Präzision**: Nur wenn die **Eingabe** fehlerfrei funktioniert (z.B. eine präzise **Maus**), kann das System effektiv arbeiten.\n- **Ergonomie**: Da der Mensch hier physisch mit der Technik interagiert (**Tastatur**), ist der Gesundheitsschutz hier am wichtigsten.", businessValue: "Eine hochwertige **Eingabe-Peripherie** steigert die Motivation der Mitarbeiter, da Frust durch unpräzise Geräte vermieden wird.", related: ["Tastatur", "Maus", "Scanner"], tags: ["Input", "EVA-S"] },
            { id: "verarbeitung_konzept", title: "Verarbeitung (Das Herz der IT)", category: "verarbeitung", definition: "In der **Verarbeitung** werden die Rohdaten durch Rechenoperationen in nutzbare Informationen verwandelt.", content: "Dies ist der Moment, in dem die Magie passiert. In unserem Büro-Modell ist das die eigentliche Schreibtischarbeit:\n- Der **Prozessor (CPU)** ist der Sachbearbeiter. Er rechnet, vergleicht und entscheidet.\n- Der **Arbeitsspeicher (RAM)** ist die Schreibtischplatte. Je größer sie ist, desto mehr Akten können gleichzeitig bearbeitet werden.\n- Das **Mainboard** stellt die Infrastruktur dar – die Flure, über die die Daten von A nach B fließen.", businessValue: "Die Phase der **Verarbeitung** entscheidet über die Geschwindigkeit. Ein Kunde, der keine Wartezeiten ('Sanduhr') will, braucht hier die beste Hardware.", related: ["CPU", "RAM", "Mainboard", "Grafikkarte"], tags: ["Logik", "EVA-S"] },
            { id: "ausgabe_konzept", title: "Ausgabe (Das Sichtbare)", category: "ausgabe", definition: "Die **Ausgabe** ist die Präsentation der verarbeiteten Daten für Menschen.", content: "In der **Ausgabe-Phase** verlässt das Ergebnis den Computer. In unserem Büro ist das der Moment, in dem der Sachbearbeiter das fertige Dokument präsentiert:\n- Über den **Monitor** (visuell).\n- Über den **Drucker** (physisch).\n- Über **Lautsprecher** (akustisch).\n\nHier kommt es auf die **Qualität** an. Ein schlechter Monitor macht die beste CPU-Leistung unsichtbar.", businessValue: "Die **Ausgabe** ist das, was der Kunde am Ende 'sieht'. Eine brillante Darstellung auf einem 4K-Monitor erhöht die wahrgenommene Wertigkeit der gesamten IT.", related: ["Monitor", "Drucker", "Lautsprecher"], tags: ["Output", "EVA-S"] },
            { id: "speicherung_konzept", title: "Speicherung (Das Gedächtnis)", category: "speicherung", definition: "Die **Speicherung** sichert Daten dauerhaft, damit sie auch nach dem Ausschalten verfügbar bleiben.", content: "Ohne die **Speicherung** wäre der Computer nur eine Schreibmaschine mit Kurzzeitgedächtnis. Das **S** im EVA-S Prinzip ist das **Archiv** unseres Büros:\n- Die **SSD** ist der moderne, schnelle Aktenschrank.\n- Die **Cloud** ist das externe Lager, auf das man von überall zugreifen kann.\n\nWichtig: Die **Speicherung** muss sicher und schnell sein, damit die **Verarbeitung** nicht ausgebremst wird.", businessValue: "Datensicherheit ist das Top-Thema. Ein Kunde investiert in **Speicherung**, um sein wertvollstes Gut – seine Daten – niemals zu verlieren.", related: ["SSD", "HDD", "Cloud-Speicher"], tags: ["Archiv", "EVA-S"] },
            { id: "doku_uebersicht", title: "Projekt-Doku: Übersicht", category: "sprint_berichte", definition: "Zentrale Übersicht über das IT-Wiki-Projekt und dessen Entwicklungsziele.", content: "<h3 class=\"text-xl font-bold text-slate-800 mb-4\">Scrum Ablauf</h3>\n<img src=\"Scrum_Ablauf.png\" alt=\"Scrum Ablauf Diagramm\" class=\"w-full max-w-4xl rounded-2xl shadow-md border border-slate-200 mb-10\">\n\nDieses IT-Wiki wurde als interaktives Nachschlagewerk für unser Vertriebsteam entwickelt.\n\n**Kernziele des Projekts:**\n- Schneller Zugriff auf fundiertes Hardware-Wissen während Kundengesprächen.\n- Bereitstellung einheitlicher, nutzenorientierter Verkaufsargumente (Pitches).\n- Strukturierte Erklärung durch das EVA-S Prinzip.\n\nIn diesem Dokumentationsbereich finden Sie alle Protokolle zu den Entwicklungs-Sprints und Retrospektiven, um den Fortschritt nachvollziehen zu können.\n\n<h3 class=\"text-xl font-bold text-slate-800 mb-4 mt-10\">Rollenverteilung</h3><div class=\"overflow-x-auto rounded-xl border border-slate-200 bg-white\"><table class=\"w-full text-left border-collapse text-sm\"><thead class=\"bg-slate-800 text-white\"><tr><th class=\"p-4 font-black\">ROLLE</th><th class=\"p-4 font-black\">NAME</th><th class=\"p-4 font-black\">AUFGABEN</th></tr></thead><tbody class=\"text-slate-700\"><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">PRODUCT OWNER</td><td class=\"p-4\">Malin</td><td class=\"p-4\">Anforderungen sammeln, Prioritäten festlegen</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">SCRUM MASTER</td><td class=\"p-4\">Nico</td><td class=\"p-4\">Achtet auf SCRUM-Ablauf, moderiert Dailys</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">ENTWICKLUNGSTEAM</td><td class=\"p-4\">Erza, Nico, Malin, Kasija</td><td class=\"p-4\">Inhalte erarbeiten (Hardware, EVA usw.)</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">DOKUMENTATION</td><td class=\"p-4\">Erza, Malin</td><td class=\"p-4\">Pflegt die Wissensdatenbank, Pflegt das Word Dokument</td></tr><tr><td class=\"p-4 font-bold\">QUALITÄTSSICHERUNG</td><td class=\"p-4\">Erza, Kasija</td><td class=\"p-4\">Prüft Verständlichkeit & Vollständigkeit</td></tr></tbody></table></div>\n\n<h3 class=\"text-xl font-bold text-slate-800 mb-4 mt-10\">Risikoanalyse</h3><div class=\"overflow-x-auto rounded-xl border border-slate-200 bg-white\"><table class=\"w-full text-left border-collapse text-sm\"><thead class=\"bg-slate-800 text-white\"><tr><th class=\"p-4 font-black\">Risiko</th><th class=\"p-4 font-black\">Beschreibung</th><th class=\"p-4 font-black\">Mögliche Auswirkungen</th><th class=\"p-4 font-black\">Gegenmaßnahmen</th></tr></thead><tbody class=\"text-slate-700\"><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Unklare Aufgabenverteilung</td><td class=\"p-4\">Aufgaben und Verantwortlichkeiten sind nicht eindeutig festgelegt</td><td class=\"p-4\">Doppelarbeit, vergessene Aufgaben, Verzögerungen im Projekt</td><td class=\"p-4\">Klare Zuordnung von Features und Tasks, Pflege des Kanban-Boards, regelmäßige Weeklys</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Zeitmangel durch zu große Aufgaben</td><td class=\"p-4\">Tasks sind zu umfangreich oder schlecht eingeplant</td><td class=\"p-4\">Sprintziele werden nicht erreicht, Zeitdruck vor der Abgabe</td><td class=\"p-4\">Tasks klein und konkret formulieren, Aufgaben im Weekly nachschärfen</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Fachlich falsche oder ungenaue Inhalte</td><td class=\"p-4\">Fehlendes technisches Wissen führt zu falschen Erklärungen</td><td class=\"p-4\">Wissensdatenbank ist unzuverlässig, falsche Kundenberatung</td><td class=\"p-4\">Gegenseitige Kontrolle im Team, Nutzung von Unterrichtsunterlagen, Rückfragen an Lehrkraft</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Inhalte zu technisch für den Vertrieb</td><td class=\"p-4\">Zu viele Fachbegriffe oder komplizierte Erklärungen</td><td class=\"p-4\">Zielgruppe versteht Inhalte nicht, geringe Nutzung der Datenbank</td><td class=\"p-4\">Einfache Sprache verwenden, Praxisbeispiele einbauen, Inhalte gegenlesen lassen</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Uneinheitliche Struktur und Sprache</td><td class=\"p-4\">Unterschiedliche Schreibstile und Aufbauten</td><td class=\"p-4\">Unübersichtlicher Gesamteindruck, schlechte Lesbarkeit</td><td class=\"p-4\">Einheitliche Struktur festlegen (EVA-Prinzip), Abschluss-Review durchführen</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Mangelnde Teamkommunikation</td><td class=\"p-4\">Fehlende oder unregelmäßige Abstimmungen</td><td class=\"p-4\">Missverständnisse, unklarer Projektstand</td><td class=\"p-4\">Regelmäßige Weeklys, offene Kommunikation, transparenter Fortschritt im Kanban-Board</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-4 font-bold\">Technische Probleme mit Tools</td><td class=\"p-4\">Probleme mit Word, Conceptboard oder Dateizugriff</td><td class=\"p-4\">Zeitverlust, möglicher Datenverlust</td><td class=\"p-4\">Regelmäßiges Speichern, gemeinsame Ablage, klare Dateinamen</td></tr><tr><td class=\"p-4 font-bold\">Pflichtbegriffe nicht vollständig abgedeckt</td><td class=\"p-4\">Begriffe aus dem Dokument „Wichtige Begriffe“ fehlen</td><td class=\"p-4\">Anforderungen nicht erfüllt, Punktabzug</td><td class=\"p-4\">Checkliste verwenden, Vollständigkeit vor Abgabe prüfen</td></tr></tbody></table></div>", businessValue: "Eine transparente Dokumentation sichert das Projektwissen und beschleunigt das Onboarding neuer Vertriebsmitarbeiter.", related: ["sprint1", "sprint2", "retro"], tags: ["Projekt", "Übersicht"] },
            { id: "sprint1", title: "Dokumentation: Sprint 1", category: "sprint_berichte", definition: "Zeitraum: Projektbeginn bis 30.04.2026. Fokus: Grundstruktur und Kernkonzepte.", content: "Im ersten Sprint haben wir die Basis für die Wissensdatenbank geschaffen.\n\n**Erreichte Meilensteine:**\n- Festlegung des **EVA-S Prinzips** als Navigationsstruktur.\n- Erstellung des **Glossars** mit allen geforderten Fachbegriffen.\n- Entwicklung der **Büro-Analogie** zur Erklärung komplexer Hardware-Vorgänge.\n- Implementierung der **Suchfunktion** und des interaktiven Designs.", businessValue: "Sprint 1 stellt sicher, dass das Team eine gemeinsame Sprache spricht und das Grundgerüst steht.", related: ["EVA-Prinzip", "Sprint 2"], tags: ["SCRUM", "Sprint 1"] },
            { id: "sprint2", title: "Dokumentation: Sprint 2", category: "sprint_berichte", definition: "Zeitraum: 01.05.2026 bis 21.05.2026. Fokus: Detailtiefe und Finalisierung.", content: "Der zweite Sprint dient der inhaltlichen Vertiefung und dem Feinschliff.\n\n**Geplante Aufgaben:**\n- Detaillierte Beschreibung von **Spezial-Hardware** (z.B. Plotter, Workstations).\n- Ausarbeitung technischer **Schnittstellen** (HDMI 2.1 vs DisplayPort 1.4).\n- Abschlusspräsentation und Projektabgabe am **21.05.2026**.", businessValue: "Ziel ist ein marktreifes Produkt, das sofort für neue Vertriebler als Nachschlagewerk genutzt werden kann.", related: ["Sprint 1", "Retrospektive"], tags: ["SCRUM", "Sprint 2"] },
            { id: "ram", title: "Arbeitsspeicher (RAM)", image: "RAM.png", category: "verarbeitung", definition: "Flüchtiger Kurzzeitspeicher für laufende Prozesse.", content: "Der RAM ist der 'Schreibtisch' des Computers. Alles, womit der PC gerade arbeitet, liegt hier bereit. Wird der Strom abgeschaltet, ist der Schreibtisch leer.", businessValue: "Viel RAM verhindert, dass der Rechner bei vielen offenen Programmen (Multitasking) ins Stocken gerät.", related: ["CPU", "SSD"], tags: ["Hardware", "Speed"] },
            { id: "cpu", title: "Prozessor (CPU)", category: "verarbeitung", definition: "Die Zentraleinheit und das 'Gehirn' des Computers.", content: "Der 'Sachbearbeiter', der alle Befehle ausführt. Mehr Kerne erlauben die parallele Bearbeitung von Aufgaben.", businessValue: "Das Herzstück für die Arbeitsgeschwindigkeit. Ein schneller Prozessor spart dem Kunden wertvolle Zeit.", related: ["Zentraleinheit", "Mainboard", "RAM"], tags: ["Hardware", "Gehirn"] },
            { id: "ssd", title: "Solid State Drive (SSD)", category: "speicherung", definition: "Elektronisches Speichermedium ohne bewegliche Teile.", content: "Das 'Turbo-Archiv'. Extrem schnelle Lese- und Schreibzugriffe.", businessValue: "Verkürzt das Hochfahren des PCs von Minuten auf Sekunden. Ein absolutes Muss für jeden Kunden.", related: ["HDD", "Speicherung"], tags: ["Speed", "Hardware"] },
            { id: "monitor", title: "Monitor", category: "ausgabe", definition: "Das wichtigste visuelle Ausgabegerät.", content: "Zeigt die Benutzeroberfläche und Daten an. Das 'Fenster' zur digitalen Welt.", businessValue: "Ein zweiter Monitor kann die Arbeitseffizienz um bis zu 30% steigern.", related: ["Auflösung", "Grafikkarte"], tags: ["Hardware", "Anzeige"] },
            { id: "workstation", title: "Workstation", category: "bauformen", definition: "Hochleistungs-PC für spezialisierte Profi-Anwendungen.", content: "Besonders robust, mit extrem viel RAM und Profi-Grafikkarten ausgestattet.", businessValue: "Für Kunden mit extremen Anforderungen (3D-Design, Videoproduktion, KI-Berechnungen).", related: ["Desktop-PC", "Grafikkarte"], tags: ["Leistung", "Profi"] },
            { id: "cloud", title: "Cloud-Speicher", category: "speicherung", definition: "Speicherplatz auf entfernten Servern über das Internet.", content: "Dienste wie OneDrive oder Google Drive erlauben den Zugriff auf Daten von jedem Gerät weltweit.", businessValue: "Maximale Mobilität für den Vertrieb: Präsentationen sind auf Tablet, Handy und PC immer aktuell verfügbar.", related: ["SSD", "Speicherung"], tags: ["Internet", "Modern"] },
            { id: "energieeffizienz", title: "Energieeffizienz", category: "grundlagen", definition: "Das Verhältnis von erbrachter Rechenleistung zum benötigten Stromverbrauch.", content: "Besonders bei Firmen mit vielen Arbeitsplätzen ist die **Energieeffizienz** ein riesiger Hebel für die laufenden Kosten. Zertifizierungen (wie '80 PLUS' bei Netzteilen) oder stromsparende Mobil-CPUs helfen dabei, die Stromrechnung und die Abwärme zu senken.", businessValue: "Ein energieeffizientes System rechnet sich über die Laufzeit von selbst. Argumentieren Sie beim Kunden mit den Gesamtbetriebskosten (TCO - Total Cost of Ownership) statt nur mit dem reinen Anschaffungspreis.", related: ["CPU", "Desktop-PC"], tags: ["Kosten", "Umwelt", "Beratung"] },
            { id: "externer_speicher", title: "Externer Speicher (z. B. USB-Stick, externe Festplatte)", category: "speicherung", definition: "Mobile Speichermedien, die meist über USB an das System angeschlossen werden.", content: "**Externe Speicher** sind ideal für den Transport großer Datenmengen offline oder für lokale Backups. Während USB-Sticks extrem portabel sind, bieten externe Festplatten (HDD oder SSD) riesigen Speicherplatz zu einem günstigen Preis.\n\nZu beachten: Externe SSDs sind deutlich robuster gegen Stürze und Erschütterungen als mechanische externe HDDs.", businessValue: "Verkaufen Sie immer ein Backup-Konzept mit. Ein externer Speicher ist die einfachste und günstigste 'Versicherung' gegen Datenverlust am Einzelplatz.", related: ["SSD", "Cloud-Speicher", "Speicherung"], tags: ["Backup", "Mobil", "Hardware"] },
            { id: "hardware", title: "Hardware", category: "grundlagen", definition: "Die physischen, greifbaren Komponenten eines IT-Systems.", content: "Alles vom Gehäuse über das Mainboard bis zur Maus gehört zur Hardware.", businessValue: "Das materielle Investment des Kunden. Langlebige Hardware spart langfristig Wartungskosten.", related: ["Software", "Peripherie"], tags: ["Grundbegriff"] },
            { id: "software", title: "Software", category: "grundlagen", definition: "Sammelbegriff für Programme und Betriebssysteme.", content: "Das 'Wissen' des Computers. Ohne Software weiß die Hardware nicht, was sie tun soll.", businessValue: "Die richtige Software (z.B. CRM oder Office) entscheidet über den Erfolg der Geschäftsprozesse.", related: ["Hardware", "Kompatibilität"], tags: ["Programme", "Immateriell"] },
            { id: "peripherie_konzept", title: "Peripherie", category: "eingabe", definition: "Zusatzgeräte, die an den Computer angeschlossen werden.", content: "Dazu zählen Maus, Tastatur, Drucker, Scanner und externe Festplatten.", businessValue: "Durch die richtige Peripherie wird ein einfacher PC erst zur individuellen Arbeitsstation für den Kunden.", related: ["Hardware", "Eingabe", "Ausgabe"], tags: ["Zubehör"] },
            { id: "zentraleinheit", title: "Zentraleinheit", category: "grundlagen", definition: "Der Kern des Computers.", content: "Besteht im Wesentlichen aus Gehäuse, Netzteil, Mainboard und CPU.", businessValue: "Das stabile Herz der IT-Infrastruktur beim Kunden.", related: ["CPU", "Mainboard", "Hardware"], tags: ["Systemkern"] },
            { id: "tastatur", title: "Tastatur", category: "eingabe", definition: "Hauptgerät zur Eingabe von Texten und Befehlen.", content: "Bestandteil der Standard-Eingabe. Gibt es in verschiedenen Layouts (z.B. QWERTZ).", businessValue: "Gute Druckpunkte und leise Tasten erhöhen den Schreibkomfort in Großraumbüros.", related: ["Maus", "Eingabe"], tags: ["Hardware", "Input"] },
            { id: "maus", title: "Maus", category: "eingabe", definition: "Eingabegerät zur Steuerung des Cursors auf dem Bildschirm.", content: "Erlaubt die Interaktion mit grafischen Benutzeroberflächen durch Klicken und Ziehen.", businessValue: "Ergonomische Mäuse beugen Gelenkschmerzen (Mausarm) vor – ein wichtiges Gesundheitsargument.", related: ["Tastatur", "Eingabe"], tags: ["Peripherie", "Ergonomie"] },
            { id: "scanner", title: "Scanner", category: "eingabe", definition: "Gerät zur Digitalisierung von physischen Dokumenten.", content: "Wandelt Papier in digitale Dateien (PDF/Bild) um.", businessValue: "Basis für das 'papierlose Büro' und die schnelle Archivierung von Kundenakten.", related: ["Drucker", "Eingabe"], tags: ["Digitalisierung", "Peripherie"] },
            { id: "mainboard", title: "Mainboard", category: "verarbeitung", definition: "Die Hauptplatine, die alle Bauteile verbindet.", content: "Das 'Skelett' des PCs. Hier werden CPU, RAM und Anschlüsse zusammengeführt.", businessValue: "Ein hochwertiges Mainboard sorgt für Systemstabilität und bietet Platz für zukünftige Upgrades.", related: ["CPU", "RAM", "Formfaktor"], tags: ["Hardware", "Zentrum"] },
            { id: "grafik", title: "Grafikkarte", category: "verarbeitung", definition: "Komponente zur Berechnung der Bildausgabe.", content: "Kann ein eigener chip (dediziert) oder im Prozessor integriert sein.", businessValue: "Wichtig für Grafik-Design, CAD oder Videobearbeitung. Ein Muss für kreative Kunden.", related: ["Monitor", "CPU"], tags: ["Hardware", "Grafik"] },
            { id: "drucker", title: "Drucker", category: "ausgabe", definition: "Gerät zur Ausgabe von digitalen Daten auf Papier.", content: "Oberbegriff für Geräte, die Dokumente physisch greifbar machen.", businessValue: "Unverzichtbar für Verträge, Rechnungen und physische Marketingunterlagen beim Kunden.", related: ["Laserdrucker", "Tintenstrahldrucker", "Plotter"], tags: ["Peripherie", "Output"] },
            { id: "lautsprecher", title: "Lautsprecher", category: "ausgabe", definition: "Gerät zur akustischen Wiedergabe von Signalen.", content: "Wandelt elektrische Signale in hörbaren Schall um.", businessValue: "Wichtig für Webinare, Schulungsvideos oder akustische Systembenachrichtigungen.", related: ["Audio-Anschlüsse", "Ausgabe"], tags: ["Hardware", "Sound"] },
            { id: "hdd", title: "Festplatte (HDD)", category: "speicherung", definition: "Mechanischer Massenspeicher mit rotierenden Magnetscheiben.", content: "Günstiger Speicherplatz für große Datenmengen, aber deutlich langsamer als eine SSD.", businessValue: "Gute Wahl als günstiges Datengrab für Archive, die nicht täglich schnell abgerufen werden müssen.", related: ["SSD", "Speicherung"], tags: ["Hardware", "Storage"] },
            { id: "desktop", title: "Desktop-PC", category: "bauformen", definition: "Stationärer Computer für den Einsatz am festen Arbeitsplatz.", content: "Besteht meist aus einem Gehäuse (Tower) und wird mit externer Peripherie betrieben.", businessValue: "Bietet das beste Preis-Leistungs-Verhältnis und ist einfach aufzurüsten oder zu reparieren.", related: ["Workstation", "Mini-PC", "Laptop"], tags: ["System", "Büro"] },
            { id: "laptop", title: "Laptop / Notebook", category: "bauformen", definition: "Tragbarer Computer mit integriertem Akku und Monitor.", content: "Kombiniert alle EVA-Komponenten in einem mobilen Gehäuse.", businessValue: "Ermöglicht flexibles Arbeiten im Home-Office, im Zug oder direkt beim Kunden vor Ort.", related: ["Desktop-PC", "Mini-PC"], tags: ["Mobil", "System"] },
            { id: "minipc", title: "Mini-PC", category: "bauformen", definition: "Extrem kompakter Computer für Büroanwendungen.", content: "Oft kaum größer als ein Buch. Kann oft direkt hinter dem Monitor montiert werden.", businessValue: "Spart Platz auf dem Schreibtisch und verbraucht deutlich weniger Energie als große Tower-PCs.", related: ["Desktop-PC", "Laptop"], tags: ["System", "Platzsparend"] },
            { id: "netzteil", title: "Netzteil", category: "verarbeitung", definition: "Bauteil zur Stromversorgung aller PC-Komponenten.", content: "Wandelt den Strom aus der Steckdose in die benötigten Spannungen für den PC um.", businessValue: "Ein effizientes Netzteil (80 Plus Zertifikat) senkt die monatlichen Stromkosten des Unternehmens.", related: ["Hardware", "Mainboard"], tags: ["Hardware", "Energie"] },
            { id: "formfaktor", title: "Formfaktor (z. B. ATX)", category: "bauformen", definition: "Standardisierte Größenangabe für Hardware-Bauteile.", content: "Gibt an, ob ein Mainboard in ein Gehäuse passt (z.B. ATX, Micro-ATX).", businessValue: "Entscheidend für die Kompatibilität beim Zusammenbau oder Aufrüsten von Kundensystemen.", related: ["Mainboard", "Desktop-PC"], tags: ["Standard", "Technik"] },
            { id: "usb", title: "USB (USB-A, USB-C)", category: "peripherie", definition: "Universeller Anschluss für fast alle Geräte.", content: "USB-A ist der alte Standard, USB-C der neue, verdrehsichere Alleskönner.", businessValue: "USB-C kann gleichzeitig laden, Daten übertragen und Monitore ansteuern – weniger Kabelsalat.", related: ["Laptop"], tags: ["Anschluss", "Standard"] },
            { id: "hdmi", title: "HDMI", category: "peripherie", definition: "Universeller Anschluss für Bild und Ton.", content: "Standard an fast allen Monitoren, Fernsehern und Beamern.", businessValue: "Ermöglicht einfaches Plug-and-Play bei Präsentationen in Besprechungsräumen.", related: ["DisplayPort", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "displayport", title: "DisplayPort", category: "peripherie", definition: "Ein digitaler Anschlussstandard für Video und Audio.", content: "Ähnlich wie HDMI, aber im Profi-Bereich verbreiteter für den Anschluss hochauflösender Monitore.", businessValue: "Unterstützt sehr hohe Auflösungen und Bildraten – ideal für moderne Workstations.", related: ["HDMI", "Monitor"], tags: ["Anschluss", "Video"] },
            { id: "lan", title: "LAN (Ethernet)", category: "peripherie", definition: "Kabelgebundene Netzwerkverbindung.", content: "Wird über ein RJ45-Kabel hergestellt. Stabiler und schneller als WLAN.", businessValue: "Empfehlenswert für stationäre Büro-Arbeitsplätze, um Verbindungsabbrüche in Meetings zu vermeiden.", related: ["USB"], tags: ["Netzwerk", "Speed"] },
            { id: "audio", title: "Audio-Anschlüsse", category: "peripherie", definition: "Schnittstellen zur Übertragung von Tonsignalen.", content: "Klassische Klinkenanschlüsse (3,5mm) oder USB für Headsets, Mikrofone und Lautsprecher.", businessValue: "Essenziell für professionelle Videokonferenzen und Support-Mitarbeiter im Home-Office.", related: ["Lautsprecher", "USB"], tags: ["Anschluss", "Kommunikation"] },
            { id: "aufloesung", title: "Auflösung", category: "ausgabe", definition: "Anzahl der Bildpunkte (Pixel) auf einem Monitor.", content: "Gibt an, wie scharf ein Bild ist. Gängige Standards sind Full-HD (1080p) oder 4K (UHD).", businessValue: "Höhere Auflösung bedeutet mehr Details und weniger Ermüdung der Augen bei Textarbeit.", related: ["Monitor", "Grafikkarte"], tags: ["Display", "Qualität"] },
            { id: "bildgroesse", title: "Bildschirmgröße", category: "ausgabe", definition: "Die Diagonale eines Monitors, meist in Zoll angegeben.", content: "Typische Büro-Größen sind 24 bis 27 Zoll. Größere Bildschirme erlauben das Nebeneinanderstellen von Fenstern.", businessValue: "Direkter Produktivitäts-Booster: Mehr Platz auf dem Schirm spart Zeit beim Fensterwechsel.", related: ["Monitor", "Auflösung"], tags: ["Hardware", "Ergonomie"] },
            { id: "bildrate", title: "Bildwiederholrate", category: "ausgabe", definition: "Anzahl der Bilder, die ein Monitor pro Sekunde anzeigt (Hz).", content: "60 Hz ist Standard. Höhere Raten (120/144 Hz) machen Bewegungen flüssiger.", businessValue: "Sorgt für 'ruhigeres' Bild und schont die Augen bei langer Bildschirmarbeit.", related: ["Monitor", "Grafikkarte"], tags: ["Hardware", "Komfort"] },
            { id: "laserdrucker", title: "Laserdrucker", category: "ausgabe", definition: "Drucker, der mit Tonerpulver und Laserstrahlen arbeitet.", content: "Sehr schnell, wischfest und günstig im Seitpreis bei hohem Textaufkommen.", businessValue: "Die beste Wahl für klassische Büros mit viel Korrespondenz und Rechnungsdruck.", related: ["Drucker", "Tintenstrahldrucker"], tags: ["Hardware", "Office"] },
            { id: "tintenstrahl", title: "Tintenstrahldrucker", category: "ausgabe", definition: "Drucker, flüssige Tinte auf das Papier sprüht.", content: "Ideal für Farbdrucke und Fotos. Günstiger in der Anschaffung als Laserdrucker.", businessValue: "Perfekt für Marketingabteilungen oder Kunden, die gelegentlich hochwertige Fotos drucken müssen.", related: ["Drucker", "Laserdrucker"], tags: ["Hardware", "Foto"] },
            { id: "plotter", title: "Plotter", category: "ausgabe", definition: "Großformatdrucker für technische Zeichnungen.", content: "Kann Papierrollen in Übergrößen (A1, A0) bedrucken. Wird oft mit Stiften oder Tintendüsen betrieben.", businessValue: "Unerlässlich für Architekten, Ingenieurbüros und Werbeagenturen.", related: ["Drucker", "Ausgabe"], tags: ["Spezial", "Hardware"] },
            { id: "ergonomie", title: "Ergonomie", category: "grundlagen", definition: "Wissenschaft von der optimalen Anpassung der Arbeitsbedingungen.", content: "Bedeutet in der IT: Monitore auf Augenhöhe, Handballenauflagen, aufrechte Sitzposition.", businessValue: "Ein ergonomischer Arbeitsplatz reduziert nachweislich Krankheitstage. Ein starkes Argument bei der Beratung von Einkäufern.", related: ["Maus", "Monitor"], tags: ["Gesundheit", "Beratung"] },
            { id: "kompatibilitaet", title: "Kompatibilität", category: "grundlagen", definition: "Das reibungslose Zusammenspiel verschiedener IT-Komponenten.", content: "Beschreibt, ob Hardware A mit Software B oder Hardware C zusammenarbeitet.", businessValue: "Fehlende Kompatibilität führt zu Ausfällen. Wir garantieren geprüfte Systeme.", related: ["Formfaktor", "Software"], tags: ["Beratung"] },
            { id: "server", title: "Server", category: "bauformen", definition: "Ein zentraler Computer, der Ressourcen, Daten oder Dienste für andere Netzwerkteilnehmer (Clients) bereitstellt.", content: "Server arbeiten meist im Hintergrund (oft in klimatisierten Serverräumen) und sind auf Zuverlässigkeit im 24/7-Dauerbetrieb ausgelegt. Sie unterscheiden sich von normalen PCs durch spezielle Hardware (z.B. redundante Netzteile, ECC-RAM zur Fehlerkorrektur).", businessValue: "Ein eigener Server vor Ort bietet maximale Kontrolle über sensible Daten. Argumentieren Sie mit Ausfallsicherheit und Datensouveränität.", related: ["Cloud-Speicher", "Netzteil", "Desktop-PC"], tags: ["Infrastruktur", "Profi", "System"] },
            { id: "nas", title: "NAS (Network Attached Storage)", category: "speicherung", definition: "Ein intelligenter Dateiserver, der Speicherplatz im lokalen Netzwerk bereitstellt.", content: "Ein NAS ist wie eine private Mini-Cloud im Büro. Mehrere Nutzer können gleichzeitig auf Dateien zugreifen. Oft mit mehreren Festplatten ausgestattet, die sich gegenseitig spiegeln (RAID), um Datenverlust bei einem Festplattendefekt zu verhindern.", businessValue: "Das ideale Einstiegsprodukt für kleine Teams, um Daten zentral und sicher zu teilen, ohne gleich einen teuren Windows-Server anschaffen zu müssen.", related: ["Festplatte (HDD)", "Externer Speicher", "Cloud-Speicher"], tags: ["Backup", "Netzwerk", "Teamwork"] },
            { id: "usv", title: "USV (Unterbrechungsfreie Stromversorgung)", category: "peripherie", definition: "Ein Gerät mit Akku, das bei Stromausfall angeschlossene Systeme kurzzeitig weiter mit Strom versorgt.", content: "Eine USV schützt Hardware nicht nur vor kompletten Stromausfällen, sondern gleicht auch gefährliche Spannungsschwankungen aus dem Stromnetz aus. Sie gibt dem System genug Zeit, um geregelt herunterzufahren, ohne dass Daten beschädigt werden.", businessValue: "Ein absolutes Muss-Zubehör beim Verkauf von Servern und NAS-Systemen. Positionieren Sie es als 'Airbag' für die Unternehmensdaten.", related: ["Netzteil", "Server"], tags: ["Sicherheit", "Zubehör"] },
            { id: "dockingstation", title: "Dockingstation", category: "peripherie", definition: "Ein Verteilerknoten, der Laptops über ein einziges Kabel mit Strom, Monitoren, Netzwerk und Peripherie verbindet.", content: "In modernen Büros (Desk-Sharing) unverzichtbar. Der Nutzer schließt nur noch ein USB-C-Kabel an seinen Laptop an und ist sofort mit zwei Monitoren, Maus, Tastatur und dem Firmennetzwerk verbunden.", businessValue: "Verkaufen Sie keine Firmen-Laptops ohne Dockingstation! Sie ist der Schlüssel zu Produktivität und Ergonomie am modernen (flexiblen) Arbeitsplatz.", related: ["Laptop / Notebook", "USB (USB-A, USB-C)", "Monitor"], tags: ["Zubehör", "Produktivität", "Mobil"] },
            { id: "firewall", title: "Firewall", category: "grundlagen", definition: "Ein Sicherheitssystem, das den Netzwerkverkehr nach festgelegten Regeln überwacht und kontrolliert.", content: "Eine Firewall agiert als Türsteher zwischen dem sicheren Firmennetzwerk und dem unsicheren Internet. Hardware-Firewalls prüfen den Datenverkehr bereits, bevor er überhaupt ins interne Netzwerk des Kunden gelangt.", businessValue: "Das wichtigste Verkaufsargument beim Thema IT-Security. Ein erfolgreicher Cyberangriff oder Datenverlust ist immer deutlich teurer als eine professionelle Firewall.", related: ["Software", "Server"], tags: ["Sicherheit", "Netzwerk", "Beratung"] },
            { id: "betriebssystem", title: "Betriebssystem (OS)", category: "grundlagen", definition: "Die grundlegende Software, die die Hardware eines Computers verwaltet und Basisdienste für Anwendungen bereitstellt.", content: "Beispiele sind Windows, macOS oder Linux. Das Betriebssystem ist der Dolmetscher zwischen den physischen Bauteilen (CPU, RAM) und den Programmen (z.B. Word, Browser), die der Nutzer bedient.", businessValue: "Wählen Sie das OS passend zur Kunden-Softwarelandschaft. Bedenken Sie auch Upgrade-Zyklen (z.B. das Support-Ende von Windows 10) als Vertriebschance für neue Hardware.", related: ["Software", "Kompatibilität"], tags: ["Basis", "Software"] },
            { id: "wlan", title: "WLAN (Wi-Fi)", category: "peripherie", definition: "Lokales Funknetzwerk, das Geräten die kabellose Verbindung untereinander oder zum Internet ermöglicht.", content: "WLAN-Standards entwickeln sich ständig weiter (z.B. Wi-Fi 6, Wi-Fi 7), um höhere Geschwindigkeiten und mehr gleichzeitige Geräte in dichten Büroumgebungen bewältigen zu können.", businessValue: "Kabellose Büros liegen im Trend. Bieten Sie neben den Endgeräten auch gleich die Ausleuchtung und Installation von professionellen WLAN-Access-Points an.", related: ["LAN (Ethernet)", "Laptop / Notebook"], tags: ["Netzwerk", "Mobil"] },
            { id: "webcam", title: "Webcam", category: "eingabe", definition: "Kamera zur Erfassung von Video-Signalen, essenziell für digitale Besprechungen.", content: "Oft bereits in Laptops integriert. Externe Webcams oder spezielle Konferenzraum-Kameras bieten jedoch eine deutlich höhere Bildqualität, besseren Autofokus, eine bessere Ausleuchtung und weite Sichtfelder für mehrere Personen.", businessValue: "Der professionelle Außenauftritt eines Unternehmens findet heute oft per Video-Call statt. Eine gute Kamera ist eine extrem günstige Investition in ein seriöses Firmen-Image.", related: ["Audio-Anschlüsse", "Laptop / Notebook"], tags: ["Kommunikation", "Peripherie"] }
        ];

        const NAVIGATION = [
            { id: 'dashboard', name: 'Zentrale', icon: 'home' },
            { id: 'glossar', name: 'A-Z Glossar', icon: 'list' },
            { id: 'grundlagen', name: 'Grundlagen', icon: 'book-open' },
            { 
                id: 'evas', 
                name: 'EVA-S Prinzip', 
                icon: 'layers', 
                children: [
                    { id: 'eva_uebersicht', name: 'Konzept & Übersicht', icon: 'info' },
                    { id: 'eva_eingabe', name: 'Eingabe', icon: 'mouse-pointer-2' },
                    { id: 'eva_verarbeitung', name: 'Verarbeitung', icon: 'cpu' },
                    { id: 'eva_ausgabe', name: 'Ausgabe', icon: 'monitor' },
                    { id: 'eva_speicherung', name: 'Speicherung', icon: 'hard-drive' }
                ]
            },
            {
                id: 'geraete',
                name: 'Hardware & Geräte',
                icon: 'laptop',
                children: [
                    { id: 'eingabe', name: 'Eingabegeräte', icon: 'mouse-pointer-2' },
                    { id: 'verarbeitung', name: 'Verarbeitung', icon: 'cpu' },
                    { id: 'ausgabe', name: 'Ausgabegeräte', icon: 'monitor' },
                    { id: 'speicherung', name: 'Speicherung', icon: 'hard-drive' },
                    { id: 'peripherie', name: 'Peripherie & Anschlüsse', icon: 'usb' },
                    { id: 'bauformen', name: 'Computer-Bauformen', icon: 'layout' }
                ]
            }
        ];

        const DOC_NAV = {
            id: 'dokumentation',
            name: 'Projekt-Doku',
            icon: 'folder-kanban',
            children: [
                { id: 'doku_uebersicht', name: 'Übersicht', icon: 'info' },
                { id: 'kanban', name: 'Kanban Board', icon: 'kanban' },
                { id: 'sprint1', name: 'Sprint 1 Report', icon: 'check-circle' },
                { id: 'sprint2', name: 'Sprint 2 Planung', icon: 'clock' }
            ]
        };

        // --- APP STATE & LOGIC ---
        const app = {
            state: {
                currentTab: 'dashboard',
                selectedArticleId: null,
                searchTerm: '',
                isSidebarOpen: window.innerWidth >= 768,
                openSubmenus: { evas: false, geraete: true, dokumentation: false },
                
                // Chatbot State
                chatState: {
                    isOpen: false,
                    messages: [{ role: 'model', text: 'Hallo! Ich bin dein KI-Vertriebsassistent. Welche Hardware-Konzepte soll ich dir erklären oder welches Verkaufsargument suchst du?' }],
                    isLoading: false
                }
            },

            init() {
                this.renderSidebar();
                this.renderContent();
                this.renderChat();
                this.updateSidebarMobileVisibility();
                
                window.addEventListener('resize', () => {
                    if (window.innerWidth >= 768 && !this.state.isSidebarOpen) {
                        this.state.isSidebarOpen = true;
                        this.updateSidebarMobileVisibility();
                    } else if (window.innerWidth < 768 && this.state.isSidebarOpen) {
                        this.state.isSidebarOpen = false;
                        this.updateSidebarMobileVisibility();
                    }
                });
            },

            formatText(text) {
                if (!text) return '';
                return text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br/>');
            },

            // --- NAVIGATION ---
            handleNavigate(tabId, articleId = null) {
                this.state.currentTab = tabId;
                this.state.selectedArticleId = articleId;
                this.state.searchTerm = '';
                document.getElementById('search-input').value = '';
                
                if (window.innerWidth < 768) {
                    this.closeSidebar();
                }
                
                this.renderSidebar();
                this.renderContent();
                document.getElementById('content-area').scrollTo(0, 0);
            },

            handleSearch(term) {
                this.state.searchTerm = term;
                this.renderContent();
            },

            toggleSubmenu(id) {
                this.state.openSubmenus[id] = !this.state.openSubmenus[id];
                this.renderSidebar();
            },

            toggleSidebar() {
                this.state.isSidebarOpen = !this.state.isSidebarOpen;
                this.updateSidebarMobileVisibility();
            },

            closeSidebar() {
                this.state.isSidebarOpen = false;
                this.updateSidebarMobileVisibility();
            },

            updateSidebarMobileVisibility() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                const toggleBtn = document.getElementById('mobile-toggle');

                if (this.state.isSidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                    toggleBtn.classList.add('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                    if (window.innerWidth < 768) {
                        toggleBtn.classList.remove('hidden');
                    }
                }
            },

            getCategoryTitle() {
                let displayTitle = this.state.currentTab;
                [...NAVIGATION, DOC_NAV].forEach(c => {
                    if (c.id === this.state.currentTab) displayTitle = c.name;
                    if (c.children) {
                        const child = c.children.find(child => child.id === this.state.currentTab);
                        if (child) displayTitle = child.name;
                    }
                });
                return displayTitle;
            },

            // --- CHATBOT LOGIC ---
            toggleChat() {
                this.state.chatState.isOpen = !this.state.chatState.isOpen;
                this.renderChat();
            },

            async sendChatMessage() {
                const inputEl = document.getElementById('chat-input');
                const text = inputEl ? inputEl.value.trim() : '';
                
                if (!text || this.state.chatState.isLoading) return;

                // User Nachricht hinzufügen
                this.state.chatState.messages.push({ role: 'user', text: text });
                this.state.chatState.isLoading = true;
                this.renderChat();

                const apiKey = ""; // API Key wird automatisch vom System bereitgestellt
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const contextData = WIKI_DATA.map(d => `- ${d.title}: ${d.definition}`).join('\n');
                const systemInstruction = {
                    parts: [{ text: `Du bist ein freundlicher, professioneller IT-Vertriebsassistent für das 'all around IT Wiki'. Beantworte Fragen auf Deutsch, prägnant (max. 3-4 Sätze) und direkt auf den Kundennutzen ausgerichtet. Nutze diese Wiki-Daten als dein Kernwissen:\n${contextData}` }]
                };
                
                const contents = this.state.chatState.messages.map(msg => ({
                    role: msg.role === 'model' ? 'model' : 'user',
                    parts: [{ text: msg.text }]
                }));

                const payload = { contents, systemInstruction };
                const delays = [1000, 2000, 4000, 8000, 16000];
                let responseText = "Entschuldigung, es gab einen Fehler bei der Kommunikation mit der KI.";

                for (let attempt = 0; attempt < 5; attempt++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP Fehler! Status: ${response.status}`);
                        const data = await response.json();
                        responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Keine Antwort erhalten.";
                        break;
                    } catch (error) {
                        if (attempt === 4) break;
                        await new Promise(resolve => setTimeout(resolve, delays[attempt]));
                    }
                }

                this.state.chatState.messages.push({ role: 'model', text: responseText });
                this.state.chatState.isLoading = false;
                this.renderChat();
            },

            // --- RENDERING ---
            renderChat() {
                const container = document.getElementById('chat-widget-container');
                if (!container) return;
                
                let html = '';
                
                if (this.state.chatState.isOpen) {
                    const messagesHtml = this.state.chatState.messages.map(msg => `
                        <div class="flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-sm ${msg.role === 'user' ? 'bg-indigo-200 text-indigo-800' : 'bg-indigo-600 text-white'}">
                                <i data-lucide="${msg.role === 'user' ? 'user' : 'bot'}" class="w-4 h-4"></i>
                            </div>
                            <div class="p-3 rounded-2xl text-sm leading-relaxed shadow-sm max-w-[80%] ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-white border border-slate-200 text-slate-700 rounded-tl-sm'}">
                                ${this.formatText(msg.text)}
                            </div>
                        </div>
                    `).join('');

                    const loadingHtml = this.state.chatState.isLoading ? `
                        <div class="flex gap-3 flex-row">
                            <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm">
                                <i data-lucide="bot" class="w-4 h-4"></i>
                            </div>
                            <div class="p-3 bg-white border border-slate-200 rounded-2xl rounded-tl-sm flex items-center gap-2 shadow-sm">
                                <i data-lucide="loader-2" class="w-4 h-4 text-indigo-600 animate-spin"></i>
                                <span class="text-sm text-slate-500">Tippt...</span>
                            </div>
                        </div>
                    ` : '';

                    html += `
                        <div class="mb-4 w-[350px] sm:w-[400px] h-[500px] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-slide-in pointer-events-auto">
                            <div class="bg-indigo-600 text-white p-4 flex items-center justify-between shrink-0">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="bot" class="w-5 h-5"></i>
                                    <span class="font-bold">IT-Wiki KI</span>
                                </div>
                                <button onclick="app.toggleChat()" class="text-indigo-200 hover:text-white transition-colors">
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                            
                            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50">
                                ${messagesHtml}
                                ${loadingHtml}
                            </div>
                            
                            <div class="p-4 bg-white border-t border-slate-100 shrink-0">
                                <div class="relative flex items-center">
                                    <input 
                                        type="text"
                                        id="chat-input"
                                        onkeydown="if(event.key === 'Enter') app.sendChatMessage()"
                                        placeholder="Frag mich etwas..."
                                        class="w-full bg-slate-100 border-none rounded-full pl-4 pr-12 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                    />
                                    <button 
                                        onclick="app.sendChatMessage()"
                                        ${this.state.chatState.isLoading ? 'disabled' : ''}
                                        class="absolute right-2 p-2 text-indigo-600 hover:bg-indigo-100 rounded-full transition-colors disabled:opacity-50"
                                    >
                                        <i data-lucide="send" class="w-[18px] h-[18px]"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <button 
                        onclick="app.toggleChat()"
                        class="w-14 h-14 bg-slate-900 hover:bg-indigo-600 text-white rounded-full shadow-2xl flex items-center justify-center transition-all hover:scale-110 active:scale-95 pointer-events-auto"
                    >
                        <i data-lucide="${this.state.chatState.isOpen ? 'x' : 'message-circle'}" class="w-6 h-6"></i>
                    </button>
                `;

                container.innerHTML = html;
                lucide.createIcons();

                // Nach dem Rendern ans Ende des Chats scrollen und Fokus auf Input setzen
                if (this.state.chatState.isOpen) {
                    const messagesDiv = document.getElementById('chat-messages');
                    if (messagesDiv) messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    
                    const inputEl = document.getElementById('chat-input');
                    if (inputEl && !this.state.chatState.isLoading) inputEl.focus();
                }
            },

            renderSidebar() {
                const renderNavButton = (item, isChild = false) => {
                    const isActive = this.state.currentTab === item.id && !this.state.searchTerm;
                    if (item.children) {
                        const isOpen = this.state.openSubmenus[item.id];
                        return `
                            <div>
                                <button onclick="app.toggleSubmenu('${item.id}')" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all text-left">
                                    <div class="flex items-center gap-3 flex-1 overflow-hidden">
                                        <i data-lucide="${item.icon}" class="w-5 h-5 shrink-0"></i>
                                        <span class="text-sm font-semibold truncate">${item.name}</span>
                                    </div>
                                    <i data-lucide="chevron-down" class="w-4 h-4 shrink-0 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}"></i>
                                </button>
                                <div class="overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}">
                                    <div class="pt-1 space-y-1">
                                        ${item.children.map(child => renderNavButton(child, true)).join('')}
                                    </div>
                                </div>
                            </div>`;
                    }

                    let onclickAction = `app.handleNavigate('${item.id}')`;
                    const conceptMap = {
                        'eva_uebersicht': 'eva_konzept', 'eva_eingabe': 'eingabe_konzept',
                        'eva_verarbeitung': 'verarbeitung_konzept', 'eva_ausgabe': 'ausgabe_konzept',
                        'eva_speicherung': 'speicherung_konzept',
                        'doku_uebersicht': 'doku_uebersicht',
                        'sprint1': 'sprint1', 'sprint2': 'sprint2'
                    };
                    if (conceptMap[item.id]) {
                        onclickAction = `app.handleNavigate('${item.id}', '${conceptMap[item.id]}')`;
                    }

                    const paddingClass = isChild ? 'pl-11 pr-4' : 'px-4';
                    const activeClass = isActive ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900';
                    const iconSize = isChild ? 'w-[18px] h-[18px]' : 'w-5 h-5';
                    
                    const alignmentClass = isChild ? 'items-start' : 'items-center';
                    const iconMargin = isChild ? 'mt-0.5' : '';

                    return `
                        <button onclick="${onclickAction}" class="w-full flex ${alignmentClass} gap-3 py-2.5 rounded-xl transition-all ${paddingClass} ${activeClass} text-left">
                            <i data-lucide="${item.icon}" class="${iconSize} shrink-0 ${iconMargin}"></i>
                            <span class="text-sm font-medium flex-1 leading-snug">${item.name}</span>
                        </button>`;
                };

                document.getElementById('main-nav').innerHTML = NAVIGATION.map(item => renderNavButton(item)).join('');
                document.getElementById('doc-nav').innerHTML = renderNavButton(DOC_NAV);
                lucide.createIcons();
            },

            renderContent() {
                const container = document.getElementById('view-container');
                let html = '';

                // Search Results View
                if (this.state.searchTerm) {
                    const term = this.state.searchTerm.toLowerCase();
                    const filtered = WIKI_DATA.filter(a => 
                        a.title.toLowerCase().includes(term) || 
                        a.definition.toLowerCase().includes(term)
                    );

                    html = `
                        <div class="space-y-6 animate-slide-in">
                            <h2 class="text-2xl font-black">Ergebnisse für "${this.state.searchTerm}"</h2>
                            <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                                ${filtered.length > 0 ? `
                                    <div class="divide-y divide-slate-100">
                                        ${filtered.map(art => {
                                            const cleanTitle = art.title.split('(')[0].split('/')[0].trim();
                                            const imgSrc = art.image || '';
                                            return `
                                            <button onclick="app.handleNavigate('${art.category}', '${art.id}')" class="w-full text-left p-6 hover:bg-slate-50 flex items-center gap-6 group transition-colors">
                                                <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0 bg-slate-100 hidden sm:block">
                                                    <img src="${imgSrc}" alt="${cleanTitle}" onerror="this.onerror=null; this.src='https://placehold.co/100x100/eef2ff/4f46e5?text=${encodeURIComponent(cleanTitle)}'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                                                </div>
                                                <div class="flex-1">
                                                    <span class="font-bold text-lg text-slate-800 block mb-1 group-hover:text-indigo-600">${art.title}</span>
                                                    <p class="text-sm text-slate-500 line-clamp-1">${art.definition.replace(/\*\*/g, '')}</p>
                                                </div>
                                                <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-5 h-5 transition-transform group-hover:translate-x-1 shrink-0"></i>
                                            </button>
                                        `}).join('')}
                                    </div>
                                ` : `
                                    <div class="p-20 text-center text-slate-400">Keine passenden Begriffe gefunden.</div>
                                `}
                            </div>
                        </div>
                    `;
                } 
                // Article Detail View
                else if (this.state.selectedArticleId) {
                    const article = WIKI_DATA.find(a => a.id === this.state.selectedArticleId);
                    if (article) {
                        const cleanTitle = article.title.split('(')[0].split('/')[0].trim();
                        const imgSrc = article.image || '';
                        const tagsHtml = article.tags.map(t => 
                            `<span class="text-[10px] px-3 py-1 rounded-lg uppercase font-black tracking-widest bg-slate-900 text-white shadow-sm">${t}</span>`
                        ).join('');

                        const relatedHtml = article.related.map(rel => {
                            const target = WIKI_DATA.find(a => a.title.toLowerCase().includes(rel.toLowerCase()));
                            const action = target ? `onclick="app.handleNavigate('${target.category}', '${target.id}')"` : '';
                            return `<button ${action} class="text-xs bg-slate-100 border border-slate-200 text-slate-600 px-4 py-2 rounded-full hover:border-indigo-400 hover:text-indigo-600 transition-all font-bold">${rel}</button>`;
                        }).join('');

                        html = `
                            <article class="bg-white border border-slate-200 rounded-[2.5rem] p-6 md:p-14 shadow-xl animate-zoom-in">
                                <button onclick="app.handleNavigate(app.state.currentTab)" class="mb-8 text-indigo-600 text-sm font-black flex items-center gap-2 hover:-translate-x-1 transition-transform">
                                    <i data-lucide="arrow-left" class="w-4 h-4"></i> ZURÜCK ZUR ÜBERSICHT
                                </button>
                                
                                <header class="mb-10">
                                    <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-6 tracking-tight">${article.title}</h1>
                                    <p class="text-xl md:text-2xl text-slate-400 font-medium leading-relaxed italic border-l-8 border-indigo-500 pl-6 md:pl-8">
                                        ${this.formatText(article.definition)}
                                    </p>
                                </header>

                                ${article.category !== 'sprint_berichte' ? `
                                <div class="mb-12 w-full h-64 md:h-96 rounded-3xl overflow-hidden border border-slate-100 shadow-inner relative bg-slate-50">
                                    <img src="${imgSrc}" alt="${cleanTitle}" onerror="this.onerror=null; this.src='https://placehold.co/800x400/eef2ff/4f46e5?text=${encodeURIComponent(cleanTitle)}'" class="w-full h-full object-cover">
                                </div>
                                ` : ''}

                                <div class="text-slate-700 leading-relaxed text-lg mb-12 space-y-6">
                                    <div class="bg-slate-50 rounded-3xl p-6 md:p-8 border border-slate-100">
                                        <h4 class="text-sm font-black mb-4 text-slate-400 uppercase tracking-widest">Technischer Hintergrund</h4>
                                        <div class="whitespace-pre-line leading-relaxed text-slate-600">
                                            ${this.formatText(article.content)}
                                        </div>
                                    </div>
                                </div>

                                ${article.category !== 'sprint_berichte' ? `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 mb-12">
                                    <div class="bg-indigo-900 p-8 rounded-3xl text-white shadow-xl shadow-indigo-100 relative overflow-hidden">
                                        <i data-lucide="shield-check" class="absolute -right-4 -bottom-4 w-24 h-24 text-white/5 rotate-12"></i>
                                        <h4 class="text-indigo-300 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                            <i data-lucide="shield-check" class="w-4 h-4"></i> VERTRIEBS-ARGUMENT
                                        </h4>
                                        <p class="text-lg leading-relaxed font-medium relative z-10">
                                            ${article.businessValue.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white underline decoration-indigo-400">$1</strong>')}
                                        </p>
                                    </div>
                                    
                                    <div class="bg-white p-8 rounded-3xl border-2 border-slate-100">
                                        <h4 class="text-slate-400 font-black text-xs mb-4 uppercase tracking-widest flex items-center gap-2">
                                            <i data-lucide="arrow-right-left" class="w-4 h-4"></i> VERWANDTE THEMEN
                                        </h4>
                                        <div class="flex flex-wrap gap-2">
                                            ${relatedHtml}
                                        </div>
                                    </div>
                                </div>

                                <div class="flex gap-3 pt-8 border-t border-slate-100 flex-wrap">
                                    ${tagsHtml}
                                </div>
                                ` : ''}
                            </article>
                        `;
                    }
                } 
                // Dashboard View
                else if (this.state.currentTab === 'dashboard') {
                    html = `
                        <div class="space-y-10 animate-fade-in">
                            <section>
                                <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-4 underline decoration-indigo-200 underline-offset-8">Vertriebs-Wiki Hardware</h2>
                                <p class="text-slate-500 text-lg md:text-xl">Wissen kompakt aufbereitet für Verkaufsalltag. Verstehen Sie die Technik – begeistern Sie den Kunden.</p>
                            </section>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div onclick="app.handleNavigate('eva_uebersicht', 'eva_konzept')" class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group">
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                        <i data-lucide="layers" class="w-6 h-6"></i>
                                    </div>
                                    <h3 class="text-xl font-bold mb-2">Das EVA-S Prinzip</h3>
                                    <p class="text-slate-500 text-sm leading-relaxed italic">Beginnen Sie mit dem Grundgerüst jeder IT-Beratung. Einfach erklärt für Laien.</p>
                                </div>
                                <div onclick="app.handleNavigate('glossar')" class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group">
                                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                        <i data-lucide="list" class="w-6 h-6"></i>
                                    </div>
                                    <h3 class="text-xl font-bold mb-2">A-Z Index</h3>
                                    <p class="text-slate-500 text-sm leading-relaxed italic">Alle Fachbegriffe von Arbeitsspeicher bis Zentraleinheit auf einen Blick.</p>
                                </div>
                            </div>

                            <div class="bg-slate-900 rounded-[2.5rem] p-8 md:p-12 text-white relative overflow-hidden shadow-2xl">
                                <div class="relative z-10">
                                    <div class="flex items-center gap-2 mb-6 text-indigo-300 font-black uppercase tracking-[0.2em] text-xs">
                                        <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
                                        <span>Verkaufs-Tipp des Tages</span>
                                    </div>
                                    <p class="text-xl md:text-2xl font-medium leading-relaxed italic">
                                        "Verkaufen Sie keine Gigabyte, sondern Sicherheit. Sagen Sie: 'Mit dieser SSD-Lösung sind Ihre Kundendaten nicht nur schneller verfügbar, sondern auch vor mechanischen Defekten geschützt.'"
                                    </p>
                                </div>
                                <i data-lucide="zap" class="absolute -bottom-10 -right-10 text-white/5 w-64 h-64"></i>
                            </div>
                        </div>
                    `;
                }
                // Glossary A-Z View
                else if (this.state.currentTab === 'glossar') {
                    const sorted = [...WIKI_DATA].sort((a, b) => a.title.localeCompare(b.title, 'de'));
                    const groups = {};
                    sorted.forEach(item => {
                        const letter = item.title.charAt(0).toUpperCase();
                        if (!groups[letter]) groups[letter] = [];
                        groups[letter].push(item);
                    });

                    const groupHtml = Object.keys(groups).sort().map(letter => `
                        <section>
                            <h3 class="text-xl font-bold text-indigo-700 mb-4 border-b border-indigo-100 pb-2">${letter}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${groups[letter].map(art => `
                                    <button onclick="app.handleNavigate('${art.category}', '${art.id}')" class="p-4 bg-white border border-slate-200 rounded-2xl hover:border-indigo-400 hover:shadow-md transition-all text-left flex items-center justify-between group">
                                        <span class="font-bold text-slate-800">${art.title}</span>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-4 h-4 transition-transform group-hover:translate-x-1 shrink-0"></i>
                                    </button>
                                `).join('')}
                            </div>
                        </section>
                    `).join('');

                    html = `
                        <div class="space-y-12 animate-slide-in">
                            <h2 class="text-3xl font-black">A-Z Glossar</h2>
                            <div class="space-y-10">
                                ${groupHtml}
                            </div>
                        </div>
                    `;
                }
                // Kanban View (CryptPad iFrame)
                else if (this.state.currentTab === 'kanban') {
                    html = `
                        <div class="flex flex-col animate-fade-in h-full">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 shrink-0">
                                <div>
                                    <h2 class="text-3xl font-black capitalize">Kanban Board</h2>
                                    <p class="text-slate-500 mt-1">Gemeinsames Projektboard über CryptPad.</p>
                                </div>
                            </div>
                            
                            <div class="w-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden" style="height: 1000px;">
                                <iframe 
                                    src="https://cryptpad.fr/kanban/#/2/kanban/view/DyBsTGMdamt4G02TtJl6OhRlVPNtzbqP0wwedvlLEIQ/embed/" 
                                    style="width: 100%; height: 100%; border: none;"
                                    allowfullscreen="true">
                                </iframe>
                            </div>
                        </div>
                    `;
                }
                // Category View
                else {
                    const filtered = WIKI_DATA.filter(a => a.category === this.state.currentTab);
                    const title = this.getCategoryTitle();

                    const cardsHtml = filtered.map(art => {
                        const cleanTitle = art.title.split('(')[0].split('/')[0].trim();
                        const imgSrc = art.image || '';
                        return `
                        <div onclick="app.handleNavigate('${art.category}', '${art.id}')" class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm hover:shadow-xl hover:border-indigo-200 cursor-pointer transition-all flex flex-col group">
                            <div class="h-40 bg-slate-100 relative overflow-hidden border-b border-slate-100">
                                <img src="${imgSrc}" alt="${cleanTitle}" onerror="this.onerror=null; this.src='https://placehold.co/600x300/eef2ff/4f46e5?text=${encodeURIComponent(cleanTitle)}'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="p-6 flex flex-col flex-1">
                                <h3 class="font-bold text-xl mb-3 text-slate-800 group-hover:text-indigo-600">${art.title}</h3>
                                <p class="text-slate-500 text-sm line-clamp-2 mb-4 italic leading-relaxed">${art.definition.replace(/\*\*/g, '')}</p>
                                ${art.category !== 'sprint_berichte' ? `
                                <div class="mt-auto flex flex-wrap gap-2 pt-4 border-t border-slate-50">
                                    ${art.tags.map(t => `<span class="text-[10px] px-2 py-1 rounded-lg uppercase font-black tracking-widest bg-indigo-50 text-indigo-600">${t}</span>`).join('')}
                                </div>
                                ` : ''}
                            </div>
                        </div>`;
                    }).join('');

                    html = `
                        <div class="space-y-8 animate-fade-in">
                            <div class="flex items-center justify-between border-b border-slate-200 pb-6">
                                <h2 class="text-3xl font-black capitalize">${title}</h2>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${cardsHtml}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
                lucide.createIcons();
            }
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
            window.app = app; // Expose to global scope for inline onclick handlers
        });
    </script>
</body>
</html>
