<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Vertriebs-Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .article-content p { margin-bottom: 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <i data-lucide="book-open"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl leading-tight">IT-Wiki</h1>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Vertriebs-Edition</p>
                    </div>
                </div>
                
                <nav class="space-y-1" id="sidebar-nav">
                    <!-- Nav items generated by JS -->
                </nav>
            </div>

            <div class="mt-auto p-6 border-t border-slate-100">
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold">MA</div>
                    <div class="text-[11px]">
                        <p class="font-bold">Sprint 1 | V2.1</p>
                        <p class="text-slate-400">HTML/JS Version (Demo)</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Header -->
            <header class="h-20 bg-white border-b border-slate-200 flex items-center px-8 shadow-sm">
                <div class="relative w-full max-w-2xl">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="Wiki durchsuchen (Platzhalter-Modus)..." 
                        class="w-full pl-12 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500 transition-all outline-none"
                    >
                </div>
            </header>

            <!-- Content Area -->
            <section id="content-area" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div class="max-w-4xl mx-auto" id="view-container">
                    <!-- Views rendered here -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- DATA ---
        // Alle Inhalte wurden durch Platzhaltertexte ersetzt
        const wikiData = [
            {
                id: "eva",
                title: "EVA-Prinzip",
                category: "grundlagen",
                definition: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
                content: "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.",
                businessValue: "Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam varius, turpis et commodo pharetra.",
                related: ["CPU", "Tastatur", "Monitor"],
                tags: ["Grundlagen", "Logik"]
            },
            {
                id: "cpu",
                title: "CPU (Prozessor)",
                category: "hardware",
                definition: "Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas.",
                content: "Vestibulum tortor quam, feugiat vitae, ultricies eget, tempor sit amet, ante. Donec eu libero sit amet quam egestas semper. Aenean ultricies mi vitae est. Mauris placerat eleifend leo. Quisque sit amet est et sapien ullamcorper pharetra.",
                businessValue: "Donec non enim in turpis pulvinar facilisis. Ut felis. Praesent dapibus, neque id cursus faucibus.",
                related: ["Mainboard", "RAM", "Workstation"],
                tags: ["Verarbeitung", "Hardware"]
            },
            {
                id: "ram",
                title: "Arbeitsspeicher (RAM)",
                category: "hardware",
                definition: "Aliquam erat volutpat. Nam dui mi, tincidunt quis, accumsan porttitor, facilisis luctus, metus.",
                content: "Phasellus ultrices nulla quis nibh. Quisque a lectus. Donec consectetuer ligula vulputate sem tristique cursus. Nam nulla quam, gravida non, commodo a, sodales sit amet, nisi. Pellentesque fermentum dolor.",
                businessValue: "Aenean dignissim pellentesque felis. Maecenas malesuada elit lectus felis, malesuada ultricies.",
                related: ["CPU", "SSD"],
                tags: ["Verarbeitung", "Speicher"]
            },
            {
                id: "mainboard",
                title: "Mainboard",
                category: "hardware",
                definition: "Maecenas egestas arcu quis ligula mattis placerat. Proin accumsan sem vitae nisi.",
                content: "In hac habitasse platea dictumst. Aliquam nec lorem ante. In non mollis enim. Aliquam nec varius nisl. Quisque sit amet est et sapien ullamcorper pharetra. Vestibulum erat wisi, condimentum sed, commodo vitae, ornare sit amet, wisi.",
                businessValue: "In hac habitasse platea dictumst. Fusce sodales ligo ac diam.",
                related: ["Formfaktor", "CPU", "Schnittstellen"],
                tags: ["Hardware", "Infrastruktur"]
            },
            {
                id: "ssd",
                title: "SSD (Solid State Drive)",
                category: "speicherung",
                definition: "Suspendisse potenti. In eleifend scelerisque enim. Ut enim ad minim veniam.",
                content: "Cras iaculis ultricies nulla. Donec quis nibh at felis congue commodo. Quisque sit amet est et sapien ullamcorper pharetra. Vestibulum erat wisi, condimentum sed, commodo vitae, ornare sit amet, wisi. Aenean ultricies mi vitae est.",
                businessValue: "Nulla facilisi. Integer lacinia sollicitudin massa. Cras metus.",
                related: ["HDD", "Cloud-Speicher"],
                tags: ["Speicherung", "Speed"]
            },
            {
                id: "monitor",
                title: "Monitor",
                category: "ausgabe",
                definition: "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
                content: "Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.",
                businessValue: "Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.",
                related: ["Grafikkarte", "HDMI", "Ergonomie"],
                tags: ["Ausgabe", "Hardware"]
            },
            {
                id: "drucker",
                title: "Drucker",
                category: "ausgabe",
                definition: "Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit.",
                content: "Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse quam nihil molestiae consequatur, vel illum qui dolorem eum fugiat quo voluptas nulla pariatur?",
                businessValue: "At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis.",
                related: ["Plotter", "Scanner"],
                tags: ["Output", "Peripherie"]
            },
            {
                id: "ergonomie",
                title: "Ergonomie",
                category: "grundlagen",
                definition: "Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore.",
                content: "Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae. Itaque earum rerum hic tenetur a sapiente delectus.",
                businessValue: "Ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus.",
                related: ["Monitor", "Tastatur"],
                tags: ["Gesundheit", "Beratung"]
            }
        ];

        const categories = [
            { id: 'dashboard', name: 'Wiki-Zentrale', icon: 'home' },
            { id: 'glossar', name: 'A-Z Index', icon: 'list' },
            { id: 'grundlagen', name: 'Grundkonzepte', icon: 'layers' },
            { id: 'hardware', name: 'Hardware-Komponenten', icon: 'cpu' },
            { id: 'ausgabe', name: 'Ausgabe-Geräte', icon: 'monitor' },
            { id: 'speicherung', name: 'Speicherung', icon: 'hard-drive' }
        ];

        // --- STATE ---
        let currentTab = 'dashboard';
        let searchTerm = '';
        let selectedArticleId = null;

        // --- DOM ELEMENTS ---
        const navContainer = document.getElementById('sidebar-nav');
        const viewContainer = document.getElementById('view-container');
        const searchInput = document.getElementById('search-input');

        // --- LOGIC ---
        function init() {
            renderSidebar();
            renderView();
            
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                if (searchTerm) {
                    selectedArticleId = null;
                }
                renderView();
            });
        }

        function renderSidebar() {
            navContainer.innerHTML = categories.map(cat => `
                <button 
                    onclick="switchTab('${cat.id}')"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${currentTab === cat.id && !searchTerm ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'}"
                >
                    <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                    <span class="text-sm">${cat.name}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function switchTab(id) {
            currentTab = id;
            searchTerm = '';
            selectedArticleId = null;
            searchInput.value = '';
            renderSidebar();
            renderView();
        }

        function openArticle(id) {
            selectedArticleId = id;
            searchTerm = '';
            renderView();
            document.getElementById('content-area').scrollTo(0, 0);
        }

        function renderView() {
            if (selectedArticleId) {
                renderArticleView();
            } else if (searchTerm) {
                renderSearchView();
            } else if (currentTab === 'dashboard') {
                renderDashboard();
            } else if (currentTab === 'glossar') {
                renderGlossary();
            } else {
                renderCategoryView();
            }
            lucide.createIcons();
        }

        function renderDashboard() {
            viewContainer.innerHTML = `
                <div class="space-y-10 animate-in fade-in duration-500">
                    <section>
                        <h2 class="text-3xl font-bold text-slate-900 mb-2">Wiki Demo-Modus</h2>
                        <p class="text-slate-500 text-lg">Dies ist eine Vorschau der Benutzeroberfläche. Alle inhaltlichen Texte wurden vorübergehend durch Platzhalter ersetzt.</p>
                    </section>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div onclick="switchTab('grundlagen')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="layers" class="text-indigo-600 mb-4 w-8 h-8"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">Grundlagen-Layout</h3>
                            <p class="text-slate-500 text-sm leading-relaxed">Hier werden später die fundamentalen Konzepte wie das EVA-Prinzip dargestellt.</p>
                        </div>
                        <div onclick="switchTab('hardware')" class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                            <i data-lucide="cpu" class="text-indigo-600 mb-4 w-8 h-8"></i>
                            <h3 class="text-xl font-bold mb-2 group-hover:text-indigo-600">Hardware-Layout</h3>
                            <p class="text-slate-500 text-sm leading-relaxed">Übersicht über die geplanten Hardware-Komponenten im Lexikon-Stil.</p>
                        </div>
                    </div>

                    <section class="bg-indigo-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-xl shadow-indigo-200">
                        <div class="relative z-10">
                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                                <i data-lucide="zap" class="text-yellow-400 w-5 h-5"></i> Platzhalter-Tipp
                            </h3>
                            <p class="text-indigo-100 italic mb-0 text-lg leading-relaxed">
                                "In diesem Bereich werden dynamische Tipps für das Verkaufsteam angezeigt, um den Nutzen der Hardware hervorzuheben."
                            </p>
                        </div>
                    </section>
                </div>
            `;
        }

        function renderGlossary() {
            const sorted = [...wikiData].sort((a, b) => a.title.localeCompare(b.title));
            viewContainer.innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold">A-Z Index (Vorschau)</h2>
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div class="divide-y divide-slate-100">
                            ${sorted.map(art => `
                                <div onclick="openArticle('${art.id}')" class="p-4 hover:bg-slate-50 cursor-pointer flex items-center justify-between group">
                                    <div>
                                        <span class="font-bold text-slate-800">${art.title}</span>
                                        <p class="text-xs text-slate-400 mt-1">${art.definition.substring(0, 60)}...</p>
                                    </div>
                                    <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-5 h-5 transition-transform group-hover:translate-x-1"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCategoryView() {
            const filtered = wikiData.filter(a => a.category === currentTab);
            const catName = categories.find(c => c.id === currentTab)?.name;
            viewContainer.innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold">${catName}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${filtered.map(art => `
                            <div onclick="openArticle('${art.id}')" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:border-indigo-200 cursor-pointer transition-all">
                                <h3 class="font-bold text-lg mb-2">${art.title}</h3>
                                <p class="text-sm text-slate-500 line-clamp-2">${art.definition}</p>
                                <div class="mt-4 flex gap-2">
                                    ${art.tags.slice(0, 2).map(t => `<span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase font-bold tracking-tighter">${t}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSearchView() {
            const filtered = wikiData.filter(a => 
                a.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                a.definition.toLowerCase().includes(searchTerm.toLowerCase())
            );
            viewContainer.innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold">Suche: "${searchTerm}"</h2>
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        ${filtered.length > 0 ? `
                            <div class="divide-y divide-slate-100">
                                ${filtered.map(art => `
                                    <div onclick="openArticle('${art.id}')" class="p-4 hover:bg-slate-50 cursor-pointer flex items-center justify-between group">
                                        <div>
                                            <span class="font-bold text-slate-800">${art.title}</span>
                                            <p class="text-xs text-slate-400 mt-1">${art.definition.substring(0, 60)}...</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="text-slate-300 group-hover:text-indigo-600 w-5 h-5 transition-transform"></i>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<div class="p-10 text-center text-slate-400">Keine Einträge für diese Suche gefunden.</div>'}
                    </div>
                </div>
            `;
        }

        function renderArticleView() {
            const article = wikiData.find(a => a.id === selectedArticleId);
            if (!article) return;

            viewContainer.innerHTML = `
                <article class="bg-white border border-slate-200 rounded-3xl p-8 md:p-12 shadow-sm animate-in zoom-in-95 duration-300">
                    <button onclick="selectedArticleId=null; renderView();" class="mb-8 text-indigo-600 text-sm font-bold flex items-center gap-1 hover:underline">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Zurück zur Übersicht
                    </button>
                    
                    <header class="mb-8">
                        <h1 class="text-4xl font-black text-slate-900 mb-4">${article.title}</h1>
                        <p class="text-xl text-slate-500 font-medium leading-relaxed italic border-l-4 border-indigo-500 pl-6">
                            ${article.definition}
                        </p>
                    </header>

                    <div class="article-content text-slate-700 leading-relaxed text-lg mb-10">
                        <h4 class="text-lg font-bold mb-3 text-slate-900 underline decoration-indigo-200 underline-offset-4">Detaillierte Informationen</h4>
                        <p>${article.content}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                            <h4 class="text-indigo-900 font-bold mb-2 flex items-center gap-2">
                                <i data-lucide="shield-check" class="w-5 h-5"></i> Vertriebs-Aspekt
                            </h4>
                            <p class="text-indigo-800 text-sm leading-relaxed">${article.businessValue}</p>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                            <h4 class="text-slate-900 font-bold mb-2 flex items-center gap-2">
                                <i data-lucide="arrow-right-left" class="w-5 h-5"></i> Querverweise
                            </h4>
                            <div class="flex flex-wrap gap-2">
                                ${article.related.map(rel => {
                                    const target = wikiData.find(a => a.title.toLowerCase() === rel.toLowerCase());
                                    return `<button onclick="openArticle('${target?.id || '#'}')" class="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-full hover:border-indigo-400 hover:text-indigo-600 transition-all font-medium">${rel}</button>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        ${article.tags.map(t => `<span class="text-[10px] bg-slate-900 text-white px-3 py-1 rounded-full font-bold uppercase tracking-widest">${t}</span>`).join('')}
                    </div>
                </article>
            `;
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
